name: "opencode GitHub Action"
description: "Run opencode in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use (overrides config file)"
    required: false

  config:
    description: "Path to opencode config file (defaults to .github/opencode.json)"
    required: false

  config_env:
    description: "Environment variables for config (multiline key=value format)"
    required: false

  share:
    description: "Share the opencode session (defaults to true for public repos)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install opencode
      shell: bash
      run: curl -fsSL https://opencode.ai/install | bash

    - name: Run opencode
      shell: bash
      id: run_opencode
      run: opencode github run
      env:
        MODEL: ${{ inputs.model }}
        OPENCODE_CONFIG: ${{ inputs.config }}
        CONFIG_ENV: ${{ inputs.config_env }}
        SHARE: ${{ inputs.share }}
