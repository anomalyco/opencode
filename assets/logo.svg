<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: terminal prompt bracket -->
  <rect x="4" y="4" width="72" height="72" rx="14" ry="14" fill="url(#grad)" />

  <!-- > _ symbol -->
  <text x="16" y="52" font-family="monospace, 'Courier New'" font-size="32" font-weight="bold" fill="white">&gt;_</text>

  <!-- Wordmark -->
  <text x="92" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#0f172a" letter-spacing="-1">Co<tspan fill="url(#grad)">Builder</tspan></text>
</svg>
