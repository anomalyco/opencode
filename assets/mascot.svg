<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="300" height="260" shape-rendering="crispEdges">
  <!-- Light warm background matching CobuilderLabs org avatar style -->
  <rect width="300" height="260" fill="#f3ece6"/>

  <!--
    Pixel grid: 20×20px blocks, offset x=10, y=10
    14 cols (0–13) × 12 rows (0–11)
    Dog faces RIGHT. Tail curls up on the LEFT. Ear spikes up on the RIGHT.

    Main color:  #c08055  (warm fawn — matches GitHub avatar)
    Dark accent: #5a2808  (eye, nose)

    Layout per row:
      r0:  tail tip (col 2)           + ear tip (col 9)
      r1:  tail     (cols 1–2)        + ear     (cols 8–9)
      r2:  tail     (cols 0–2)        + head    (cols 6–11)
      r3:  tail     (cols 0–1) | gap  + body+snout (cols 3–13) [col 13 = nose]
      r4:  body+snout (cols 3–13)     [col 10 = eye, col 13 = nose]
      r5:  body     (cols 3–11)
      r6:  body     (cols 3–11)
      r7:  body     (cols 3–11)
      r8:  body     (cols 3–11)
      r9:  legs     (cols 4–5) + legs (cols 9–10)
      r10: legs     (cols 4–5) + legs (cols 9–10)
      r11: paws     (cols 3–5) + paws (cols 8–11)
  -->

  <!-- ROW 0 — tail tip + ear tip -->
  <rect x="50"  y="10" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="10" width="20" height="20" fill="#c08055"/>

  <!-- ROW 1 — tail + ear -->
  <rect x="30"  y="30" width="20" height="20" fill="#c08055"/>
  <rect x="50"  y="30" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="30" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="30" width="20" height="20" fill="#c08055"/>

  <!-- ROW 2 — tail (0–2) + head (6–11) -->
  <rect x="10"  y="50" width="20" height="20" fill="#c08055"/>
  <rect x="30"  y="50" width="20" height="20" fill="#c08055"/>
  <rect x="50"  y="50" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="50" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="50" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="50" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="50" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="50" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="50" width="20" height="20" fill="#c08055"/>

  <!-- ROW 3 — tail (0–1) | gap at col2 | body+snout (3–12) + nose (13, dark) -->
  <rect x="10"  y="70" width="20" height="20" fill="#c08055"/>
  <rect x="30"  y="70" width="20" height="20" fill="#c08055"/>
  <rect x="70"  y="70" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="70" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="250" y="70" width="20" height="20" fill="#c08055"/>
  <rect x="270" y="70" width="20" height="20" fill="#5a2808"/>

  <!-- ROW 4 — body+snout (3–12), eye (10, dark), nose (13, dark) -->
  <rect x="70"  y="90" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="90" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="90" width="20" height="20" fill="#5a2808"/>
  <rect x="230" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="250" y="90" width="20" height="20" fill="#c08055"/>
  <rect x="270" y="90" width="20" height="20" fill="#5a2808"/>

  <!-- ROW 5 — body (3–11) -->
  <rect x="70"  y="110" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="110" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="110" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="110" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="110" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="110" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="110" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="110" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="110" width="20" height="20" fill="#c08055"/>

  <!-- ROW 6 — body (3–11) -->
  <rect x="70"  y="130" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="130" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="130" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="130" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="130" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="130" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="130" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="130" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="130" width="20" height="20" fill="#c08055"/>

  <!-- ROW 7 — body (3–11) -->
  <rect x="70"  y="150" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="150" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="150" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="150" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="150" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="150" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="150" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="150" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="150" width="20" height="20" fill="#c08055"/>

  <!-- ROW 8 — body (3–11) -->
  <rect x="70"  y="170" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="170" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="170" width="20" height="20" fill="#c08055"/>
  <rect x="130" y="170" width="20" height="20" fill="#c08055"/>
  <rect x="150" y="170" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="170" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="170" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="170" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="170" width="20" height="20" fill="#c08055"/>

  <!-- ROW 9 — back legs (4–5) + front legs (9–10) -->
  <rect x="90"  y="190" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="190" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="190" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="190" width="20" height="20" fill="#c08055"/>

  <!-- ROW 10 — legs -->
  <rect x="90"  y="210" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="210" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="210" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="210" width="20" height="20" fill="#c08055"/>

  <!-- ROW 11 — paws (wider than legs) -->
  <rect x="70"  y="230" width="20" height="20" fill="#c08055"/>
  <rect x="90"  y="230" width="20" height="20" fill="#c08055"/>
  <rect x="110" y="230" width="20" height="20" fill="#c08055"/>
  <rect x="170" y="230" width="20" height="20" fill="#c08055"/>
  <rect x="190" y="230" width="20" height="20" fill="#c08055"/>
  <rect x="210" y="230" width="20" height="20" fill="#c08055"/>
  <rect x="230" y="230" width="20" height="20" fill="#c08055"/>
</svg>
