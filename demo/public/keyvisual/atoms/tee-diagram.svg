<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" data-name="atom-tee-diagram">
  <rect width="900" height="320" fill="#131010"/>
  
    <defs>
      <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fc533a"/>
        <stop offset="100%" stop-color="#034cff"/>
