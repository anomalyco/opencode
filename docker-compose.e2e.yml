# E2E Test Environment
# Usage: docker compose -f docker-compose.e2e.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veritly
      POSTGRES_PASSWORD: veritly
      POSTGRES_DB: veritly
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritly"]
      interval: 2s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q qwen2.5"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  executor:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    ports:
      - "18080:7777"
    environment:
      - PORT=7777
      - EXECUTOR_MODE=container
    privileged: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/health"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  ollama-data:
    driver: local
