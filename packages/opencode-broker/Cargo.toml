[package]
name = "opencode-broker"
version = "0.1.0"
edition = "2024"
description = "Privileged authentication broker for opencode"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
nonstick = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["codec"] }
governor = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
nix = { version = "0.29", features = ["process", "signal", "user", "term", "fs"] }
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"
futures = "0.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[features]
test-spawn-bin = []

[[bin]]
name = "test-spawn"
path = "src/bin/test-spawn.rs"
required-features = ["test-spawn-bin"]

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"
