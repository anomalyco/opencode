id = "octopus"
name = "Octopus"
description = "Octopus, the open source coding agent."
version = "1.14.46"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/octopus"

[agent_servers.octopus]
name = "Octopus"
icon = "./icons/octopus.svg"

[agent_servers.octopus.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/opencode/releases/download/v1.14.46/octopus-darwin-arm64.zip"
cmd = "./octopus"
args = ["acp"]

[agent_servers.octopus.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/opencode/releases/download/v1.14.46/octopus-darwin-x64.zip"
cmd = "./octopus"
args = ["acp"]

[agent_servers.octopus.targets.linux-aarch64]
archive = "https://github.com/anomalyco/opencode/releases/download/v1.14.46/octopus-linux-arm64.tar.gz"
cmd = "./octopus"
args = ["acp"]

[agent_servers.octopus.targets.linux-x86_64]
archive = "https://github.com/anomalyco/opencode/releases/download/v1.14.46/octopus-linux-x64.tar.gz"
cmd = "./octopus"
args = ["acp"]

[agent_servers.octopus.targets.windows-x86_64]
archive = "https://github.com/anomalyco/opencode/releases/download/v1.14.46/octopus-windows-x64.zip"
cmd = "./octopus.exe"
args = ["acp"]
