id = "crazycode"
name = "CrazyCode"
description = "The open source coding agent."
version = "1.1.12"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/crazycode"

[agent_servers.crazycode]
name = "CrazyCode"
icon = "./icons/crazycode.svg"

[agent_servers.crazycode.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/crazycode/releases/download/v1.1.12/crazycode-darwin-arm64.zip"
cmd = "./crazycode"
args = ["acp"]

[agent_servers.crazycode.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/crazycode/releases/download/v1.1.12/crazycode-darwin-x64.zip"
cmd = "./crazycode"
args = ["acp"]

[agent_servers.crazycode.targets.linux-aarch64]
archive = "https://github.com/anomalyco/crazycode/releases/download/v1.1.12/crazycode-linux-arm64.tar.gz"
cmd = "./crazycode"
args = ["acp"]

[agent_servers.crazycode.targets.linux-x86_64]
archive = "https://github.com/anomalyco/crazycode/releases/download/v1.1.12/crazycode-linux-x64.tar.gz"
cmd = "./crazycode"
args = ["acp"]

[agent_servers.crazycode.targets.windows-x86_64]
archive = "https://github.com/anomalyco/crazycode/releases/download/v1.1.12/crazycode-windows-x64.zip"
cmd = "./crazycode.exe"
args = ["acp"]
