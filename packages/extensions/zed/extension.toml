id = "xcsh"
name = "OpenCode"
description = "The open source coding agent."
version = "1.3.13"
schema_version = 1
authors = ["Anomaly"]
repository = "https://github.com/anomalyco/xcsh"

[agent_servers.xcsh]
name = "OpenCode"
icon = "./icons/xcsh.svg"

[agent_servers.xcsh.targets.darwin-aarch64]
archive = "https://github.com/anomalyco/xcsh/releases/download/v1.3.13/xcsh-darwin-arm64.zip"
cmd = "./xcsh"
args = ["acp"]

[agent_servers.xcsh.targets.darwin-x86_64]
archive = "https://github.com/anomalyco/xcsh/releases/download/v1.3.13/xcsh-darwin-x64.zip"
cmd = "./xcsh"
args = ["acp"]

[agent_servers.xcsh.targets.linux-aarch64]
archive = "https://github.com/anomalyco/xcsh/releases/download/v1.3.13/xcsh-linux-arm64.tar.gz"
cmd = "./xcsh"
args = ["acp"]

[agent_servers.xcsh.targets.linux-x86_64]
archive = "https://github.com/anomalyco/xcsh/releases/download/v1.3.13/xcsh-linux-x64.tar.gz"
cmd = "./xcsh"
args = ["acp"]

[agent_servers.xcsh.targets.windows-x86_64]
archive = "https://github.com/anomalyco/xcsh/releases/download/v1.3.13/xcsh-windows-x64.zip"
cmd = "./xcsh.exe"
args = ["acp"]
