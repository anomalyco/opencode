<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="tentacle-grad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="eye-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>

  <!-- Head shape -->
  <path d="
    M 256 105
    C 308 105, 348 120, 366 168
    C 384 216, 370 252, 350 274
    C 338 288, 312 295, 256 295
    C 200 295, 174 288, 162 274
    C 142 252, 128 216, 146 168
    C 164 120, 204 105, 256 105
    Z
  " fill="url(#body-grad)"/>

  <!-- Left ear/head bump -->
  <path d="
    M 158 160
    C 130 168, 108 182, 100 200
    C 94 214, 100 228, 116 232
    C 128 235, 142 238, 156 238
    C 150 218, 148 196, 158 160
    Z
  " fill="url(#tentacle-grad)"/>

  <!-- Right ear/head bump -->
