<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode</title>
    <link rel="icon" type="image/png" href="/favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="shortcut icon" href="/favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" />
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #131010;
        color: #f3efe7;
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f8f7f7;
          color: #1a1716;
        }
      }

      .desktop-startup {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(218, 126, 27, 0.14), transparent 38%),
          radial-gradient(circle at bottom, rgba(255, 255, 255, 0.05), transparent 42%), #131010;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 260ms ease,
          visibility 260ms ease;
        pointer-events: all;
      }

      @media (prefers-color-scheme: light) {
        .desktop-startup {
          background:
            radial-gradient(circle at top, rgba(218, 126, 27, 0.12), transparent 38%),
            radial-gradient(circle at bottom, rgba(0, 0, 0, 0.035), transparent 42%), #f8f7f7;
        }
      }

      .desktop-startup.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .desktop-startup-shell {
        display: flex;
        width: min(420px, calc(100vw - 48px));
        flex-direction: column;
        align-items: center;
        gap: 24px;
        text-align: center;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .desktop-startup-stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 132px;
        height: 132px;
      }

      .desktop-startup-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      @media (prefers-color-scheme: light) {
        .desktop-startup-ring {
          border-color: rgba(0, 0, 0, 0.12);
        }
      }

      .desktop-startup-ring-a {
        animation: desktop-startup-spin 7s linear infinite;
      }

      .desktop-startup-ring-b {
        inset: 14px;
        border-color: rgba(218, 126, 27, 0.38);
        animation: desktop-startup-spin 4.2s linear infinite reverse;
      }

      .desktop-startup-ring-c {
        inset: 28px;
        border-style: dashed;
        border-color: rgba(218, 126, 27, 0.55);
        animation: desktop-startup-pulse 1.8s ease-in-out infinite;
      }

      .desktop-startup-mark {
        width: 42px;
        height: 52px;
        opacity: 0.94;
        filter: drop-shadow(0 8px 30px rgba(218, 126, 27, 0.18));
      }

      .desktop-startup-copy {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .desktop-startup-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .desktop-startup-text {
        color: rgba(243, 239, 231, 0.72);
        font-size: 14px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: light) {
        .desktop-startup-text {
          color: rgba(26, 23, 22, 0.7);
        }
      }

      .desktop-startup-steps {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .desktop-startup-step {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.035);
        color: rgba(243, 239, 231, 0.7);
        font-size: 12px;
        line-height: 1;
        transition:
          color 180ms ease,
          border-color 180ms ease,
          background-color 180ms ease,
          transform 180ms ease;
      }

      @media (prefers-color-scheme: light) {
        .desktop-startup-step {
          border-color: rgba(0, 0, 0, 0.1);
          background: rgba(0, 0, 0, 0.03);
          color: rgba(26, 23, 22, 0.68);
        }
      }

      .desktop-startup-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        transition: background-color 180ms ease;
      }

      @media (prefers-color-scheme: light) {
        .desktop-startup-dot {
          background: rgba(0, 0, 0, 0.18);
        }
      }

      .desktop-startup[data-phase="backend"] [data-step="backend"],
      .desktop-startup[data-phase="project"] [data-step="project"],
      .desktop-startup[data-phase="session"] [data-step="session"] {
        color: inherit;
        border-color: rgba(218, 126, 27, 0.54);
        background: rgba(218, 126, 27, 0.1);
        transform: translateY(-1px);
      }

      .desktop-startup[data-phase="backend"] [data-step="backend"] .desktop-startup-dot,
      .desktop-startup[data-phase="project"] [data-step="project"] .desktop-startup-dot,
      .desktop-startup[data-phase="session"] [data-step="session"] .desktop-startup-dot,
      .desktop-startup[data-phase="ready"] .desktop-startup-dot {
        background: #da7e1b;
      }

      .desktop-startup[data-phase="project"] [data-step="backend"],
      .desktop-startup[data-phase="session"] [data-step="backend"],
      .desktop-startup[data-phase="ready"] [data-step="backend"],
      .desktop-startup[data-phase="session"] [data-step="project"],
      .desktop-startup[data-phase="ready"] [data-step="project"],
      .desktop-startup[data-phase="ready"] [data-step="session"] {
        color: inherit;
        border-color: rgba(218, 126, 27, 0.4);
      }

      @keyframes desktop-startup-spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      @keyframes desktop-startup-pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.96);
        }

        50% {
          opacity: 1;
          transform: scale(1.03);
        }
      }
    </style>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="oc-startup-shell" class="desktop-startup" data-phase="launch" aria-live="polite" aria-busy="true">
      <div class="desktop-startup-shell">
        <div class="desktop-startup-stage" aria-hidden="true">
          <div class="desktop-startup-ring desktop-startup-ring-a"></div>
          <div class="desktop-startup-ring desktop-startup-ring-b"></div>
          <div class="desktop-startup-ring desktop-startup-ring-c"></div>
          <svg class="desktop-startup-mark" viewBox="0 0 80 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 80H20V40H60V80Z" fill="var(--icon-base)" />
            <path d="M60 20H20V80H60V20ZM80 100H0V0H80V100Z" fill="var(--icon-strong-base)" />
          </svg>
        </div>
        <div class="desktop-startup-copy">
          <div id="oc-startup-title" class="desktop-startup-title">Opening OpenCode</div>
          <div id="oc-startup-text" class="desktop-startup-text">Preparing the app for your next action.</div>
        </div>
        <div class="desktop-startup-steps" aria-hidden="true">
          <div class="desktop-startup-step" data-step="backend">
            <span class="desktop-startup-dot"></span>
            <span>Local backend</span>
          </div>
          <div class="desktop-startup-step" data-step="project">
            <span class="desktop-startup-dot"></span>
            <span>Workspace</span>
          </div>
          <div class="desktop-startup-step" data-step="session">
            <span class="desktop-startup-dot"></span>
            <span>Session</span>
          </div>
        </div>
      </div>
    </div>
    <div id="root" class="flex flex-col h-dvh"></div>
    <div data-tauri-decorum-tb class="w-0 h-0 hidden" />
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
