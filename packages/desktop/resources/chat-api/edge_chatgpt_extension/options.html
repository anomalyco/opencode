<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本机聊天连接</title>
<body><h1>连接 Python 聊天客户端</h1>
<p>将 python chatgpt_dom_bridge.py 显示的连接配置粘贴到此处。配置仅保存在本次浏览器会话，不保存 ChatGPT 登录令牌。</p>
<textarea id="config" rows="5" cols="75" aria-label="连接配置"></textarea>
<p><button id="connect">连接</button> <button id="disconnect">断开</button></p>
<p id="status" role="status"></p><script src="options.js"></script></body></html>
