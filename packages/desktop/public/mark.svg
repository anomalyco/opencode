<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" fill="none">
  <!-- OpenWork OW Mark - icon only -->
  <g stroke="#4a4a4a" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- O - outer circle -->
    <circle cx="40" cy="50" r="30" />
    <!-- O - inner circle -->
    <circle cx="40" cy="50" r="17" />

    <!-- W - constructed as connected lines forming the letter -->
    <!-- Left vertical -->
    <line x1="95" y1="25" x2="95" y2="75" />
    <!-- First diagonal - top left to middle -->
    <line x1="95" y1="25" x2="115" y2="25" />
    <line x1="115" y1="25" x2="115" y2="75" />
    <!-- Middle peak -->
    <line x1="115" y1="25" x2="135" y2="50" />
    <!-- Right side -->
    <line x1="135" y1="50" x2="155" y2="25" />
    <line x1="155" y1="25" x2="175" y2="25" />
    <line x1="175" y1="25" x2="175" y2="75" />
  </g>
</svg>
