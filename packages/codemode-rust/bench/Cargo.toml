[package]
name = "psychoscript-bench"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
psychoscript = { path = "../crates/psychoscript" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
# Per-run heap counts for the memory benchmarks (`examples/gc_bench.rs`).
gc-stats = ["psychoscript/gc-stats"]

[[example]]
name = "gc_bench"
required-features = ["gc-stats"]
