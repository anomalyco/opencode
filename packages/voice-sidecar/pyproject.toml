[project]
name = "opencode-voice-sidecar"
version = "0.0.0"
description = "Voice sidecar for opencode (Phase 0 STT, Phase 1 opencode, Phase 2 voice API)"
requires-python = ">=3.9"
dependencies = [
  "sounddevice>=0.4.6",
  "numpy>=1.24",
  "httpx>=0.27",
  "websockets>=13",
  "starlette>=0.41",
  "uvicorn>=0.32",
]

[project.scripts]
voice-stt = "voice_sidecar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_sidecar"]
