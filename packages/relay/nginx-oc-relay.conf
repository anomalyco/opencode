# OpenCode Relay — nginx TLS terminator
#
# nginx owns the public 9999 port and terminates TLS with the Let's Encrypt IP
# certificate (SAN=IP:<your-server-ip>). The relay control plane itself listens on
# loopback 127.0.0.1:9998 and is never exposed directly.
#
# This file does NOT touch the existing lumina-agent site.

# WebSocket upgrade needs an explicit Connection header value.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream oc_relay_backend {
    server 127.0.0.1:9998;
    keepalive 128;
}

server {
    listen 9999 ssl;
    listen [::]:9999 ssl;
    http2 on;
    server_name <your-domain>;

    ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:OC:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # The relay serves the opencode API surface for the App, which includes
    # long-lived SSE streams and terminal WebSockets. Buffering must be off.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 32m;

    location / {
        proxy_pass http://oc_relay_backend;
    }
}

# ACME HTTP-01 for renewing the IP certificate is intentionally NOT configured
# here.
#
# certbot authenticates the IP certificate with the webroot plugin, which
# validates against the IP itself: the challenge request arrives with
# Host: <your-server-ip> and must resolve to /var/www/html. The existing
# lumina-agent site already owns port 80 for that exact Host (it is the site
# users hit to download the APK), so no separate server block can be selected
# for it.
#
# A competing `listen 80` block here is actively harmful: nginx.conf includes
# conf.d/ before sites-enabled/, so this file is registered first and would
# become the implicit default server for port 80, silently taking the existing
# site offline.
#
# The challenge location therefore lives inside the lumina-agent server block
# (see nginx-lumina-agent.conf), where `^~ /.well-known/acme-challenge/`
# takes precedence over that site's SPA fallback to index.html.
