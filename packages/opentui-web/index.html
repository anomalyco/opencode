<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTUI Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Berkeley Mono", "JetBrains Mono", "Monaco", "Courier New", monospace;
        font-size: 16px;
        background: #1a1a1a;
        color: #d4d4d4;
        overflow: hidden;
      }
      #root {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      /* Electron transparent title bar support */
      body.electron #root {
        margin-top: 20px; /* Space for Electron title bar */
        height: calc(100vh - 20px);
        position: relative;
      }
      /* Draggable title bar overlay for Electron */
      body.electron #root::before {
        content: "";
        position: absolute;
        top: -20px;
        left: 0;
        right: 0;
        height: 20px;
        -webkit-app-region: drag; /* Make draggable */
        -webkit-user-select: none;
        user-select: none;
        pointer-events: none; /* Allow clicks through to content below */
        z-index: 9999;
      }
      /* Non-draggable for interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        -webkit-app-region: no-drag;
      }
      /* Center SESSIONS title and hide collapse in Electron mode */
      body.electron .sessions-title {
        text-align: center;
        width: 100%;
        left: 0 !important;
      }
      body.electron .sessions-collapse {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
