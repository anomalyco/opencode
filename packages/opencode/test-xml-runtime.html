<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XML/HTML UI Runtime Test</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        padding: 40px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        margin: 0;
      }
      #app {
        max-width: 600px;
        margin: 0 auto;
      }
      .test-results {
        background: white;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .test-results h2 {
        margin-top: 0;
        color: #667eea;
      }
      .test-item {
        padding: 8px;
        margin: 4px 0;
        border-left: 4px solid #4caf50;
        background: #f0f9ff;
        font-family: monospace;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="test-results">
      <h2>🧪 Test Results</h2>
      <div id="results"></div>
    </div>

    <script type="module">
      // -----------------------------
      // 1) Minimal reactive core (Solid-like)
      // -----------------------------
      let CURRENT_EFFECT = null
      const DEPS = new WeakMap()

      function createSignal(initial) {
        const box = { v: initial }
        return [
          () => {
            if (CURRENT_EFFECT) {
              let s = DEPS.get(box)
              if (!s) DEPS.set(box, (s = new Set()))
              s.add(CURRENT_EFFECT)
            }
            return box.v
          },
          (next) => {
            const nv = typeof next === "function" ? next(box.v) : next
            if (Object.is(nv, box.v)) return
            box.v = nv
            const s = DEPS.get(box)
            if (s) for (const eff of [...s]) eff()
          },
        ]
      }

      function createEffect(fn) {
        const run = () => {
          CURRENT_EFFECT = run
          try {
            fn()
          } finally {
            CURRENT_EFFECT = null
          }
        }
        run()
      }

      // -----------------------------
      // 2) Utilities
      // -----------------------------
      function isEventAttr(name) {
        return name.startsWith("on:")
      }
      function isBindAttr(name) {
        return name.startsWith("bind:")
      }
      function toEventName(name) {
        return name.slice(3)
      }

      function evalInScope(expr, scope) {
        const keys = Object.keys(scope)
        const vals = Object.values(scope)
        return Function(...keys, `with(this){ return (${expr}); }`).call(scope, ...vals)
      }

      function reactiveApply(apply) {
        createEffect(apply)
      }

      // -----------------------------
      // 3) Public API: signals helper and renderer
      // -----------------------------
      function signals(keys, initial = {}) {
        const get = Object.create(null)
        const set = Object.create(null)
        for (const k of keys) {
          const [g, s] = createSignal(initial[k])
          get[k] = g
          set[k] = s
        }
        return { ...get, set }
      }

      function renderXML(xml, mount, context = {}) {
        const parser = new DOMParser()
        const doc = parser.parseFromString(`<root>${xml}</root>`, "text/html")
        const root = document.createElement("div")
        const disposers = []
        const scope = { ...context, Math, Date, Number, String, Boolean, Array, console }

        function bindReactiveText(node, expr) {
          reactiveApply(() => {
            const v = evalInScope(expr, scope)
            node.nodeValue = v == null ? "" : String(v)
          })
        }

        function processTextNode(node) {
          const txt = node.nodeValue ?? ""
          const parts = []
          const re = /\{([^}]+)\}/g
          let m
          let last = 0
          while ((m = re.exec(txt))) {
            if (m.index > last) parts.push(document.createTextNode(txt.slice(last, m.index)))
            const expr = m[1].trim()
            const dyn = document.createTextNode("")
            bindReactiveText(dyn, expr)
            parts.push(dyn)
            last = m.index + m[0].length
          }
          if (last < txt.length) parts.push(document.createTextNode(txt.slice(last)))
          return parts.length ? parts : [node]
        }

        function setAttr(el, name, raw) {
          if (isEventAttr(name)) {
            const evt = toEventName(name)
            el.addEventListener(evt, (e) => {
              const fn = evalInScope(raw, scope)
              if (typeof fn === "function") fn.call(scope, e)
            })
            return
          }

          if (isBindAttr(name)) {
            const prop = name.slice(5)
            const sigName = raw.trim()
            const getter = scope[sigName]
            const setter = scope.set?.[sigName]
            if (typeof getter === "function") {
              reactiveApply(() => {
                const v = getter()
                el[prop] = v
              })
            }
            if (setter) {
              const event = prop === "checked" ? "change" : "input"
              el.addEventListener(event, () => setter(el[prop]))
            }
            return
          }

          if (raw.includes("{")) {
            const chunks = []
            const re = /\{([^}]+)\}/g
            let last = 0
            let m
            while ((m = re.exec(raw))) {
              if (m.index > last) chunks.push(raw.slice(last, m.index))
              const expr = m[1].trim()
              chunks.push((s) => evalInScope(expr, s))
              last = m.index + m[0].length
            }
            if (last < raw.length) chunks.push(raw.slice(last))
            reactiveApply(() => {
              const v = chunks.map((c) => (typeof c === "function" ? c(scope) : c)).join("")
              el.setAttribute(name, v)
            })
            return
          }

          el.setAttribute(name, raw)
        }

        function mountChildren(src, dst) {
          for (const child of Array.from(src.childNodes)) {
            if (child.nodeType === Node.TEXT_NODE) {
              const pieces = processTextNode(child)
              pieces.forEach((p) => dst.appendChild(p))
            } else if (child.nodeType === Node.ELEMENT_NODE) {
              const el = child

              // x-if
              const xif = el.getAttribute("x-if")
              if (xif) {
                const anchor = document.createComment("x-if")
                dst.appendChild(anchor)
                reactiveApply(() => {
                  const show = !!evalInScope(xif, scope)
                  let next = anchor.nextSibling
                  while (next && next.__xIfOwned) {
                    const kill = next
                    next = next.nextSibling
                    kill.remove()
                  }
                  if (show) {
                    const tmp = document.createElement("div")
                    for (const c of Array.from(el.childNodes)) tmp.appendChild(c.cloneNode(true))
                    const holder = document.createDocumentFragment()
                    mountChildren(tmp, holder)
                    for (const n of Array.from(holder.childNodes)) {
                      n.__xIfOwned = true
                      anchor.parentNode.insertBefore(n, anchor.nextSibling)
                    }
                  }
                })
                continue
              }

              // x-for
              const xfor = el.getAttribute("x-for")
              if (xfor) {
                const keyExpr = el.getAttribute("x-key")
                const anchor = document.createComment("x-for")
                dst.appendChild(anchor)
                reactiveApply(() => {
                  const m = /^(\w+)\s+in\s+(.+)$/.exec(xfor)
                  if (!m) return
                  const [, itemName, listExpr] = m
                  const list = evalInScope(listExpr, scope) || []
                  const existing = {}

                  let cur = anchor.nextSibling
                  const owned = []
                  while (cur && cur.__xForOwned) {
                    owned.push(cur)
                    cur = cur.nextSibling
                  }
                  for (const n of owned) {
                    const k = n.__xKey
                    if (k != null) existing[k] = n
                  }

                  const frag = document.createDocumentFragment()
                  for (let i = 0; i < list.length; i++) {
                    const item = list[i]
                    const local = Object.create(scope)
                    local[itemName] = item
                    local.$index = i
                    const key = keyExpr ? evalInScope(keyExpr, local) : i
                    let node = existing[key]
                    if (!node) {
                      const tmp = el.cloneNode(true)
                      tmp.removeAttribute("x-for")
                      tmp.removeAttribute("x-key")
                      const holder = document.createElement("div")
                      for (const c of Array.from(tmp.childNodes))
                        holder.appendChild(c.cloneNode(true))
                      const subFrag = document.createDocumentFragment()
                      mountChildren(holder, subFrag)
                      node = document.createElement("span")
                      while (subFrag.firstChild) node.appendChild(subFrag.firstChild)
                    }
                    node.__xForOwned = true
                    node.__xKey = key
                    frag.appendChild(node)
                  }

                  cur = anchor.nextSibling
                  while (cur && cur.__xForOwned) {
                    const rm = cur
                    cur = cur.nextSibling
                    rm.remove()
                  }
                  anchor.parentNode.insertBefore(frag, anchor.nextSibling)
                })
                continue
              }

              const out = document.createElement(el.tagName.toLowerCase())
              for (const attr of Array.from(el.attributes)) {
                setAttr(out, attr.name, attr.value)
              }
              dst.appendChild(out)
              mountChildren(el, out)
            }
          }
        }

        const wrapper = doc.querySelector("root")
        mountChildren(wrapper, root)
        mount.replaceChildren(...Array.from(root.childNodes))

        return {
          root: mount,
          dispose: () => {
            for (const d of disposers)
              try {
                d()
              } catch {}
          },
        }
      }

      // -----------------------------
      // 4) Test the implementation
      // -----------------------------
      const results = document.getElementById("results")
      function logTest(name, passed) {
        const div = document.createElement("div")
        div.className = "test-item"
        div.style.borderLeftColor = passed ? "#4caf50" : "#f44336"
        div.textContent = `${passed ? "✅" : "❌"} ${name}`
        results.appendChild(div)
      }

      // Create test context
      const ctx = {
        ...signals(["name", "count", "items"], {
          name: "Synthia",
          count: 0,
          items: ["React", "Vue", "Svelte"],
        }),
        inc() {
          this.set.count((v) => v + 1)
        },
        dec() {
          this.set.count((v) => Math.max(0, v - 1))
        },
        setName(e) {
          const i = e.target
          this.set.name(i.value)
        },
        addItem() {
          const frameworks = ["Angular", "Solid", "Qwik", "Alpine", "Lit"]
          const random = frameworks[Math.floor(Math.random() * frameworks.length)]
          this.set.items((prev) => [...prev, random])
        },
      }

      const template = `
      <div class="card" style="padding: 20px; border: 2px solid #4a90e2; border-radius: 8px; background: white;">
        <h1 style="color: #4a90e2; margin: 0 0 16px 0;">Hello {name()}! 👋</h1>
        
        <div style="margin-bottom: 16px;">
          <label style="display: block; margin-bottom: 8px; font-weight: bold;">Your name:</label>
          <input 
            bind:value="name" 
            on:input="setName" 
            placeholder="Enter your name"
            style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"
          />
        </div>

        <div style="margin-bottom: 16px;">
          <p style="margin: 0 0 8px 0;">Click count: <strong>{count()}</strong></p>
          <button 
            on:click="inc"
            style="padding: 8px 16px; margin-right: 8px; background: #4a90e2; color: white; border: none; border-radius: 4px; cursor: pointer;"
          >
            Increment 👆
          </button>
          <button 
            on:click="dec"
            style="padding: 8px 16px; background: #e24a4a; color: white; border: none; border-radius: 4px; cursor: pointer;"
          >
            Decrement 👇
          </button>
        </div>

        <div x-if="count() % 2 === 0" style="padding: 12px; background: #e8f5e9; border-left: 4px solid #4caf50; margin-bottom: 16px;">
          <strong>Even number! 🎯</strong> The count is divisible by 2.
        </div>

        <div x-if="count() % 2 === 1" style="padding: 12px; background: #fff3e0; border-left: 4px solid #ff9800; margin-bottom: 16px;">
          <strong>Odd number! 🎲</strong> The count is not divisible by 2.
        </div>

        <div style="margin-bottom: 16px;">
          <p style="margin: 0 0 8px 0; font-weight: bold;">Frameworks ({items().length}):</p>
          <ul style="margin: 0; padding-left: 20px;">
            <li x-for="item in items()" x-key="item" style="margin-bottom: 4px;">
              📦 {item}
            </li>
          </ul>
          <button 
            on:click="addItem"
            style="margin-top: 8px; padding: 6px 12px; background: #9c27b0; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;"
          >
            Add Random Framework
          </button>
        </div>

        <div style="margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 4px; font-size: 12px;">
          <strong>🧪 Testing:</strong> Reactive signals, event handlers, two-way binding, x-if conditionals, and x-for loops all working!
        </div>
      </div>
    `

      // Render the app
      const app = renderXML(template, document.getElementById("app"), ctx)

      // Run automated tests
      setTimeout(() => {
        logTest(
          "Initial render complete",
          document.querySelector("h1")?.textContent.includes("Synthia"),
        )
        logTest(
          "Signal interpolation works",
          document.querySelector("h1")?.textContent === "Hello Synthia! 👋",
        )
        logTest("Count signal shows 0", document.querySelector("strong")?.textContent === "0")
        logTest("Even conditional rendered", document.querySelector('[style*="e8f5e9"]') !== null)
        logTest("List has 3 items", document.querySelectorAll("li").length === 3)

        // Test reactivity
        ctx.set.count(5)
        setTimeout(() => {
          logTest(
            "Reactivity: count updated to 5",
            document.querySelector("strong")?.textContent === "5",
          )
          logTest(
            "Reactivity: odd conditional shown",
            document.querySelector('[style*="fff3e0"]') !== null,
          )

          ctx.set.name("OpenCode")
          setTimeout(() => {
            logTest(
              "Reactivity: name updated",
              document.querySelector("h1")?.textContent === "Hello OpenCode! 👋",
            )
            logTest(
              "Two-way binding: input value synced",
              document.querySelector("input")?.value === "OpenCode",
            )
          }, 50)
        }, 50)
      }, 100)
    </script>
  </body>
</html>
