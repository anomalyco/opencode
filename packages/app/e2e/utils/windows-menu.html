<!doctype html>
<html lang="en">
  <head>

  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "./windows-menu.fixture.tsx"
      const params = new URLSearchParams(location.search)
      mount({
        server: params.get("server"),
        path: params.get("path") ?? undefined,
        os: params.get("os") === "macos" ? "macos" : undefined,
        openApps: params.get("openApps") === "1",
      })
