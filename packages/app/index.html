<!doctype html>
<html lang="en" style="background-color: var(--c-paper, var(--background-base))">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>OpenCode</title>
    <link rel="icon" type="image/png" href="/favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon-v3.svg" />
    <link rel="shortcut icon" href="/favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/fonts/pretendard/pretendard.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/dist/webfonts/variable/complete.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jetbrains-mono@1.0.6/css/jetbrains-mono.min.css" />
    <!-- 테마를 aura 라이트로 고정(context.tsx)했으므로 prefers-color-scheme 분기 대신 aura --background-base 단일 값 사용 -->
    <meta name="theme-color" content="#f4f2ec" />
    <!-- <meta name="theme-color" content="#F8F7F7" />
    <meta name="theme-color" content="#131010" media="(prefers-color-scheme: dark)" /> -->
    <meta property="og:image" content="/social-share.png" />
    <meta property="twitter:image" content="/social-share.png" />
    <!-- localStorage의 opencode-theme-id/color-scheme을 읽어 data-theme을 설정하는 프리로드 스크립트.
         aura 라이트로 고정한 뒤에는 저장된 값이 강제 테마와 충돌해 FOUC를 유발하므로 비활성화. -->
    <script id="oc-theme-preload-script" src="/oc-theme-preload.js"></script>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="flex flex-col h-dvh p-px"></div>
    <script src="/src/entry.tsx" type="module"></script>
  </body>
</html>
