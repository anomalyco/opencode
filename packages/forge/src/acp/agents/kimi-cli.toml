name = "Kimi CLI"
description = "Moonshot AI's Kimi code assistant"
command = "kimi"
args = ["--acp"]
install_guide = "https://github.com/MoonshotAI/kimi-cli"
color = "#5baefe"

[[install_commands.unix]]
method = "uv"
command = "uv tool install --python 3.13 kimi-cli"
description = "Install via uv (requires Python 3.13)"

[[install_commands.windows]]
method = "uv"
command = "uv tool install --python 3.13 kimi-cli"
description = "Install via uv (requires Python 3.13)"

[[uninstall_commands.unix]]
method = "uv"
command = "uv tool uninstall kimi-cli"
description = "Uninstall via uv tool"

[[uninstall_commands.windows]]
method = "uv"
command = "uv tool uninstall kimi-cli"
description = "Uninstall via uv tool"
