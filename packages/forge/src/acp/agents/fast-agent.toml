name = "Fast Agent"
description = "Define, Prompt and Test MCP enabled Agents and Workflows"
command = "fast-agent"
args = ["acp"]
install_guide = "https://github.com/evalstate/fast-agent"
color = "#888888"

[[install_commands.unix]]
method = "uv"
command = "uv tool install --python 3.13 fast-agent-mcp"
description = "Install via uv tool (global)"

[[install_commands.windows]]
method = "uv"
command = "uv tool install --python 3.13 fast-agent-mcp"
description = "Install via uv tool (global)"

[[uninstall_commands.unix]]
method = "uv"
command = "uv tool uninstall fast-agent-mcp"
description = "Uninstall via uv tool"

[[uninstall_commands.windows]]
method = "uv"
command = "uv tool uninstall fast-agent-mcp"
description = "Uninstall via uv tool"
