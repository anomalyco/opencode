[package]
name = "opencode-cli"
description = "The opencode-rs binary."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opencode-rs"
path = "src/main.rs"

# Runs the prompt kit's parity scripts (parity/oracle/C.p-prompts.ts); not shipped.
[[bin]]
name = "opencode-prompt-demo"
path = "src/prompt/demo.rs"
test = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
clap = { workspace = true, features = ["string"] }
clap_complete.workspace = true
indexmap.workspace = true
log = { workspace = true, features = ["kv"] }
regex.workspace = true
reqwest.workspace = true
rustix = { workspace = true, features = ["termios", "event", "pty"] }
serde_json.workspace = true
tokio.workspace = true
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true
opencode-acp.workspace = true
opencode-api.workspace = true
opencode-drive.workspace = true
opencode-local.workspace = true
opencode-mini.workspace = true
opencode-service.workspace = true
opencode-store.workspace = true
opencode-tui.workspace = true
opencode-ui.workspace = true

[dev-dependencies]
bytes.workspace = true
opencode-plugin.workspace = true
opentui.workspace = true
serde_json.workspace = true
tempfile.workspace = true
