[package]
name = "opencode-ui"
description = "UI kit on opentui: themes, keymap, dialogs, and content widgets."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentui.workspace = true
opencode-api.workspace = true
opencode-local.workspace = true
chrono.workspace = true
indexmap.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

tree-sitter-javascript.workspace = true
tree-sitter-md.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-zig.workspace = true
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-diff = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-agda = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-clojure-orchard = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-elixir = { workspace = true, optional = true }
tree-sitter-fsharp = { workspace = true, optional = true }
tree-sitter-haskell = { workspace = true, optional = true }
tree-sitter-hcl = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-julia = { workspace = true, optional = true }
tree-sitter-lua = { workspace = true, optional = true }
tree-sitter-make = { workspace = true, optional = true }
tree-sitter-nix = { workspace = true, optional = true }
tree-sitter-ocaml = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-r = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-vim = { workspace = true, optional = true }
tree-sitter-vue-next = { workspace = true, optional = true }
tree-sitter-xml = { workspace = true, optional = true }

[features]
default = ["grammars"]
# The grammars transcripts show most, beside the five opentui links: shell, CSS, diff, Go, HTML, JSON, Python, YAML.
grammars = [
    "dep:tree-sitter-bash",
    "dep:tree-sitter-css",
    "dep:tree-sitter-diff",
    "dep:tree-sitter-go",
    "dep:tree-sitter-html",
    "dep:tree-sitter-json",
    "dep:tree-sitter-python",
    "dep:tree-sitter-yaml",
]
# The rest of the TUI's 34 grammars but Kotlin and Swift (parity/deviations/H06-highlight-queries.md).
grammars-all = [
    "grammars",
    "dep:tree-sitter-agda",
    "dep:tree-sitter-c",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-clojure-orchard",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-elixir",
    "dep:tree-sitter-fsharp",
    "dep:tree-sitter-haskell",
    "dep:tree-sitter-hcl",
    "dep:tree-sitter-java",
    "dep:tree-sitter-julia",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-make",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-ocaml",
    "dep:tree-sitter-php",
    "dep:tree-sitter-r",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-scala",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-vim",
    "dep:tree-sitter-vue-next",
    "dep:tree-sitter-xml",
]

[dev-dependencies]
opencode-parity.workspace = true
tempfile.workspace = true
