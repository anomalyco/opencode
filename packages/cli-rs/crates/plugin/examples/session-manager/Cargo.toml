# A port of `@0xuwui/opencode-session-manager` 0.1.2 (npm, MIT) to a native plugin on `opencode-plugin-abi` alone.
# The TUI's tests build it with `cargo build` and load the library. Not a workspace member.
[package]
name = "opencode-session-manager"
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
opencode-plugin-abi = { path = "../../../plugin-abi" }
serde_json = "1"

[workspace]
