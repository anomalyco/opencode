# A port of `opencode-sidebar-tokens` 0.1.3 (npm, MIT) to a native plugin on `opencode-plugin-abi` alone. The TUI's
# tests build it with `cargo build` and load the library. Not a workspace member.
[package]
name = "opencode-sidebar-tokens"
version = "0.1.3"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
opencode-plugin-abi = { path = "../../../plugin-abi" }
serde_json = "1"

[workspace]
