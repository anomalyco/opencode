# The built-in home footer (P6a), its own source in `crates/tui/src/plugins/home_footer.rs`, built as a `cdylib`, so
# the TUI's `home_footer` tests load a built-in from a library file through the loader and compare it with the linked
# one. `shim` stands in for the host crate `opencode-plugin`: the ABI crate and the two slot paths the source names.
# Not a workspace member.
[package]
name = "opencode-home-footer-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "opencode_home_footer"
crate-type = ["cdylib"]

[dependencies]
opencode-plugin-abi = { path = "../../../plugin-abi" }
opencode-plugin = { path = "shim", package = "opencode-plugin-shim" }

[workspace]
