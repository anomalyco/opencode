# Builds the TUI's built-in footer as a library for comparison with its linked behavior.
[package]
name = "opencode-home-footer-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "opencode_home_footer"
crate-type = ["cdylib"]

[dependencies]
opencode-plugin-abi = { path = "../../../plugin-abi" }
opencode-plugin = { path = "shim", package = "opencode-plugin-shim" }

[workspace]
