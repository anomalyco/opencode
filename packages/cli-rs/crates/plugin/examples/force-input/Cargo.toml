# A port of `@mynameistito/opencode-force-input` 1.1.20 (npm, MIT, Tito) to a native plugin on `opencode-plugin-abi`
# alone. The TUI's tests build it with `cargo build` and load the library. Not a workspace member.
[package]
name = "opencode-force-input"
version = "1.1.20"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
opencode-plugin-abi = { path = "../../../plugin-abi" }
serde_json = "1"

[workspace]
