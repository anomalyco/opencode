[package]
name = "opencode-plugin"
description = "Plugin loaders and host runtime for the native TUI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentui.workspace = true
opencode-ui.workspace = true
log.workspace = true
opencode-plugin-abi.workspace = true
opencode-util.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
unicode-width.workspace = true
opencode-api-types.workspace = true
url.workspace = true
ring.workspace = true
mlua = { workspace = true, optional = true }

[features]
# Disable the JS host at runtime with `OPENCODE_PLUGIN_JS=0`.
default = ["ts", "luau", "native"]
ts = []
# Disable Luau at runtime with `OPENCODE_PLUGIN_LUAU=0`.
luau = ["dep:mlua"]
# Native plugin libraries, opened in process over the C ABI (native-feature): the loader's library path, the C ABI's
# carrier, the conformance harness, macOS quarantine and the library half of approvals. Disable it at runtime with
# `OPENCODE_PLUGIN_NATIVE=0`. A static musl build compiles them out anyway (build.rs's `cfg(native)`, O-188).
native = ["opencode-plugin-abi/c-abi"]

[target.'cfg(unix)'.dependencies]
# Who owns the approvals file, and opening it without following a link.
libc.workspace = true

[dev-dependencies]
opencode-util.workspace = true
# The operations table test's Rust column (`client::probe`).
opencode-api-types = { workspace = true, features = ["probe"] }
# The LaTeX and Mermaid built-ins, run through the C ABI's byte shims in the loader's tests.
opencode-latex.workspace = true
opencode-mermaid.workspace = true
