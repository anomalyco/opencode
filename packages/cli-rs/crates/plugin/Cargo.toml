[package]
name = "opencode-plugin"
description = "The Rust plugin API (P.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentui.workspace = true
opencode-ui.workspace = true
log.workspace = true
# Native plugins (P.4): the C ABI, and dlopen.
opencode-plugin-abi.workspace = true
opencode-util.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
unicode-width.workspace = true
opencode-api-types.workspace = true
# The URLs of git specs, parsed as `new URL` parses them (the npm cache's keys, js-npm).
url.workspace = true
# The hash an approval of a project plugin names (rich-plugins 3.9).
ring.workspace = true

# Luau plugins (spike `luau-spike`): a fourth carrier of contract 2.0, off by default.
mlua = { workspace = true, optional = true }

[features]
# TypeScript TUI plugins on the JS host: the pipe carrier, the JS host and its embedded `host.ts` and `compat.js`
# (ts-feature). On by default; `OPENCODE_PLUGIN_JS=0` still turns the host off at run time.
default = ["ts"]
ts = []
luau = ["dep:mlua"]

[target.'cfg(unix)'.dependencies]
# Who owns the approvals file, and opening it without following a link.
libc.workspace = true

[dev-dependencies]
opencode-util.workspace = true
# The LaTeX and Mermaid built-ins, run through the C ABI's byte shims in the loader's tests.
opencode-latex.workspace = true
opencode-mermaid.workspace = true
