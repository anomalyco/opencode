[package]
name = "opencode-plugin-abi"
description = "The C ABI of native TUI plugins for opencode-native (P.4), and export_plugin! for plugins written in Rust."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A plugin crate depends on this one alone, so it stays free of the TUI and its native libraries.
[dependencies]
# The session, message and catalog values renders read.
opencode-api-types.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }

[features]
# The JSON Schema of contract 2.0 (`examples/schema.rs`); off in every build that ships.
schema = ["dep:schemars"]
