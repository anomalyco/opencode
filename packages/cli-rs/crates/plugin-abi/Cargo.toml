[package]
name = "opencode-plugin-abi"
description = "The TUI plugin contract, its schema, and the Rust SDK the built-in plugins use."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# For the host only (provisional): the host constructs and matches the contract's types whole, so a type a later 2.x
# extends breaks the host's build until it handles the addition. It is not part of the SDK's compatibility promise: a
# crate that turns it on may break on any later 2.x. A plugin never turns it on; without it the types are
# `#[non_exhaustive]`, and what a later 2.x adds is no break of a plugin's source.
host = []

[lints]
workspace = true

# The built-ins depend on this crate, which stays free of the TUI and its native libraries.
[dependencies]
# The session, message and catalog values renders read.
opencode-api-types.workspace = true
serde.workspace = true
serde_json.workspace = true
