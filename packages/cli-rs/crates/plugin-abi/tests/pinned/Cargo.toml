# An author's plugin pinned to the 2.0 SDK's source: `tests/sdk.rs` builds it against this SDK, and against the SDK's
# `next` feature, as a crate outside the client's workspace. Not a workspace member.
[package]
name = "opencode-pinned-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "opencode_pinned"
crate-type = ["cdylib"]

[dependencies]
opencode-plugin-abi = { path = "../.." }

[workspace]
