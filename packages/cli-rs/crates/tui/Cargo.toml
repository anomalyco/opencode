[package]
name = "opencode-tui"
description = "The full-screen TUI (T.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
opentui.workspace = true
opencode-api.workspace = true
opencode-local.workspace = true
opencode-ui.workspace = true
opencode-store.workspace = true
opencode-plugin.workspace = true
opencode-drive.workspace = true
opencode-util = { workspace = true, features = ["ring"] }
base64.workspace = true
futures-util.workspace = true
indexmap.workspace = true
log.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
unicode-width.workspace = true
url.workspace = true
rand.workspace = true

[features]
# TypeScript TUI plugins on the JS host: the pipe carrier, the JS host and its embedded `host.ts` and `compat.js`
# (ts-feature). On by default; `OPENCODE_PLUGIN_JS=0` still turns the host off at run time.
default = ["ts", "luau"]
ts = ["opencode-plugin/ts"]
# Luau plugins, in process (O-178). On by default; `OPENCODE_PLUGIN_LUAU=0` turns them off at run time.
luau = ["opencode-plugin/luau"]

[dev-dependencies]
bytes.workspace = true
# The pinned SHA-512 of the published packages the P8 rows unpack.
ring.workspace = true
opencode-latex.workspace = true
opencode-mermaid.workspace = true
opencode-parity.workspace = true
# The board plugin's source, linked into the carrier tests as a plugin crate links it.
opencode-plugin-abi.workspace = true
