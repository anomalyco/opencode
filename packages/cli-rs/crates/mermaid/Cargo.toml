[package]
name = "opencode-mermaid"
description = "The Mermaid plugin (P.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# One integration-test binary (`tests/all`); a new `tests/<file>.rs` is a module of it, not a binary of its own.
autotests = false

[lints]
workspace = true

# The plugin depends on the plugin API alone; the host turns what it returns into widgets.
[dependencies]
opencode-plugin-abi.workspace = true
indexmap.workspace = true
regex.workspace = true
unicode-width.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
opencode-plugin.workspace = true
opencode-ui.workspace = true
opentui.workspace = true
opencode-parity.workspace = true
serde_json.workspace = true

[[test]]
name = "all"
path = "tests/all/main.rs"
