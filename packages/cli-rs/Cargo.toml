[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
opencode-acp = { path = "crates/acp" }
opencode-api = { path = "crates/api" }
opencode-drive = { path = "crates/drive" }
opencode-latex = { path = "crates/latex" }
opencode-local = { path = "crates/local" }
opencode-mermaid = { path = "crates/mermaid" }
opencode-mini = { path = "crates/mini" }
opencode-parity = { path = "crates/parity" }
opencode-plugin = { path = "crates/plugin" }
opencode-plugin-abi = { path = "crates/plugin-abi" }
opencode-service = { path = "crates/service" }
opencode-store = { path = "crates/store" }
opencode-tui = { path = "crates/tui" }
opencode-ui = { path = "crates/ui" }

# The local opentui-rust checkout on main; see README.md for the native library.
opentui = { path = "/home/simon/src/opentui-rust/crates/opentui", features = ["static", "tokio", "tree-sitter"] }

# Expected third-party crates, declared once so steps rarely edit manifests. A crate takes one with
# `name.workspace = true` and adds features with `features = [...]`.
anyhow = "1"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
indexmap = { version = "2", features = ["serde"] }
libloading = "0.9"
log = { version = "0.4", features = ["std"] }
memchr = "2"
notify = "8"
percent-encoding = "2"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
rustix = { version = "1", features = ["fs", "process"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
serde_path_to_error = "0.1"
sha1 = "0.11"
sha2 = "0.11"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }

# Tree-sitter grammars for opencode-ui's `grammars` and `grammars-all` features (crates/ui/src/grammars), pinned to
# the WASM releases packages/tui/src/parsers-config.ts loads where crates.io has them. The five opentui bundles take
# its versions.
tree-sitter-javascript = "0.25"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-bash = "=0.25.0"
tree-sitter-css = "=0.25.0"
tree-sitter-diff = "=0.1.0"
tree-sitter-go = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-json = "=0.24.8"
tree-sitter-python = "=0.23.6"
tree-sitter-yaml = "=0.7.2"
tree-sitter-agda = "=1.3.3"
tree-sitter-c = "=0.24.1"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-clojure-orchard = "0.2.9"
tree-sitter-cpp = "=0.23.4"
tree-sitter-elixir = "=0.3.5"
tree-sitter-fsharp = "=0.3.0"
tree-sitter-haskell = "=0.23.1"
tree-sitter-hcl = { git = "https://github.com/tree-sitter-grammars/tree-sitter-hcl", tag = "v1.2.0" }
tree-sitter-java = "=0.23.5"
tree-sitter-julia = "=0.23.1"
tree-sitter-lua = "=0.5.0"
tree-sitter-make = "=1.1.1"
tree-sitter-nix = "0.3.0"
tree-sitter-ocaml = "=0.24.2"
tree-sitter-php = "=0.24.2"
tree-sitter-r = "=1.2.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-scala = "=0.24.0"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-vim = "0.4.0"
tree-sitter-vue-next = "0.1.0"
tree-sitter-xml = "=0.7.0"

# Debug info stays in the object files instead of passing through the linker, and dependencies keep only file and line
# tables. Backtraces still show file and line, and a test binary links in about half the time and memory. `test`
# inherits this.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"
