# `cargo deny check` for the client's dependency tree, on every target. `licenses`, `bans` and `sources` read only
# the lock file and the crates cargo has fetched (`bun run check:deny`); `advisories` fetches the RustSec database
# (`bun run check:advisories`). `deps-allow.txt` stays the list of which crates may be in the tree (O-58); this file
# checks what they are and where they come from.

[advisories]
# A vulnerability fails, and so does a crate marked unmaintained, unsound or yanked: each is read, then ignored here
# with its reason.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# The licences the tree needs today, each with the crates that need it. A crate passes when these satisfy its
# expression: `MIT OR Apache-2.0` needs either, `Apache-2.0 AND ISC` both. The release's third-party notice carries
# them all (O-156).
allow = [
    # Most crates, the workspace's own, and OpenTUI's.
    "MIT",
    # ring (with ISC), sync_wrapper, tree-sitter-elixir, tree-sitter-hcl; most others offer it beside MIT.
    "Apache-2.0",
    # subtle.
    "BSD-3-Clause",
    # notify, tree-sitter-clojure-orchard.
    "CC0-1.0",
    # webpki-root-certs, the Mozilla root certificates.
    "CDLA-Permissive-2.0",
    # ring, rustls-webpki, untrusted, inotify, inotify-sys.
    "ISC",
    # unicode-ident's Unicode tables.
    "Unicode-3.0",
    # foldhash.
    "Zlib",
]
exceptions = [
    # opentui-sys is `MIT AND LGPL-2.1-or-later`: the OpenTUI library it links statically includes LGPL code,
    # which ships with its licence files (O-156). Allowed for this crate only, so another LGPL crate is read before it
    # comes in.
    { crate = "opentui-sys", allow = ["LGPL-2.1-or-later"] },
]

[bans]
# getrandom, syn and windows-sys are in the tree at two versions each: reported, not failed.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # The HCL grammar, which the workspace takes from git at a tag, unlike its other grammars.
    "https://github.com/tree-sitter-grammars/tree-sitter-hcl",
    # mlua and mlua-sys at Luau 747, behind opencode-plugin's `luau` feature, until mlua 0.12.3 is on crates.io (O-172).
    "https://github.com/mlua-rs/mlua",
    # luau0-src with simonklee/luau's fixes, behind the same feature, until upstream Luau takes them (O-176).
    "https://github.com/simonklee/luau-src-rs",
]
