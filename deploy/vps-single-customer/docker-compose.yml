services:
  numeral:
    build:
      context: ../..
      dockerfile: deploy/vps-single-customer/Dockerfile
      args:
        VITE_OPENCODE_LICENSE_URL: ${VITE_OPENCODE_LICENSE_URL}
    restart: unless-stopped
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_BOOTSTRAP_ADMIN_EMAIL: ${OPENCODE_BOOTSTRAP_ADMIN_EMAIL}
      OPENCODE_BOOTSTRAP_ADMIN_PASSWORD: ${OPENCODE_BOOTSTRAP_ADMIN_PASSWORD}
      OPENCODE_SANDBOX_PREINSTALLED: "true"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "true"
      OPENCODE_DISABLE_PROJECT_CONFIG: "true"
      OPENCODE_WORKSPACES_ROOT: /workspaces
      OPENCODE_WEB_DIST: /app/packages/app/dist
      XDG_DATA_HOME: /data/share
      XDG_CONFIG_HOME: /data/config
      XDG_STATE_HOME: /data/state
      XDG_CACHE_HOME: /data/cache
    working_dir: /workspaces
    command:
      - bun
      - --preload
      - /app/packages/opencode/node_modules/@opentui/solid/scripts/preload.ts
      - /app/packages/opencode/src/index.ts
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    volumes:
      - numeral-data:/data
      - ${CUSTOMER_WORKSPACES_ROOT}:/workspaces

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - numeral
    environment:
      NUMERAL_DOMAIN: ${NUMERAL_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  numeral-data:
  caddy-data:
  caddy-config:
