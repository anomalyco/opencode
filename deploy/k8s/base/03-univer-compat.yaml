apiVersion: apps/v1
kind: Deployment
metadata:
  name: univer-compat
  namespace: veritly
  labels:
    app: univer-compat
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: univer-compat
  template:
    metadata:
      labels:
        app: univer-compat
    spec:
      containers:
        - name: univer-compat
          image: opencode-veritly-univer-compat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: UNIVER_COMPAT_PERSIST_EVERY_REV
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: UNIVER_COMPAT_PERSIST_EVERY_REV
            - name: UNIVER_COMPAT_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: UNIVER_COMPAT_S3_ENDPOINT
            - name: UNIVER_COMPAT_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: UNIVER_COMPAT_S3_REGION
            - name: UNIVER_COMPAT_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: UNIVER_COMPAT_S3_BUCKET
            - name: UNIVER_COMPAT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: veritly-secrets
                  key: UNIVER_COMPAT_S3_ACCESS_KEY
            - name: UNIVER_COMPAT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: veritly-secrets
                  key: UNIVER_COMPAT_S3_SECRET_KEY
            - name: UNIVER_COMPAT_S3_PRESIGN_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: UNIVER_COMPAT_S3_PRESIGN_ENDPOINT
                  optional: true
            - name: WORKOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: veritly-secrets
                  key: WORKOS_API_KEY
            - name: WORKOS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: veritly-secrets
                  key: WORKOS_CLIENT_ID
            - name: COOKIE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veritly-secrets
                  key: COOKIE_PASSWORD
            - name: OPENCODE_WORKOS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: OPENCODE_WORKOS_ENABLED
                  optional: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: univer-compat
  namespace: veritly
spec:
  type: ClusterIP
  selector:
    app: univer-compat
  ports:
    - port: 8080
      targetPort: 8080
      name: http
