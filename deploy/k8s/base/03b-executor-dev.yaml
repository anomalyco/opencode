# Dev-only executor stack (**not** the production `executor` Deployment in `03-executor.yaml`).
# Production OpenCode uses Service **executor**; this stack is **executor-dev** for :dev images + laptop port-forward.
# Push image with tag `dev`, then rollout this deployment:
#   EXECUTOR_IMAGE_TAG=dev EXECUTOR_DEPLOYMENT=executor-dev ./deploy/k8s/push-executor-image.sh
#
# Reach from laptop:
#   bun run --cwd packages/opencode executor-dev:k8s-tunnel
#   (bash: packages/opencode/script/executor-dev-k8s-tunnel.sh)
#   export VERITLY_EXECUTOR_URL=http://127.0.0.1:7777
#
# Health (executor image includes curl — opencode-api image does not):
#   kubectl exec -n veritly deploy/executor-dev -- curl -fsS http://127.0.0.1:7777/readyz
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor-dev
  namespace: veritly
  labels:
    app: executor-dev
spec:
  revisionHistoryLimit: 3
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: executor-dev
  template:
    metadata:
      labels:
        app: executor-dev
    spec:
      containers:
        - name: executor
          image: opencode-veritly-executor-dev:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 7777
              name: http
          env:
            - name: PORT
              value: "7777"
            - name: VM_INACTIVITY_TIMEOUT_MS
              value: "300000"
            - name: UNIVER_SDK_WS
              value: "ws://relay:8080/ws"
            - name: EXECUTOR_DATA_DIR
              value: "/tmp/veritly-executor"
          livenessProbe:
            httpGet:
              path: /livez
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: executor-dev
  namespace: veritly
  labels:
    app: executor-dev
spec:
  selector:
    app: executor-dev
  ports:
    - port: 7777
      targetPort: 7777
      name: http
