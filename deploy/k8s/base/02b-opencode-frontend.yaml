apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-frontend
  namespace: veritly
  labels:
    app: opencode-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: opencode-frontend
  template:
    metadata:
      labels:
        app: opencode-frontend
    spec:
      containers:
        - name: opencode-frontend
          image: opencode-veritly-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
            - name: NODE_ENV
              value: "production"
            - name: FRONTEND_BACKEND_HEALTH_URL
              value: "http://opencode-api:3000/readyz"
            - name: FRONTEND_RELAY_HEALTH_URL
              value: "http://relay:8080/readyz"
            - name: FRONTEND_RELAY_WS_HEALTH_URL
              value: "ws://relay:8080/readyz/ws"
            - name: FRONTEND_PUBLIC_OPENCODE_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: VITE_OPENCODE_SERVER_URL
                  optional: true
            - name: FRONTEND_PUBLIC_UNIVER_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: VITE_UNIVER_BACKEND_URL
                  optional: true
            - name: FRONTEND_PUBLIC_UNIVER_SDK_WS
              valueFrom:
                configMapKeyRef:
                  name: veritly-config
                  key: VITE_UNIVER_SDK_WS
                  optional: true
          livenessProbe:
            httpGet:
              path: /livez
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-frontend
  namespace: veritly
spec:
  selector:
    app: opencode-frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
