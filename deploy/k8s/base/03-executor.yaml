apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: veritly
  labels:
    app: executor
spec:
  revisionHistoryLimit: 5
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - executor
                topologyKey: kubernetes.io/hostname
      containers:
        - name: executor
          image: opencode-veritly-executor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7777
              name: http
          env:
            - name: PORT
              value: "7777"
            - name: VM_INACTIVITY_TIMEOUT_MS
              value: "300000"
            - name: UNIVER_SDK_WS
              value: "ws://relay:8080/ws"
            - name: EXECUTOR_DATA_DIR
              value: "/tmp/veritly-executor"
          livenessProbe:
            httpGet:
              path: /livez
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 7777
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: executor
  namespace: veritly
  annotations:
    # Sticky by SOURCE IP. Traffic from a single opencode-api pod → one client IP → one executor pod (no spread).
    # For per-session spread across replicas, use `03c-executor-sticky-ingress.yaml` + VERITLY_EXECUTOR_HTTP_HOST on the API.
spec:
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 14400
  selector:
    app: executor
  ports:
    - port: 7777
      targetPort: 7777
      name: http
