apiVersion: v1
kind: Namespace
metadata:
  name: veritly
---
apiVersion: v1
kind: Secret
metadata:
  name: veritly-secrets
  namespace: veritly
type: Opaque
stringData:
  OPENCODE_SERVER_PASSWORD: "change-me-in-production"
  OTEL_EXPORTER_OTLP_HEADERS: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: veritly-config
  namespace: veritly
data:
  PUBLIC_HOST: "app.veritly.co.uk"
  PUBLIC_BASE_URL: "https://app.veritly.co.uk"
  VITE_UNIVER_BACKEND_URL: "https://univer.veritly.co.uk"
  VITE_UNIVER_SDK_WS: "wss://relay.veritly.co.uk/ws"
  OPENCODE_SERVER_USERNAME: "opencode"
  OPENCODE_HOSTED_MODE: "1"
  OPENCODE_DISABLE_LOCAL_FILESYSTEM: "1"
  DEPLOYMENT_ENVIRONMENT: "production"
  EXECUTOR_DRIVER: "stub"
  EXECUTOR_DEFAULT_TIMEOUT_MS: "120000"
