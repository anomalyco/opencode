apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: veritly
  labels:
    app: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      containers:
      - name: opencode
        image: opencode-veritly-opencode:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: OPENCODE_SERVER_USERNAME
          valueFrom:
            configMapKeyRef:
              name: veritly-config
              key: OPENCODE_SERVER_USERNAME
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: veritly-secrets
              key: OPENCODE_SERVER_PASSWORD
        - name: DEPLOYMENT_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: veritly-config
              key: DEPLOYMENT_ENVIRONMENT
        - name: VITE_UNIVER_BACKEND_URL
          valueFrom:
            configMapKeyRef:
              name: veritly-config
              key: VITE_UNIVER_BACKEND_URL
        - name: VERITLY_WS_DEBUG
          value: "0"
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: opencode-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-data
  namespace: veritly
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: veritly
spec:
  selector:
    app: opencode
  ports:
  - port: 3000
    targetPort: 3000
    name: http
