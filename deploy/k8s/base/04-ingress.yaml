# Ingress for OpenCode (HTTP API + Frontend only)
# TLS at Cloudflare edge; nginx receives HTTP from cloudflared — ssl-redirect must stay off.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veritly-app
  namespace: veritly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
  - host: app.veritly.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opencode-frontend
            port:
              number: 80
---
# Ingress for OpenCode API (public HTTPS health + API)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veritly-api
  namespace: veritly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: api.veritly.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: opencode-api
            port:
              number: 3000
---
# Ingress for Univer compat (universer-api + presigned exchange)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veritly-univer
  namespace: veritly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: univer.veritly.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: univer-compat
                port:
                  number: 8080
---
# Ingress for Relay (WebSocket only - public for browsers)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: veritly-relay
  namespace: veritly
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/websocket-services: "relay"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # re-enable when relay HPA + edge stickiness (nginx cookie affinity)
    # nginx.ingress.kubernetes.io/affinity: "cookie"
    # nginx.ingress.kubernetes.io/session-cookie-name: "veritly_relay"
    # nginx.ingress.kubernetes.io/session-cookie-expires: "172800"
    # nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
spec:
  ingressClassName: nginx
  rules:
  - host: relay.veritly.co.uk
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: relay
            port:
              number: 8080
