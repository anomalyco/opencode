name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
      dry_run:
        description: "Dry run (do not publish or push)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.3.14' }}

      - name: Setup Node/npm for OIDC publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve version
        shell: bash
        run: |
          RAW_VERSION="${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}"
          VERSION="${RAW_VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "OPENCODE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "OPENCODE_RELEASE=${{ github.event.inputs.dry_run != 'true' && '1' || '' }}" >> "$GITHUB_ENV"
          echo "Releasing version: ${VERSION}"

      - name: Install dependencies
        run: bun install

      - name: Build platform binaries
        env:
          OPENCODE_RELEASE: ""
        run: bun run --cwd packages/opencode build

      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: bun script/publish.ts

      - name: Dry-run publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: bun script/publish.ts
        env:
          OPENCODE_RELEASE: ""
