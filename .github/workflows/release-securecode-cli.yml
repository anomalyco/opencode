name: release-securecode-cli

# Builds SecureCode CLI binaries once and publishes them as Release
# assets to the source repo `acompany-develop/securecode` (always, using
# the workflow's default GITHUB_TOKEN). This is the channel internal users
# currently install from via the Notion onboarding doc.
#
# NOTE (#290): Public distribution to `acompany-develop/securecode-release`
# is temporarily disabled while we re-evaluate the "binary-only =
# code-secret" assumption (see Issue #290). The release-repo steps and the
# `SECURECODE_RELEASE_TOKEN` token detection are commented out below; the
# engineer install flow via the source repo is unaffected.
#
# Refs #159, follow-up to #164. Disabled per #290.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (default: v<securecode.version>)"
        required: false
        type: string

permissions:
  contents: write

# env:
#   # Disabled per #290 — re-enable together with the release-repo steps below.
#   RELEASE_REPO: acompany-develop/securecode-release

jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve release metadata
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            VERSION="$(tr -d '\r\n' < securecode.version)"
            TAG="v${VERSION}"
          else
            VERSION="${TAG#v}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Disabled per #290 — re-enable together with the release-repo steps below.
      # # Secrets cannot be referenced directly in step-level `if:` conditions,
      # # so we surface a boolean output here and key subsequent steps off it.
      # - name: Detect release-repo token
      #   id: token
      #   env:
      #     RELEASE_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
      #   run: |
      #     if [ -n "$RELEASE_TOKEN" ]; then
      #       echo "available=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "available=false" >> "$GITHUB_OUTPUT"
      #       echo "::notice::SECURECODE_RELEASE_TOKEN is not set; skipping upload to ${RELEASE_REPO}. Engineer install flow via ${GITHUB_REPOSITORY} is unaffected."
      #     fi

      - name: Ensure release exists on source repo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Acompany SecureCode ${TAG}" \
              --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          gh release create "$TAG" \
            --title "Acompany SecureCode ${TAG}" \
            --notes "Acompany SecureCode CLI release." \
            --repo "$GITHUB_REPOSITORY"

      # Disabled per #290 — public distribution paused while we revisit the
      # "binary-only = code-secret" assumption.
      # - name: Ensure release exists on release repo
      #   if: steps.token.outputs.available == 'true'
      #   env:
      #     GH_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
      #     TAG: ${{ steps.vars.outputs.tag }}
      #   run: |
      #     if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
      #       gh release edit "$TAG" \
      #         --title "Acompany SecureCode ${TAG}" \
      #         --repo "$RELEASE_REPO"
      #       exit 0
      #     fi
      #
      #     gh release create "$TAG" \
      #       --title "Acompany SecureCode ${TAG}" \
      #       --notes "Acompany SecureCode CLI release." \
      #       --repo "$RELEASE_REPO"

      - name: Build CLI binaries
        env:
          OPENCODE_VERSION: ${{ steps.vars.outputs.version }}
        run: bun ./packages/opencode/script/build.ts

      - name: Upload release assets to source repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ steps.vars.outputs.version }}
          SECURECODE_TAG: ${{ steps.vars.outputs.tag }}
        run: bun ./script/release-securecode.ts

      # Disabled per #290 — public distribution paused while we revisit the
      # "binary-only = code-secret" assumption.
      # - name: Upload release assets to release repo
      #   if: steps.token.outputs.available == 'true'
      #   env:
      #     GH_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
      #     GH_REPO: ${{ env.RELEASE_REPO }}
      #     OPENCODE_VERSION: ${{ steps.vars.outputs.version }}
      #     SECURECODE_TAG: ${{ steps.vars.outputs.tag }}
      #   run: bun ./script/release-securecode.ts
