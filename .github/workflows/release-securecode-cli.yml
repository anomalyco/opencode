name: release-securecode-cli

# Builds SecureCode CLI binaries once and publishes them as Release
# assets to the source repo `acompany-develop/securecode` (always, using
# the workflow's default GITHUB_TOKEN). This is the channel internal users
# currently install from via the Notion onboarding doc.
#
# The pipeline is split into two jobs (refs #294):
#   1. `build` (Linux): cross-compile opencode + supervisor binaries for
#      every target. The bun `macho.zig` signing bug is irrelevant here;
#      Linux/Windows binaries don't need codesign, and darwin binaries
#      will be re-signed later.
#   2. `release` (macOS): download the dist artifact, ad-hoc re-sign darwin
#      binaries with Apple's native `codesign`, archive, and upload.
# Running codesign on a macOS runner is the whole point of the split —
# `codesign` only exists on macOS, and bun's linker-signed signature on
# darwin-arm64 is truncated by the `macho.zig` sig_size bug, causing AMFI
# to SIGKILL the binary on launch. Refs:
#   - oven-sh/bun#29120
#   - https://bun.com/docs/guides/runtime/codesign-macos-executable
#
# NOTE (#290): Public distribution to `acompany-develop/securecode-release`
# is temporarily disabled while we re-evaluate the "binary-only =
# code-secret" assumption (see Issue #290). The release-repo steps and the
# `SECURECODE_RELEASE_TOKEN` token detection are commented out below; the
# engineer install flow via the source repo is unaffected.
#
# Refs #159, follow-up to #164. Disabled per #290.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (default: v<securecode.version>)"
        required: false
        type: string

permissions:
  contents: write

# env:
#   # Disabled per #290 — re-enable together with the release-repo steps below.
#   RELEASE_REPO: acompany-develop/securecode-release

jobs:
  build:
    # Linux で全 OS のバイナリ (opencode + supervisor) を cross-compile する。
    # darwin の codesign 問題と無関係なため、ビルド環境を変えずに済む。
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve release metadata
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            VERSION="$(tr -d '\r\n' < securecode.version)"
            TAG="v${VERSION}"
          else
            VERSION="${TAG#v}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build CLI binaries
        env:
          OPENCODE_VERSION: ${{ steps.vars.outputs.version }}
        run: bun ./packages/opencode/script/build.ts

      - name: Build supervisors
        run: bun ./script/build-supervisors.ts

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: securecode-dist
          path: packages/opencode/dist
          retention-days: 1
          if-no-files-found: error

  release:
    # macOS runner にする唯一の理由は Apple 純正 `codesign` を呼ぶため
    # (codesign は macOS でしか動かない)。darwin の ad-hoc (linker-signed)
    # 署名が bun の macho.zig sig_size バグで truncated になり Apple Silicon
    # の AMFI が SIGKILL するため、配布前に純正 `codesign --force --sign -`
    # で再署名する必要がある。Refs:
    #   - oven-sh/bun#29120 — truncated code signature in v1.3.12
    #   - https://bun.com/docs/guides/runtime/codesign-macos-executable
    #   - acompany-develop/securecode#294
    needs: build
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: securecode-dist
          path: packages/opencode/dist

      # Disabled per #290 — re-enable together with the release-repo steps below.
      # # Secrets cannot be referenced directly in step-level `if:` conditions,
      # # so we surface a boolean output here and key subsequent steps off it.
      # - name: Detect release-repo token
      #   id: token
      #   env:
      #     RELEASE_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
      #   run: |
      #     if [ -n "$RELEASE_TOKEN" ]; then
      #       echo "available=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "available=false" >> "$GITHUB_OUTPUT"
      #       echo "::notice::SECURECODE_RELEASE_TOKEN is not set; skipping upload to ${RELEASE_REPO}. Engineer install flow via ${GITHUB_REPOSITORY} is unaffected."
      #     fi

      - name: Ensure release exists on source repo
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Acompany SecureCode ${TAG}" \
              --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          gh release create "$TAG" \
            --title "Acompany SecureCode ${TAG}" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

      # Disabled per #290 — public distribution paused while we revisit the
      # "binary-only = code-secret" assumption.
      # - name: Ensure release exists on release repo
      #   if: steps.token.outputs.available == 'true'
      #   env:
      #     GH_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
      #     TAG: ${{ needs.build.outputs.tag }}
      #   run: |
      #     if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
      #       gh release edit "$TAG" \
      #         --title "Acompany SecureCode ${TAG}" \
      #         --repo "$RELEASE_REPO"
      #       exit 0
      #     fi
      #
      #     gh release create "$TAG" \
      #       --title "Acompany SecureCode ${TAG}" \
      #       --notes "Acompany SecureCode CLI release." \
      #       --repo "$RELEASE_REPO"

      - name: Upload release assets to source repo
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_VERSION: ${{ needs.build.outputs.version }}
          SECURECODE_TAG: ${{ needs.build.outputs.tag }}
        run: bun ./script/release-securecode.ts

      # Disabled per #290 — public distribution paused while we revisit the
      # "binary-only = code-secret" assumption.
      # - name: Upload release assets to release repo
      #   if: steps.token.outputs.available == 'true'
      #   env:
      #     GH_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
      #     GH_REPO: ${{ env.RELEASE_REPO }}
      #     OPENCODE_VERSION: ${{ needs.build.outputs.version }}
      #     SECURECODE_TAG: ${{ needs.build.outputs.tag }}
      #   run: bun ./script/release-securecode.ts
