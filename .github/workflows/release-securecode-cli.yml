name: release-securecode-cli

# Builds SecureCode CLI binaries and uploads them as Release assets to the
# public-facing distribution repo `acompany-develop/securecode-release`.
#
# Requires the secret `SECURECODE_RELEASE_TOKEN` — a fine-grained PAT (or
# GitHub App installation token) with `contents:write` on
# `acompany-develop/securecode-release`. The workflow's default
# `github.token` only has access to the source repo and cannot write to the
# release repo.
#
# Refs #159.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (default: v<securecode.version>)"
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_REPO: acompany-develop/securecode-release

jobs:
  cli:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve release metadata
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            VERSION="$(tr -d '\r\n' < securecode.version)"
            TAG="v${VERSION}"
          else
            VERSION="${TAG#v}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists on release repo
        env:
          GH_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "Acompany SecureCode ${TAG}" \
              --repo "$RELEASE_REPO"
            exit 0
          fi

          gh release create "$TAG" \
            --title "Acompany SecureCode ${TAG}" \
            --notes "Acompany SecureCode CLI release." \
            --repo "$RELEASE_REPO"

      - name: Build CLI binaries
        env:
          OPENCODE_VERSION: ${{ steps.vars.outputs.version }}
        run: bun ./packages/opencode/script/build.ts

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.SECURECODE_RELEASE_TOKEN }}
          GH_REPO: ${{ env.RELEASE_REPO }}
          OPENCODE_VERSION: ${{ steps.vars.outputs.version }}
          SECURECODE_TAG: ${{ steps.vars.outputs.tag }}
        run: bun ./script/release-securecode.ts
