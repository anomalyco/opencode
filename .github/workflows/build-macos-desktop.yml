name: Build macOS Desktop
run-name: "Build macOS Desktop App"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.1-test). Leave empty to skip release creation."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: |
          cd packages/opencode
          bun run build
        env:
          OPENCODE_VERSION: "1.2.6"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-binaries
          path: packages/opencode/dist

  build-macos-x64:
    needs: build-cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: x86_64-apple-darwin

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-binaries
          path: packages/desktop/src-tauri/target/opencode-binaries

      - name: Install dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          cd packages/desktop
          # Update version
          jq '.version = "1.2.6"' package.json > package.json.tmp
          mv package.json.tmp package.json

          # List downloaded files for debugging
          echo "Downloaded files:"
          ls -R src-tauri/target/opencode-binaries

          # Copy CLI binary to sidecar folder
          mkdir -p src-tauri/sidecars
          cp src-tauri/target/opencode-binaries/opencode-darwin-x64/bin/opencode src-tauri/sidecars/opencode-cli-x86_64-apple-darwin
          chmod +x src-tauri/sidecars/opencode-cli-x86_64-apple-darwin

      - name: Build Desktop App
        run: |
          cd packages/desktop

          # Build frontend
          export NODE_ENV=production
          bun vite build

          # Create a temporary tauri config that skips beforeBuildCommand
          jq '.build.beforeBuildCommand = ""' src-tauri/tauri.conf.json > src-tauri/tauri.build.conf.json

          # Merge prod config (without updater for fork builds)
          jq -s '.[0] * (.[1] | del(.plugins.updater) | del(.bundle.createUpdaterArtifacts))' \
            src-tauri/tauri.build.conf.json \
            src-tauri/tauri.prod.conf.json > src-tauri/tauri.final.conf.json

          # Build with Tauri
          bun tauri build --target x86_64-apple-darwin --config ./src-tauri/tauri.final.conf.json --bundles dmg

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-x64
          path: packages/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: packages/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    needs: [build-cli, build-macos-x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: aarch64-apple-darwin

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: opencode-binaries
          path: packages/desktop/src-tauri/target/opencode-binaries

      - name: Install dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          cd packages/desktop
          # Update version
          jq '.version = "1.2.6"' package.json > package.json.tmp
          mv package.json.tmp package.json

          # List downloaded files for debugging
          echo "Downloaded files:"
          ls -R src-tauri/target/opencode-binaries

          # Copy CLI binary to sidecar folder
          mkdir -p src-tauri/sidecars
          cp src-tauri/target/opencode-binaries/opencode-darwin-arm64/bin/opencode src-tauri/sidecars/opencode-cli-aarch64-apple-darwin
          chmod +x src-tauri/sidecars/opencode-cli-aarch64-apple-darwin

      - name: Build Desktop App
        run: |
          cd packages/desktop

          # Build frontend
          export NODE_ENV=production
          bun vite build

          # Create a temporary tauri config that skips beforeBuildCommand
          jq '.build.beforeBuildCommand = ""' src-tauri/tauri.conf.json > src-tauri/tauri.build.conf.json

          # Merge prod config (without updater for fork builds)
          jq -s '.[0] * (.[1] | del(.plugins.updater) | del(.bundle.createUpdaterArtifacts))' \
            src-tauri/tauri.build.conf.json \
            src-tauri/tauri.prod.conf.json > src-tauri/tauri.final.conf.json

          # Build with Tauri (with retry on DMG packaging failure)
          for i in 1 2 3; do
            echo "Build attempt $i..."
            if bun tauri build --target aarch64-apple-darwin --config ./src-tauri/tauri.final.conf.json --bundles dmg; then
              echo "Build succeeded on attempt $i"
              break
            else
              if [ $i -lt 3 ]; then
                echo "Build failed on attempt $i, retrying in 5 seconds..."
                sleep 5
              else
                echo "Build failed after 3 attempts"
                exit 1
              fi
            fi
          done

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-arm64
          path: packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          files: packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
