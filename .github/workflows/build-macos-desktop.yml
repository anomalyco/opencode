name: Build macOS Desktop
run-name: "Build macOS Desktop App"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.1-test). Leave empty to skip release creation."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-macos-x64:
    runs-on: macos-15-intel
    env:
      APP_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: x86_64-apple-darwin
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          VERSION="${APP_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            BASE=$(cat VERSION)
            TAG=$(printf '%s' "${APP_VERSION}" | tr '[:upper:]' '[:lower:]' | tr -cs '0-9a-z-' '-' | sed 's/^-*//; s/-*$//')
            VERSION="${BASE}-${TAG:-dev}.${GITHUB_RUN_NUMBER}"
          fi
          bun ./script/sync-version.ts "$VERSION"

      - name: Build Desktop App
        run: |
          cd packages/desktop
          bun run package:mac
          VERSION="${APP_VERSION#v}"
          DMG="$(find dist -maxdepth 1 -name '*.dmg' -type f | head -n 1)"
          test -n "$DMG"
          mv "$DMG" "dist/OpenCode_${VERSION}_x64.dmg"

      - name: Upload macOS x64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-x64
          path: packages/desktop/dist/OpenCode_*_x64.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          TAG="${APP_VERSION}"
          ASSET="packages/desktop/dist/OpenCode_${TAG#v}_x64.dmg"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    needs: build-macos-x64
    runs-on: macos-15
    env:
      APP_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: aarch64-apple-darwin
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          VERSION="${APP_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            BASE=$(cat VERSION)
            TAG=$(printf '%s' "${APP_VERSION}" | tr '[:upper:]' '[:lower:]' | tr -cs '0-9a-z-' '-' | sed 's/^-*//; s/-*$//')
            VERSION="${BASE}-${TAG:-dev}.${GITHUB_RUN_NUMBER}"
          fi
          bun ./script/sync-version.ts "$VERSION"

      - name: Build Desktop App
        run: |
          cd packages/desktop
          bun run package:mac
          VERSION="${APP_VERSION#v}"
          DMG="$(find dist -maxdepth 1 -name '*.dmg' -type f | head -n 1)"
          test -n "$DMG"
          mv "$DMG" "dist/OpenCode_${VERSION}_aarch64.dmg"

      - name: Upload macOS arm64 DMG
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-macos-arm64
          path: packages/desktop/dist/OpenCode_*_aarch64.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          TAG="${APP_VERSION}"
          ASSET="packages/desktop/dist/OpenCode_${TAG#v}_aarch64.dmg"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --title "$TAG" --target "$GITHUB_SHA"
          gh release upload "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
