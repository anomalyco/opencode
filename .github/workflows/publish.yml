name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - dev
      - beta
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string
      release_notes:
        description: "Reviewed V2 release notes for CHANGELOG.md and the Discord announcement (optional)"
        required: false
        type: string

# Serialize all publish runs per ref. Keying on dispatch inputs let a
# push-triggered run (empty inputs) race a dispatched bump run on the same
# ref, and the loser's --force-with-lease tag push failed with "stale info".
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  packages: write

env:
  OPENCODE_CHANNEL: ${{ (github.ref_name == 'dev' && !inputs.bump && !inputs.version && 'dev') || '' }}

jobs:
  version:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.repository == 'bolt-builder/bolt-cli'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.BOLT_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Install Bolt
        if: inputs.bump || inputs.version
        run: bun i -g bolt-ai

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          BOLT_BUMP: ${{ inputs.bump }}
          BOLT_VERSION: ${{ inputs.version }}
          BOLT_API_KEY: ${{ secrets.BOLT_API_KEY }}
          GH_REPO: ${{ (github.ref_name == 'beta' && 'bolt-builder/bolt-cli') || github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'bolt-builder/bolt-cli'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.BOLT_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Build legacy CLI
        if: github.ref_name != 'dev' && github.ref_name != 'beta'
        run: ./packages/opencode/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          BOLT_VERSION: ${{ needs.version.outputs.version }}
          BOLT_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}

      - name: Build man pages
        run: ./packages/opencode/script/man.ts
        env:
          BOLT_VERSION: ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bolt-man
          path: packages/opencode/dist/man/*.1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_name != 'dev' && github.ref_name != 'beta'
        with:
          name: opencode-cli
          path: |
            packages/opencode/dist/@bolt-builder/bolt-cli-darwin*
            packages/opencode/dist/@bolt-builder/bolt-cli-linux*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref_name != 'dev' && github.ref_name != 'beta'
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/@bolt-builder/bolt-cli-windows*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bolt-preview-cli
          path: packages/cli/dist/cli-*

    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-macos:
    needs: build-cli
    runs-on: macos-26
    if: github.repository == 'anomalyco/bolt'
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-preview-cli-unsigned
          path: packages/cli/dist

      - name: Sign macOS CLI binaries
        run: |
          identity=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found"
            exit 1
          fi

          for name in bolt-darwin-arm64 bolt-darwin-x64 bolt-darwin-x64-baseline; do
            file="packages/opencode/dist/$name/bin/bolt"
            chmod +x "$file"
            codesign \
              --force \
              --timestamp \
              --options runtime \
              --entitlements packages/cli/script/entitlements.plist \
              --sign "$identity" \
              "$file"
            codesign --verify --deep --strict --verbose=4 "$file"
            codesign --display --requirements - "$file"
          done

      - name: Smoke test signed binary
        run: ./packages/opencode/dist/bolt-darwin-arm64/bin/bolt --version

      - name: Repack macOS CLI archives
        working-directory: packages/opencode/dist
        run: |
          for name in bolt-darwin-arm64 bolt-darwin-x64 bolt-darwin-x64-baseline; do
            rm -f "$name.zip"
            (cd "$name/bin" && zip -r "../../$name.zip" *)
          done

      - name: Upload signed macOS CLI release assets
        if: needs.version.outputs.release != ''
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" \
            packages/opencode/dist/bolt-darwin-arm64.zip \
            packages/opencode/dist/bolt-darwin-x64.zip \
            packages/opencode/dist/bolt-darwin-x64-baseline.zip \
            --clobber \
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-signed-macos
          path: |
            packages/opencode/dist/bolt-darwin-arm64
            packages/opencode/dist/bolt-darwin-x64
            packages/opencode/dist/bolt-darwin-x64-baseline
            packages/opencode/dist/bolt-darwin-*.zip
          if-no-files-found: error

  sign-cli-windows:
    needs:
      - sign-cli-macos
    runs-on: blacksmith-4vcpu-windows-2025
    if: github.repository == 'bolt-builder/bolt-cli'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.BOLT_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      # skip signing entirely unless the full Azure Trusted Signing configuration is present
      - name: Azure login
        if: >-
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_SUBSCRIPTION_ID != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' &&
          env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1.2.0
        if: >-
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_SUBSCRIPTION_ID != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' &&
          env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-arm64\bin\bolt.exe
            ${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-x64\bin\bolt.exe
            ${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-x64-baseline\bin\bolt.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        if: >-
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_SUBSCRIPTION_ID != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' &&
          env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-arm64\bin\bolt.exe",
            "${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-x64\bin\bolt.exe",
            "${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-x64-baseline\bin\bolt.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/opencode/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "bolt-cli-windows-arm64\bin\*" -DestinationPath "bolt-cli-windows-arm64.zip" -Force
          Compress-Archive -Path "bolt-cli-windows-x64\bin\*" -DestinationPath "bolt-cli-windows-x64.zip" -Force
          Compress-Archive -Path "bolt-cli-windows-x64-baseline\bin\*" -DestinationPath "bolt-cli-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-arm64.zip" `
            "${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-x64.zip" `
            "${{ github.workspace }}\packages\bolt\dist\bolt-cli-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-signed-windows
          path: |
            packages/opencode/dist/bolt-cli-windows-arm64
            packages/opencode/dist/bolt-cli-windows-x64
            packages/opencode/dist/bolt-cli-windows-x64-baseline

  build-electron:
    # Desktop packaging re-signs the bundled CLI on macOS and Windows, so it starts from the unsigned build.
    needs:
      - version
    if: github.repository == 'bolt-builder/bolt-cli'
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # github-hosted: blacksmith lacks ARM64 MSVC cross-compilation toolchain
          - host: "windows-2025"
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
            bun_install_flags: --cpu=*
          - host: "blacksmith-4vcpu-windows-2025"
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: "blacksmith-4vcpu-ubuntu-2404"
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: "blacksmith-4vcpu-ubuntu-2404-arm"
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux --arm64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check Apple signing secrets
        if: runner.os == 'macOS'
        id: apple_secrets
        env:
          CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE }}
          API_KEY_PRESENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          if [ -n "$CERT_PRESENT" ]; then
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$API_KEY_PRESENT" ]; then
            echo "has_api_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_api_key=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-preview-cli-unsigned
          path: packages/cli/dist

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS' && steps.apple_secrets.outputs.has_cert == 'true'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS' && steps.apple_secrets.outputs.has_api_key == 'true'
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      # skip signing entirely unless the full Azure Trusted Signing configuration is present
      - name: Azure login
        if: >-
          runner.os == 'Windows' &&
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_SUBSCRIPTION_ID != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' &&
          env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.BOLT_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          BOLT_VERSION: ${{ needs.version.outputs.version }}
          BOLT_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          RUST_TARGET: ${{ matrix.settings.target }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          BOLT_VERSION: ${{ needs.version.outputs.version }}
          BOLT_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
          OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist

      - name: Package
        if: needs.version.outputs.release
        shell: bash
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # APPLE_API_KEY is a path and always non-empty; a partial notary env
          # makes electron-builder fail hard instead of skipping notarization.
          if [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          # macOS dmgbuild flakes with "hdiutil: couldn't eject - Resource busy" when
          # Spotlight/XProtect briefly holds the mounted DMG volume; retry up to 3 times.
          for attempt in 1 2 3; do
            if npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::electron-builder package attempt $attempt failed, retrying"
            fi
          done
          echo "::error::electron-builder packaging failed after 3 attempts"
          exit 1
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          BOLT_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          CSC_KEYCHAIN: build.keychain
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          BOLT_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}

      - name: Create macOS .app.tar.gz
        if: runner.os == 'macOS' && needs.version.outputs.release
        working-directory: packages/desktop/dist
        run: |
          if [[ "${{ matrix.settings.target }}" == "x86_64-apple-darwin" ]]; then
            APP_DIR="mac"
            OUT_NAME="bolt-desktop-mac-x64.app.tar.gz"
          elif [[ "${{ matrix.settings.target }}" == "aarch64-apple-darwin" ]]; then
            APP_DIR="mac-arm64"
            OUT_NAME="bolt-desktop-mac-arm64.app.tar.gz"
          else
            echo "Unknown macOS target: ${{ matrix.settings.target }}"
            exit 1
          fi
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in $APP_DIR"
            exit 1
          fi
          tar -czf "$OUT_NAME" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

      - name: Verify signed Windows Electron artifacts
        if: >-
          runner.os == 'Windows' &&
          env.AZURE_CLIENT_ID != '' &&
          env.AZURE_TENANT_ID != '' &&
          env.AZURE_SUBSCRIPTION_ID != '' &&
          env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' &&
          env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' &&
          env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\dist\*unpacked\resources\bolt-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bolt-desktop-${{ matrix.settings.target }}
          path: packages/desktop/dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop/dist/latest*.yml

  publish:
    needs:
      - version
      - build-cli
      - sign-cli-macos
      - build-node-app-archive
      - build-node-cli
      - sign-cli-windows
      - build-electron
    # Publish whatever succeeded: the CLI build is required, but failed
    # electron/signing legs only skip their own assets instead of blocking the release.
    if: always() && !cancelled() && needs.version.result == 'success' && needs.build-cli.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Versioned and beta releases wait for approval in the release environment; dev previews do not.
    environment: ${{ needs.version.outputs.release && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # CLI artifacts contain bolt-cli-<os>-<arch>/ dirs; restore them under dist/@bolt-builder
      # to match the layout packages/opencode/script/publish.ts expects.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.ref_name != 'dev' && github.ref_name != 'beta'
        with:
          name: opencode-cli
          path: packages/opencode/dist/@bolt-builder

      - name: Remove unsigned macOS CLI binaries
        run: rm -rf packages/opencode/dist/bolt-darwin*

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: opencode-cli-signed-macos
          path: packages/opencode/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.ref_name != 'dev' && github.ref_name != 'beta'
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/@bolt-builder

      # Signed binaries may be missing if the signing job failed; fall back to unsigned ones.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: opencode-cli-signed-windows
          path: packages/opencode/dist/@bolt-builder

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: github.ref_name != 'beta'
        with:
          name: bolt-preview-cli
          path: packages/cli/dist

      # Desktop artifacts may be partial when some electron matrix legs failed;
      # download whatever exists and release only those platforms.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.build-node-cli.result == 'success'
        with:
          pattern: opencode-node-cli-*
          path: packages/cli/dist/node
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        continue-on-error: true
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.version.outputs.release
        continue-on-error: true
        with:
          pattern: bolt-desktop-*
          path: /tmp/desktop
          merge-multiple: true

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.BOLT_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Upload desktop release assets
        if: needs.version.outputs.release
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          shopt -s nullglob
          files=(/tmp/desktop/*.{exe,blockmap,dmg,zip,AppImage,deb,rpm} /tmp/desktop/*.app.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "::warning::No desktop release assets found, skipping desktop upload"
            exit 0
          fi
          gh release upload "v${{ needs.version.outputs.version }}" "${files[@]}" --clobber --repo "${{ needs.version.outputs.repo }}"

      - run: ./script/publish.ts
        env:
          # npm auth: setup-node writes ~/.npmrc reading $NODE_AUTH_TOKEN; without this the
          # placeholder token is used and every npm publish fails with E404.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          BOLT_VERSION: ${{ needs.version.outputs.version }}
          BOLT_RELEASE: ${{ needs.version.outputs.release }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          # PAT with write access to bolt-builder/homebrew-tap; the publish script
          # skips the tap update with a warning when unset.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENCODE_DESKTOP_DIST: /tmp/desktop
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15d29c8639fd3733b1b5486a2acfd968
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  notify-discord-v2:
    needs:
      - version
      - publish
    if: ${{ !cancelled() && github.repository == 'anomalyco/opencode' && github.ref_name == 'dev' && needs.version.outputs.release && needs.publish.result == 'success' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release
    steps:
      # Unlike dev, V2 publishes a tag rather than a GitHub Release event.
      - name: Announce V2 release in Discord
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          release_name: OpenCode V2 ${{ needs.version.outputs.tag }}
          release_body: ${{ inputs.release_notes }}
          release_html_url: https://github.com/${{ github.repository }}/tree/${{ needs.version.outputs.tag }}
