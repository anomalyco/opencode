name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    tags:
      - "*"
  pull_request:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.0"
          cache: true
          cache-dependency-path: go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: Publish
        run: |
          bun install
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            ./script/publish.ts
          else
            ./script/publish.ts --snapshot
          fi
        working-directory: ./packages/opencode

      - name: Upload darwin-arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-darwin-arm64
          path: ./packages/opencode/dist/opencode-darwin-arm64

      - name: Upload darwin-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-darwin-x64
          path: ./packages/opencode/dist/opencode-darwin-x64

      - name: Upload linux-arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-arm64
          path: ./packages/opencode/dist/opencode-linux-arm64

      - name: Upload linux-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-linux-x64
          path: ./packages/opencode/dist/opencode-linux-x64

      - name: Upload windows-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: ./packages/opencode/dist/opencode-windows-x64

  release:
    name: Release
    needs: [publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        id: downloads
        uses: actions/download-artifact@v4

      - name: List Files
        run: ls -R ${{ steps.downloads.outputs.download-path }}

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.downloads.outputs.download-path }}/opencode*/bin/opencode*
