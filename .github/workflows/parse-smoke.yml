name: parse-smoke

# Lightweight CI gate for this fork.  Runs on GitHub-hosted ubuntu-latest
# (the upstream sst/opencode workflows targeted Blacksmith self-hosted
# runners that don't exist for this repo — every run was sitting in the
# `queued` state forever and never gating PRs).
#
# Bun's parser is stricter than tsc/tsgo — it rejects constructs like
# `await` outside `async function` at *load* time, whereas tsc/tsgo only
# emits a semantic warning.  A bundle-time parse check on the Bun
# runtime entry points catches the class of "deploy goes green,
# container crashloops on boot" failures (the 2026-05-27 incident,
# commit f4b0f831b).
#
# `bun typecheck` is intentionally *not* run here — the collab fork
# carries ~20 pre-existing TS errors (Drizzle ORM type drift, date /
# number mixups in invite + session, missing id prefixes) that the
# runtime tolerates but tsgo rejects.  Re-enable once those are
# resolved; the parse-smoke gate covers the actual deploy-breaking
# failure mode in the meantime.

on:
  push:
    branches: [collab]
  pull_request:
    branches: [collab]
  workflow_dispatch:

jobs:
  parse-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Parse-check Bun runtime entries
        run: |
          set -euo pipefail
          mkdir -p .artifacts/parse
          targets=(
            packages/opencode/src/index.ts
            packages/opencode/src/server/server.ts
            packages/opencode/src/collab/router.ts
            packages/opencode/src/collab/native-api.ts
            packages/opencode/src/collab/workspace.ts
            packages/opencode/src/cli/cmd/serve.ts
          )
          for target in "${targets[@]}"; do
            echo "::group::parse $target"
            bun build "$target" --target=bun --no-bundle \
              --outfile=".artifacts/parse/$(basename "$target" .ts).js"
            echo "::endgroup::"
          done
