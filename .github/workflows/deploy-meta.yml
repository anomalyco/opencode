name: deploy-meta

on:
  push:
    branches:
      - dev
      - production
  workflow_dispatch:

concurrency:
  group: deploy-meta-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode' && (github.ref_name == 'dev' || github.ref_name == 'production')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/meta
        run: bun run typecheck:tsc

      - name: Build
        working-directory: services/meta
        run: bun run build --mode ${{ github.ref_name == 'production' && 'production' || 'dev' }}

      - name: Deploy
        working-directory: services/meta
        run: bun run deploy --mode ${{ github.ref_name == 'production' && 'production' || 'dev' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: 15d29c8639fd3733b1b5486a2acfd968
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
