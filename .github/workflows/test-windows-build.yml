name: Test Windows Build

on:
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.11"

jobs:
  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\bun\install\cache
            node_modules
            packages\*\node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set desktop version
        run: |
          cd packages/desktop-electron
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '0.0.0-test';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # Bun creates directory junctions on Windows which Node.js ESM can't traverse.
      # Fix: npm-install electron-vite + ALL its deps into RUNNER_TEMP, then replace
      # every bun junction in node_modules with a real copy that Node.js can resolve.
      - name: Replace bun junctions with real npm copies (Windows fix)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evite"
          echo '{}' > "$RUNNER_TEMP/evite/package.json"
          npm install --prefix "$RUNNER_TEMP/evite" electron-vite vite --legacy-peer-deps --silent
          for pkg in "$RUNNER_TEMP/evite/node_modules"/*/; do
            name=$(basename "$pkg")
            [[ "$name" == .* ]] && continue
            rm -rf "node_modules/$name"
            cp -r "$pkg" "node_modules/$name"
          done

      - name: Build
        shell: bash
        run: cd packages/desktop-electron && bun run build
        env:
          OPENCODE_CHANNEL: prod

      - name: Package (no publish)
        run: cd packages/desktop-electron && bun run package:win -- --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: List output
        shell: bash
        run: ls packages/desktop-electron/dist/*.exe 2>/dev/null && echo "SUCCESS" || echo "No .exe found"
