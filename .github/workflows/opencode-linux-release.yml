name: Build OpenCode Linux Binary

on:
  push:
    tags:
      - 'opencode-v*'

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Build OpenCode binaries
        run: bun --cwd packages/opencode run build

      - name: Prepare linux-x64 release assets
        run: |
          tar -C packages/opencode/dist/opencode-linux-x64/bin -czf ./opencode-linux-x64.tar.gz opencode
          sha256sum ./opencode-linux-x64.tar.gz | tee ./opencode-linux-x64.tar.gz.sha256

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            opencode-linux-x64.tar.gz
            opencode-linux-x64.tar.gz.sha256
