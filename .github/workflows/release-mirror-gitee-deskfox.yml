# [fork-only] DeskFox release 镜像到 Gitee
#
# 触发:GitHub Release 从 draft 转 publish 时(user 手动 publish 才触发)
#
# 行为:
#   1. 拉 GitHub Release 全部附件(.exe / .dmg)
#   2. 在 Gitee zoulukuang/deskfox 创建对应 Release(同 tag/name/body/prerelease)
#   3. 把附件上传到 Gitee Release
#
# 依赖 secret:
#   GITEE_TOKEN — Gitee Personal Access Token,scope `projects` 即可
#   配置位置:GitHub repo Settings → Secrets and variables → Actions → New repository secret
#   获取方式:Gitee → 设置 → 私人令牌 → 生成新令牌
#
# 设计文档:docs/features/gitee-release-mirror/1-spec.md
#
# 文件名规则(强制):*-deskfox.yml,跟上游 0 重名,pre-commit hook 自动豁免

name: release-mirror-gitee-deskfox

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to mirror (e.g. ship-prod-2026.5.3.1). 用于补镜像 / 失败 re-run。'
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror release to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITEE_OWNER: zoulukuang
      GITEE_REPO: deskfox
      GITEE_API: https://gitee.com/api/v5
      TARGET_BRANCH: dev
      MAX_ASSET_SIZE: 104857600  # 100 MB,Gitee 单文件上限
      # tag 来源:release 事件用 release.tag_name;dispatch 用 inputs.tag
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Validate GITEE_TOKEN secret
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret not configured."
            echo "::error::Configure at: Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Token scope required: projects (Gitee → 设置 → 私人令牌)"
            exit 1
          fi
          # 探测 token 有效性(查 user info)
          status=$(curl -sf -o /dev/null -w "%{http_code}" \
            "$GITEE_API/user?access_token=$GITEE_TOKEN" || echo "fail")
          if [ "$status" != "200" ]; then
            echo "::error::GITEE_TOKEN invalid or expired (status=$status)"
            exit 1
          fi
          echo "[ok] GITEE_TOKEN valid"

      - name: Resolve release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name AND no dispatch input)"
            exit 1
          fi
          echo "[tag] $TAG"
          # 从 GitHub API 拉 release 元数据(兼容 release / workflow_dispatch 两种触发)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isPrerelease > /tmp/release.json
          name=$(jq -r '.name // .tagName' /tmp/release.json)
          prerelease=$(jq -r '.isPrerelease' /tmp/release.json)
          # body 可能含特殊字符,直接落 file 给后续 step 用
          jq -r '.body // ""' /tmp/release.json > /tmp/release-body.md
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "[meta] name=$name prerelease=$prerelease body_bytes=$(wc -c < /tmp/release-body.md)"

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          echo "[downloaded]"
          ls -la release-assets/
          # 至少 1 个附件才有意义同步;空 release 直接退出
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::warning::Release has no assets, nothing to mirror — exiting cleanly"
            exit 0
          fi

      - name: Find or create Gitee release
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
          NAME: ${{ steps.meta.outputs.name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail

          # 策略:always-try-create + on-fail-fallback-list
          # 原因:Gitee `GET /releases/tags/<tag>` 在 release 不存在时返 200/null(非 404),
          # 不能仅凭 status code 判断 release 是否已存在。改用"先创建,失败再查列表"。

          # 1. 构造 payload(body 走 --rawfile 防特殊字符破坏 JSON)
          payload=$(jq -nc \
            --arg token "$GITEE_TOKEN" \
            --arg tag "$TAG" \
            --arg name "${NAME:-$TAG}" \
            --rawfile body /tmp/release-body.md \
            --arg branch "$TARGET_BRANCH" \
            --argjson prerelease "${PRERELEASE:-false}" \
            '{
              access_token: $token,
              tag_name: $tag,
              name: $name,
              body: (if ($body | length) > 0 then $body else "Mirrored from GitHub Release." end),
              prerelease: $prerelease,
              target_commitish: $branch
            }')

          # 2. 尝试创建
          echo "[create attempt] POST Gitee release for tag=$TAG"
          create_status=$(curl -s -o /tmp/create-resp.json -w "%{http_code}" \
            --connect-timeout 30 --max-time 60 -X POST \
            "$GITEE_API/repos/$GITEE_OWNER/$GITEE_REPO/releases" \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "$payload")
          echo "[create status] $create_status"

          if [ "$create_status" = "200" ] || [ "$create_status" = "201" ]; then
            release_id=$(jq -r '.id // empty' /tmp/create-resp.json)
            if [ -n "$release_id" ]; then
              echo "[created] Gitee release id=$release_id"
            fi
          fi

          # 3. fallback:create 失败(可能是 release 已存在)→ 列表里找
          if [ -z "${release_id:-}" ] || [ "${release_id:-}" = "null" ]; then
            echo "[fallback] create returned status=$create_status,response:"
            cat /tmp/create-resp.json || true
            echo ""
            echo "[fallback] listing releases to find tag=$TAG..."
            list_status=$(curl -s -o /tmp/list-resp.json -w "%{http_code}" \
              --connect-timeout 30 --max-time 60 \
              "$GITEE_API/repos/$GITEE_OWNER/$GITEE_REPO/releases?access_token=$GITEE_TOKEN&per_page=100")
            if [ "$list_status" != "200" ]; then
              echo "::error::list releases failed (status=$list_status)"
              cat /tmp/list-resp.json || true
              exit 1
            fi
            release_id=$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' /tmp/list-resp.json | head -n1)
            if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
              echo "::error::release not found in list AND create failed — abort"
              exit 1
            fi
            echo "[found via list] Gitee release id=$release_id"
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload assets to Gitee release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_ID: ${{ steps.gitee_release.outputs.release_id }}
        run: |
          set -uo pipefail

          fail_count=0
          ok_count=0

          for f in release-assets/*; do
            [ -f "$f" ] || continue
            filename=$(basename "$f")
            filesize=$(stat -c%s "$f")

            if [ "$filesize" -gt "$MAX_ASSET_SIZE" ]; then
              echo "::warning::$filename size $filesize > $MAX_ASSET_SIZE bytes (Gitee 100MB limit), skipping"
              continue
            fi

            echo "[upload] $filename ($filesize bytes)..."
            # connect-timeout 30s + max-time 600s(10 分钟,50MB 应远低于此)
            http_code=$(curl -s -o /tmp/upload-resp.json -w "%{http_code}" -X POST \
              --connect-timeout 30 --max-time 600 \
              "$GITEE_API/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$f")

            if [ "$http_code" = "201" ] || [ "$http_code" = "200" ]; then
              echo "[ok] $filename uploaded"
              ok_count=$((ok_count + 1))
            else
              echo "::warning::$filename upload failed (status=$http_code):"
              cat /tmp/upload-resp.json || true
              fail_count=$((fail_count + 1))
            fi
          done

          echo ""
          echo "[summary] uploaded=$ok_count failed=$fail_count"
          echo "[gitee release URL] https://gitee.com/$GITEE_OWNER/$GITEE_REPO/releases/tag/${{ github.event.release.tag_name }}"

          if [ "$fail_count" -gt 0 ]; then
            echo "::warning::$fail_count asset(s) failed to upload — see log above"
            # 不 fail workflow,允许部分成功(release 至少建出来了)
          fi
