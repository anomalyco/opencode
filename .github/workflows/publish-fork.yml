name: publish-fork

on:
  push:
    branches:
      - main
    paths:
      - "packages/xcsh/src/**"
      - "packages/xcsh/test/**"
      - ".github/workflows/publish-fork.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORK_TAP_REPO: f5xc-salesdemos/homebrew-tap
  FORK_SUFFIX: f5xc

jobs:
  build:
    name: build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve version automatically
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "Upstream base: $base"

          existing=$(gh release list --limit 100 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"v${base}-${FORK_SUFFIX}.\"))] | length")
          next=$((existing + 1))

          version="${base}-${FORK_SUFFIX}.${next}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Auto-resolved version: $version (base=$base, existing=$existing)"

      - name: Build binaries
        working-directory: packages/xcsh
        env:
          XCSH_VERSION: ${{ steps.version.outputs.version }}
          XCSH_CHANNEL: latest
        run: bun run build

      - name: Run tests
        working-directory: packages/xcsh
        run: bun test test/provider/transform.test.ts --timeout 60000

      - name: Typecheck
        run: bun turbo typecheck

      - name: Package binaries
        working-directory: packages/xcsh/dist
        run: |
          for dir in xcsh-darwin-arm64 xcsh-darwin-x64; do
            (cd "$dir/bin" && zip -r "../../${dir}.zip" xcsh)
          done
          for dir in xcsh-linux-arm64 xcsh-linux-x64; do
            (cd "$dir/bin" && tar czf "../../${dir}.tar.gz" xcsh)
          done

      - name: Compute SHA256 checksums
        id: sha
        working-directory: packages/xcsh/dist
        run: |
          echo "darwin_arm64=$(sha256sum xcsh-darwin-arm64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(sha256sum xcsh-darwin-x64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum xcsh-linux-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum xcsh-linux-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          base="${{ steps.version.outputs.base }}"

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag "$tag" || true
          git push origin "$tag" || true

          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "xcsh $tag (f5xc fork)" \
            --notes "$(cat <<EOF
          Fork build of xcsh (based on opencode) with F5 branding, personality system, and TUI enhancements.
          Based on upstream v${base} + fork patches.

          ## Install
          \`\`\`bash
          brew tap f5xc-salesdemos/tap
          brew install f5xc-salesdemos/tap/xcsh
          \`\`\`

          ## Upgrade
          \`\`\`bash
          brew upgrade f5xc-salesdemos/tap/xcsh
          \`\`\`

          ## Fork enhancements
          - F5 circular emblem logo and xcsh-matched branding colors
          - Hermes-inspired soul and personality system
          - Consolidated agent/model/provider status line
          - Sidebar defaults to hidden
          - Slow-breathing spinner animation
          - Role-aware content filtering for all providers
          EOF
          )" \
            --latest \
            packages/xcsh/dist/xcsh-darwin-arm64.zip \
            packages/xcsh/dist/xcsh-darwin-x64.zip \
            packages/xcsh/dist/xcsh-linux-arm64.tar.gz \
            packages/xcsh/dist/xcsh-linux-x64.tar.gz

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          repo="f5xc-salesdemos/xcsh"

          cat > /tmp/xcsh.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          class Xcsh < Formula
            desc "AI coding agent for the terminal (f5xc fork with LiteLLM fixes)"
            homepage "https://github.com/${repo}"
            version "${version}"

            depends_on "ripgrep"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/${repo}/releases/download/${tag}/xcsh-darwin-x64.zip"
                sha256 "${{ steps.sha.outputs.darwin_x64 }}"

                def install
                  bin.install "xcsh"
                end
              end
              if Hardware::CPU.arm?
                url "https://github.com/${repo}/releases/download/${tag}/xcsh-darwin-arm64.zip"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"

                def install
                  bin.install "xcsh"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? and Hardware::CPU.is_64_bit?
                url "https://github.com/${repo}/releases/download/${tag}/xcsh-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
                def install
                  bin.install "xcsh"
                end
              end
              if Hardware::CPU.arm? and Hardware::CPU.is_64_bit?
                url "https://github.com/${repo}/releases/download/${tag}/xcsh-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
                def install
                  bin.install "xcsh"
                end
              end
            end
          end
          RUBY

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FORK_TAP_REPO}.git" /tmp/homebrew-tap
          cp /tmp/xcsh.rb /tmp/homebrew-tap/xcsh.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xcsh.rb
          git diff --cached --quiet && echo "No changes to tap" && exit 0
          git commit -m "Update xcsh to ${tag}"
          git push

      - name: Publish SDK and Plugin to npm
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          XCSH_VERSION: ${{ steps.version.outputs.version }}
          XCSH_CHANNEL: latest
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          base="${{ steps.version.outputs.base }}"

          # Compute a clean npm version by bumping the upstream patch version.
          # e.g., upstream 1.3.13 → npm 1.3.14, 1.3.15, etc.
          # Check which versions already exist and pick the next one.
          npm_version=$(bun -e "
            const base = '$base'.split('.')
            const major = base[0], minor = base[1]
            let patch = parseInt(base[2]) + 1
            while (true) {
              const ver = major + '.' + minor + '.' + patch
              const res = await fetch('https://registry.npmjs.org/@f5xc-salesdemos/sdk/' + ver)
              if (res.status === 404) { console.log(ver); break }
              patch++
            }
          ")
          echo "npm_version=$npm_version"

          # Resolve catalog:/workspace: deps and set clean version before publish
          bun -e "
            const resolve = async (pkgPath, ver, sdkVer) => {
              const root = JSON.parse(await Bun.file('package.json').text())
              const catalog = root.workspaces?.catalog || {}
              const p = JSON.parse(await Bun.file(pkgPath).text())
              p.version = ver
              for (const section of ['dependencies', 'devDependencies', 'peerDependencies']) {
                if (!p[section]) continue
                for (const [k, v] of Object.entries(p[section])) {
                  if (v === 'catalog:') p[section][k] = catalog[k] || '*'
                  if (typeof v === 'string' && v.startsWith('workspace:')) p[section][k] = sdkVer || '*'
                }
              }
              await Bun.write(pkgPath, JSON.stringify(p, null, 2))
            }
            await resolve('packages/sdk/js/package.json', '$npm_version', null)
            await resolve('packages/plugin/package.json', '$npm_version', '$npm_version')
          "

          # Build SDK dist (compile existing src, skip OpenAPI regeneration)
          cd packages/sdk/js
          bun tsc
          bun ./script/publish.ts
          cd ../../..

          # Build and publish plugin
          cd packages/plugin
          bun tsc
          bun ./script/publish.ts
