name: publish-fork

on:
  push:
    branches:
      - dev
    paths:
      - "packages/opencode/src/**"
      - "packages/opencode/test/**"
      - ".github/workflows/publish-fork.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORK_TAP_REPO: f5xc-salesdemos/homebrew-tap
  FORK_SUFFIX: f5xc

jobs:
  build:
    name: build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve version automatically
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base=$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "Upstream base: $base"

          existing=$(gh release list --limit 100 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"v${base}-${FORK_SUFFIX}.\"))] | length")
          next=$((existing + 1))

          version="${base}-${FORK_SUFFIX}.${next}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Auto-resolved version: $version (base=$base, existing=$existing)"

      - name: Build binaries
        working-directory: packages/opencode
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: latest
        run: bun run build

      - name: Run tests
        working-directory: packages/opencode
        run: bun test test/provider/transform.test.ts --timeout 60000

      - name: Typecheck
        run: bun turbo typecheck

      - name: Package binaries
        working-directory: packages/opencode/dist
        run: |
          for dir in opencode-darwin-arm64 opencode-darwin-x64; do
            (cd "$dir/bin" && zip -r "../../${dir}.zip" opencode)
          done
          for dir in opencode-linux-arm64 opencode-linux-x64; do
            (cd "$dir/bin" && tar czf "../../${dir}.tar.gz" opencode)
          done

      - name: Compute SHA256 checksums
        id: sha
        working-directory: packages/opencode/dist
        run: |
          echo "darwin_arm64=$(sha256sum opencode-darwin-arm64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(sha256sum opencode-darwin-x64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum opencode-linux-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum opencode-linux-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          base="${{ steps.version.outputs.base }}"

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag "$tag" || true
          git push origin "$tag" || true

          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "opencode $tag (f5xc fork)" \
            --notes "$(cat <<EOF
          Fork build of opencode with F5 branding, personality system, and TUI enhancements.
          Based on upstream v${base} + fork patches.

          ## Install
          \`\`\`bash
          brew tap f5xc-salesdemos/tap
          brew install f5xc-salesdemos/tap/opencode
          \`\`\`

          ## Upgrade
          \`\`\`bash
          brew upgrade f5xc-salesdemos/tap/opencode
          \`\`\`

          ## Fork enhancements
          - F5 circular emblem logo and xcsh-matched branding colors
          - Hermes-inspired soul and personality system
          - Consolidated agent/model/provider status line
          - Sidebar defaults to hidden
          - Slow-breathing spinner animation
          - Role-aware content filtering for all providers
          EOF
          )" \
            --latest \
            packages/opencode/dist/opencode-darwin-arm64.zip \
            packages/opencode/dist/opencode-darwin-x64.zip \
            packages/opencode/dist/opencode-linux-arm64.tar.gz \
            packages/opencode/dist/opencode-linux-x64.tar.gz

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          repo="f5xc-salesdemos/opencode"

          cat > /tmp/opencode.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          class Opencode < Formula
            desc "AI coding agent for the terminal (f5xc fork with LiteLLM fixes)"
            homepage "https://github.com/${repo}"
            version "${version}"

            depends_on "ripgrep"

            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/${repo}/releases/download/${tag}/opencode-darwin-x64.zip"
                sha256 "${{ steps.sha.outputs.darwin_x64 }}"

                def install
                  bin.install "opencode"
                end
              end
              if Hardware::CPU.arm?
                url "https://github.com/${repo}/releases/download/${tag}/opencode-darwin-arm64.zip"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"

                def install
                  bin.install "opencode"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? and Hardware::CPU.is_64_bit?
                url "https://github.com/${repo}/releases/download/${tag}/opencode-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
                def install
                  bin.install "opencode"
                end
              end
              if Hardware::CPU.arm? and Hardware::CPU.is_64_bit?
                url "https://github.com/${repo}/releases/download/${tag}/opencode-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
                def install
                  bin.install "opencode"
                end
              end
            end
          end
          RUBY

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${FORK_TAP_REPO}.git" /tmp/homebrew-tap
          cp /tmp/opencode.rb /tmp/homebrew-tap/opencode.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opencode.rb
          git diff --cached --quiet && echo "No changes to tap" && exit 0
          git commit -m "Update opencode to ${tag}"
          git push
