name: sync-upstream

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-upstream-dev

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_sync: ${{ steps.release.outputs.should_sync }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      version: ${{ steps.release.outputs.version }}
      personal_tag: ${{ steps.release.outputs.personal_tag }}
    steps:
      - name: Check latest upstream release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_tag=$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)
          version="${upstream_tag#v}-c0dn.1"
          personal_tag="v${version}"

          echo "upstream_tag=${upstream_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "personal_tag=${personal_tag}" >> "$GITHUB_OUTPUT"

          if gh release view "$personal_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Personal release $personal_tag already exists. Skipping upstream sync."
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Personal release $personal_tag is missing. Syncing upstream release $upstream_tag."
          echo "should_sync=true" >> "$GITHUB_OUTPUT"

  sync:
    needs: gate
    if: needs.gate.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-bun

      - name: Merge upstream release tag
        id: merge
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.gate.outputs.upstream_tag }}
        run: |
          upstream_tag="$UPSTREAM_TAG"

          git config user.name "c0dn-sync-bot"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch --force upstream "+refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"

          release_commit=$(git rev-parse "${upstream_tag}^{commit}")
          echo "Syncing upstream release ${upstream_tag} at ${release_commit} into dev."
          git merge --no-edit "$release_commit"

          if [ "$(git rev-list --count origin/dev..HEAD)" = "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run typecheck
        run: bun typecheck

      - name: Run unit tests
        run: bun turbo test:ci
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: false

      - name: Run HttpApi exerciser gates
        working-directory: packages/opencode
        run: bun run test:httpapi

      - name: Push synced dev
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:dev

      - name: Set release version to mirror
        id: release
        env:
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  mirror-release:
    needs: sync
    if: needs.sync.outputs.release_version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/personal-release.yml
    with:
      version: ${{ needs.sync.outputs.release_version }}
      ref: dev
