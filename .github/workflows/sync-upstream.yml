name: Sync Fork with Upstream

on:
  schedule:
    # Runs weekly on Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/anomalyco/opencode.git

      - name: Fetch and Merge Upstream
        run: |
          git fetch upstream
          git checkout -b upstream-sync-${{ github.run_id }}
          git merge upstream/main --no-edit --strategy-option=theirs || true

      - name: Restore Fork Workflows
        run: |
          # Discard any workflow changes from upstream - keep our workflows
          git checkout HEAD~1 -- .github/workflows/ 2>/dev/null || true
          git add .github/workflows/
          git commit --amend --no-edit || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: upstream-sync-${{ github.run_id }}
          base: main
          title: "⬆️ Sync with upstream"
          body: |
            This PR syncs the fork with the latest changes from upstream.

            **Upstream:** [anomalyco/opencode](https://github.com/anomalyco/opencode)

            > ⚠️ Please review changes carefully before merging to ensure fork-specific customizations are preserved.
          labels: upstream-sync
          delete-branch: true
