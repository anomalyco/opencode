name: Sync Upstream

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC (2 AM PST)
  workflow_dispatch:      # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/sst/opencode.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/dev)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream is $BEHIND commits ahead"

      - name: Nothing to sync
        if: steps.check.outputs.behind == '0'
        run: echo "Already up to date with upstream!"

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          BRANCH_NAME="sync/upstream-$(date +%Y%m%d-%H%M)"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH_NAME"
          
          if git merge upstream/dev --no-edit; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "Clean merge successful!"
          else
            echo "status=conflict" >> $GITHUB_OUTPUT
            echo "Merge conflicts detected"
            git merge --abort
          fi

      - name: Push and create PR (clean merge)
        if: steps.merge.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -u origin HEAD
          
          # Get commit list for PR body
          COMMITS=$(git log origin/dev..HEAD --oneline --reverse | head -30)
          
          gh pr create \
            --title "⬆️ Sync upstream $(date +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## Automated sync from upstream
          
          Syncing changes from [sst/opencode](https://github.com/sst/opencode).
          
          ### Commits included
          \`\`\`
          $COMMITS
          \`\`\`
          
          ---
          *Auto-generated by [sync-upstream workflow](../../actions/workflows/sync-upstream.yml)*
          EOF
          )" \
            --label "upstream-sync"

      - name: Create issue for conflicts
        if: steps.merge.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get list of files that would conflict
          git checkout -b temp-conflict-check
          git merge upstream/dev --no-commit 2>/dev/null || true
          CONFLICTS=$(git diff --name-only --diff-filter=U | head -20)
          git merge --abort 2>/dev/null || git reset --hard HEAD
          
          # Get recent upstream commits
          UPSTREAM_COMMITS=$(git log HEAD..upstream/dev --oneline | head -15)
          
          gh issue create \
            --title "⚠️ Upstream sync conflict - $(date +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## Merge conflict detected
          
          The daily sync from [sst/opencode](https://github.com/sst/opencode) failed due to merge conflicts.
          
          ### Conflicting files
          \`\`\`
          $CONFLICTS
          \`\`\`
          
          ### Manual resolution steps
          \`\`\`bash
          # Fetch latest upstream
          git fetch upstream
          
          # Create a sync branch
          git checkout -b sync/upstream-$(date +%Y%m%d)
          
          # Attempt merge
          git merge upstream/dev
          
          # Resolve conflicts in your editor, then:
          git add .
          git commit
          git push -u origin HEAD
          
          # Create PR via gh cli or GitHub UI
          \`\`\`
          
          ### Recent upstream commits
          \`\`\`
          $UPSTREAM_COMMITS
          \`\`\`
          
          ---
          *Auto-generated by [sync-upstream workflow](../../actions/workflows/sync-upstream.yml)*
          EOF
          )" \
            --label "upstream-sync" \
            --label "needs-attention"
