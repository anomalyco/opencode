name: typecheck

# Lightweight CI gate for this fork.  Runs on GitHub-hosted ubuntu-latest
# (the upstream sst/opencode workflows targeted Blacksmith self-hosted
# runners that don't exist for this repo — every run was sitting in the
# `queued` state forever and never gating PRs).
#
# Two jobs:
#   1. typecheck — `bun typecheck` across the workspace (catches TS errors)
#   2. parse-smoke — `bun build --no-bundle` on every TS file under
#      packages/opencode/src and packages/app/src.  Catches Bun-specific
#      runtime parse errors that tsc/tsgo accepts, e.g. `await` outside
#      `async function` (the failure that 503'd the utils deployment on
#      2026-05-27 — see ADR-0001 Phase 4 / commit f4b0f831b).

on:
  push:
    branches: [collab]
  pull_request:
    branches: [collab]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun typecheck

  parse-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bun's parser is stricter than tsc — e.g. it rejects `await` outside
      # `async function` at load time, whereas tsc/tsgo only emits a
      # semantic warning.  A bundle-time parse check on the runtime entry
      # points + the collab router (where most session-time mistakes
      # land) catches the entire class of "deploy goes green, container
      # crashloops on boot" failures.
      - name: Parse-check Bun runtime entries
        run: |
          set -euo pipefail
          mkdir -p .artifacts/parse
          targets=(
            packages/opencode/src/index.ts
            packages/opencode/src/server/server.ts
            packages/opencode/src/collab/router.ts
            packages/opencode/src/collab/native-api.ts
            packages/opencode/src/collab/workspace.ts
            packages/opencode/src/cli/cmd/serve.ts
          )
          for target in "${targets[@]}"; do
            echo "::group::parse $target"
            bun build "$target" --target=bun --no-bundle \
              --outfile=".artifacts/parse/$(basename "$target" .ts).js"
            echo "::endgroup::"
          done
