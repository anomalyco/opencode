name: upstream-sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: https://github.com/anomalyco/opencode.git
  UPSTREAM_BRANCH: dev
  FORK_BRANCH: dev
  SYNC_ISSUE_LABEL: upstream-sync
  # The provider guard pattern — if upstream removes this, our bugfix may no longer be needed
  BUGFIX_CANARY: 'msg.content === ""'

jobs:
  sync:
    name: sync upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        uses: ./.github/actions/setup-git-committer

      - name: Add upstream remote
        run: |
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch upstream "$UPSTREAM_BRANCH"

      - name: Check divergence
        id: divergence
        run: |
          behind=$(git rev-list --count HEAD..upstream/$UPSTREAM_BRANCH)
          ahead=$(git rev-list --count upstream/$UPSTREAM_BRANCH..HEAD)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse upstream/$UPSTREAM_BRANCH)" >> "$GITHUB_OUTPUT"
          echo "fork_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$behind" = "0" ]; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            echo "✅ Fork is current with upstream"
          else
            echo "status=behind" >> "$GITHUB_OUTPUT"
            echo "⚠️ Fork is $behind commits behind upstream"
          fi

      - name: Check if bugfix is still needed
        id: canary
        if: steps.divergence.outputs.status == 'behind'
        run: |
          if git show upstream/$UPSTREAM_BRANCH:packages/opencode/src/provider/transform.ts | grep -q "$BUGFIX_CANARY"; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "🐛 Bugfix still needed — upstream still uses exact-match empty check"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "🎉 Upstream may have fixed the empty content issue — review before next sync"
          fi

      - name: Check upstream changes to fix files
        id: conflicts
        if: steps.divergence.outputs.status == 'behind'
        run: |
          files=$(git diff HEAD..upstream/$UPSTREAM_BRANCH --name-only -- \
            packages/opencode/src/provider/transform.ts \
            packages/opencode/src/session/llm.ts \
            packages/opencode/src/session/message-v2.ts \
            packages/opencode/test/provider/transform.test.ts \
            packages/opencode/src/session/processor.ts)
          if [ -n "$files" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "files<<FILELIST" >> "$GITHUB_OUTPUT"
            echo "$files" >> "$GITHUB_OUTPUT"
            echo "FILELIST" >> "$GITHUB_OUTPUT"
            echo "⚠️ Upstream changed fix-related files:"
            echo "$files"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "✅ No upstream changes to fix-related files"
          fi

      - name: Attempt rebase
        id: rebase
        if: steps.divergence.outputs.status == 'behind'
        run: |
          git branch dev-backup-$(date +%Y%m%d%H%M%S) HEAD

          if git rebase upstream/$UPSTREAM_BRANCH; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "✅ Rebase succeeded cleanly"
          else
            git rebase --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"

            # Collect conflict details for the issue
            conflicts=""
            git rebase upstream/$UPSTREAM_BRANCH 2>&1 || true
            conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || echo "unknown")
            git rebase --abort 2>/dev/null || true
            echo "conflicts<<CONFLICTLIST" >> "$GITHUB_OUTPUT"
            echo "$conflicts" >> "$GITHUB_OUTPUT"
            echo "CONFLICTLIST" >> "$GITHUB_OUTPUT"
            echo "❌ Rebase has conflicts"
          fi

      - name: Verify fork commits present
        id: verify_commits
        if: steps.rebase.outputs.result == 'success'
        run: |
          subjects=$(git log --format="%s" upstream/$UPSTREAM_BRANCH..HEAD)
          missing=""
          for sig in "fix: filter empty/whitespace message content" "fork onboarding - rebrand" "simplify CI for fork"; do
            if ! echo "$subjects" | grep -q "$sig"; then
              missing="$missing  - $sig\n"
            fi
          done
          actual=$(git rev-list --count upstream/$UPSTREAM_BRANCH..HEAD)
          if [ -z "$missing" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "✅ All 3 required fork commits present ($actual total ahead)"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "missing<<MISSLIST" >> "$GITHUB_OUTPUT"
            echo -e "$missing" >> "$GITHUB_OUTPUT"
            echo "MISSLIST" >> "$GITHUB_OUTPUT"
            echo "❌ Missing fork commits:"
            echo -e "$missing"
          fi

      - name: Setup Bun
        if: steps.rebase.outputs.result == 'success' && steps.verify_commits.outputs.valid == 'true'
        uses: ./.github/actions/setup-bun

      - name: Run bugfix tests
        id: tests
        if: steps.rebase.outputs.result == 'success' && steps.verify_commits.outputs.valid == 'true'
        working-directory: packages/opencode
        run: |
          if bun test test/provider/transform.test.ts --timeout 60000; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ Bugfix tests pass"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "❌ Bugfix tests failed after rebase"
          fi

      - name: Run typecheck
        id: typecheck
        if: steps.tests.outputs.result == 'pass'
        run: |
          if bun turbo typecheck; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
            echo "✅ Typecheck passes"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
            echo "❌ Typecheck failed after rebase"
          fi

      - name: Push rebased dev
        if: steps.typecheck.outputs.result == 'pass'
        run: |
          git push origin $FORK_BRANCH --force-with-lease
          echo "✅ Pushed rebased dev to origin"

      - name: Close sync issue on success
        if: steps.typecheck.outputs.result == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue=$(gh issue list --label "$SYNC_ISSUE_LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "✅ Auto-sync succeeded. Rebased ${{ steps.divergence.outputs.behind }} upstream commits cleanly.

          - Tests: pass
          - Typecheck: pass
          - Bugfix still needed: ${{ steps.canary.outputs.needed }}
          - New upstream SHA: \`${{ steps.divergence.outputs.upstream_sha }}\`"
          fi

      - name: Create/update issue on failure
        if: |
          steps.divergence.outputs.status == 'behind' && (
            steps.rebase.outputs.result == 'conflict' ||
            steps.verify_commits.outputs.valid == 'false' ||
            steps.tests.outputs.result == 'fail' ||
            steps.typecheck.outputs.result == 'fail'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Determine failure reason
          if [ "${{ steps.rebase.outputs.result }}" = "conflict" ]; then
            reason="Rebase conflict"
            detail="Conflicting files:
          \`\`\`
          ${{ steps.rebase.outputs.conflicts }}
          \`\`\`"
          elif [ "${{ steps.verify_commits.outputs.valid }}" = "false" ]; then
            reason="Missing fork commits after rebase"
            detail="Required fork commits not found in rebased history:
          ${{ steps.verify_commits.outputs.missing }}"
          elif [ "${{ steps.tests.outputs.result }}" = "fail" ]; then
            reason="Bugfix tests failed"
            detail="transform.test.ts tests failed after rebase — upstream may have changed the code structure"
          else
            reason="Typecheck failed"
            detail="One or more packages failed typecheck after rebase"
          fi

          title="upstream-sync: $reason (${{ steps.divergence.outputs.behind }} commits behind)"
          body="## Upstream Sync Failed

          **Reason**: $reason
          **Commits behind**: ${{ steps.divergence.outputs.behind }}
          **Upstream SHA**: \`${{ steps.divergence.outputs.upstream_sha }}\`
          **Fork SHA**: \`${{ steps.divergence.outputs.fork_sha }}\`
          **Bugfix still needed**: ${{ steps.canary.outputs.needed }}

          ### Details

          $detail

          ### Fix files touched by upstream

          \`\`\`
          ${{ steps.conflicts.outputs.files }}
          \`\`\`

          ### Manual Resolution

          Follow the [sync procedure in issue #6](https://github.com/${{ github.repository }}/issues/6):

          \`\`\`bash
          git fetch upstream
          git branch dev-backup-\$(date +%Y-%m-%d) dev
          git rebase upstream/dev
          # resolve conflicts
          bun test test/provider/transform.test.ts  # from packages/opencode
          bun typecheck                              # from packages/opencode
          git push origin dev --force-with-lease
          \`\`\`

          ### Related

          - #3 — Primary bugfix
          - #4 — Dev environment
          - #6 — Sync process docs"

          # Find existing open sync issue
          issue=$(gh issue list --label "$SYNC_ISSUE_LABEL" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "$title" --body "$body"
            echo "Updated existing issue #$issue"
          else
            # Ensure label exists
            gh label create "$SYNC_ISSUE_LABEL" --description "Automated upstream sync status" --color "d93f0b" 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label "$SYNC_ISSUE_LABEL"
            echo "Created new sync issue"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Upstream Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commits behind | ${{ steps.divergence.outputs.behind }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commits ahead | ${{ steps.divergence.outputs.ahead }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bugfix still needed | ${{ steps.canary.outputs.needed || 'n/a' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fix files touched | ${{ steps.conflicts.outputs.touched || 'n/a' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rebase | ${{ steps.rebase.outputs.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit count valid | ${{ steps.verify_commits.outputs.valid || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ steps.tests.outputs.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Typecheck | ${{ steps.typecheck.outputs.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
