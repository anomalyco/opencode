name: Upstream Sync Check
on:
  schedule:
    - cron: "0 9 * * 1" # every Monday 9am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream for new releases
        id: check
        run: |
          git remote add upstream https://github.com/anomalyco/opencode || true
          git fetch upstream --tags --quiet
          LATEST=$(git tag -l --sort=-version:refname | grep -v "collab" | head -1)
          CURRENT=$(cat .github/upstream-version 2>/dev/null | tr -d '[:space:]' || echo "none")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          if [ -n "$LATEST" ] && [ "$LATEST" != "$CURRENT" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "New upstream release detected: $LATEST (current: $CURRENT)"
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "No new upstream release. Current: $CURRENT"
          fi

      - name: Merge upstream into sync branch
        if: steps.check.outputs.new_release == 'true'
        run: |
          TAG="${{ steps.check.outputs.latest }}"
          BRANCH="upstream-sync/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git merge "upstream/$TAG" --no-edit --allow-unrelated-histories -X theirs || true
          echo "$TAG" > .github/upstream-version
          git add .github/upstream-version
          git commit -m "chore: record upstream version $TAG" --allow-empty
          git push origin "$BRANCH"

      - name: Open sync PR
        if: steps.check.outputs.new_release == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore: sync upstream opencode ${{ steps.check.outputs.latest }}"
          body: |
            Automated upstream sync from [anomalyco/opencode@${{ steps.check.outputs.latest }}](https://github.com/anomalyco/opencode/releases/tag/${{ steps.check.outputs.latest }}).

            ## Review checklist
            - [ ] Confirm collab features in `packages/collab/` are unaffected
            - [ ] Check `packages/opencode/src/collab/` for conflicts with upstream server changes
            - [ ] Check `packages/app/src/context/collab*.tsx` for conflicts with upstream UI changes
            - [ ] Run `bun install && bun run build` to confirm no build errors
          branch: "upstream-sync/${{ steps.check.outputs.latest }}"
          base: main
