# DEPRECATED / DISABLED — replaced by upstream-sync-v2.yml.
# The nightly schedule is commented out so this no longer runs automatically.
# Kept as a reference / manual fallback only. Do not run it while v2 is active —
# both push the same sync/upstream branch and would collide.
name: upstream-sync (deprecated)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch or ref to sync from"
        required: false
        default: "dev"
        type: string

  # Disabled: replaced by upstream-sync-v2.yml.
  # schedule:
  #   - cron: "0 4 * * *"

concurrency:
  group: upstream-sync
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    name: Nightly upstream sync
    runs-on: ubuntu-latest

    env:
      HUSKY: "0"
      SYNC_BRANCH: sync/upstream
      UPSTREAM_REPO: https://github.com/sst/opencode.git
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'dev' }}
      TARGET_BRANCH: dev

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
          token: ${{ github.token }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup Git Committer
        id: setup-git-committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch origin "$TARGET_BRANCH"
          git fetch upstream "$UPSTREAM_REF"

      - name: Create sync branch from dev
        run: |
          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"

      - name: Merge upstream into sync branch
        id: merge
        run: |
          set +e
          git merge "upstream/$UPSTREAM_REF" --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "conflicted_files=" >> "$GITHUB_OUTPUT"
            echo "Upstream merge completed successfully."
            exit 0
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            conflicted_files="$(git diff --name-only --diff-filter=U | paste -sd "," -)"
            echo "conflicted_files=$conflicted_files" >> "$GITHUB_OUTPUT"

            echo "Conflicted files:"
            git diff --name-only --diff-filter=U || true

            git merge --abort
            exit 0
          fi

          echo "result=failed" >> "$GITHUB_OUTPUT"
          echo "Merge failed for a reason other than conflicts."
          exit "$merge_status"

      - name: Count new commits
        id: diff
        if: steps.merge.outputs.result == 'success'
        run: |
          count="$(git rev-list "origin/$TARGET_BRANCH..HEAD" --count)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "New upstream commits: $count"

      - name: Stop when no upstream changes
        if: steps.merge.outputs.result == 'success' && steps.diff.outputs.count == '0'
        run: |
          echo "No upstream changes to sync."

      - name: Push sync branch
        if: steps.merge.outputs.result == 'success' && steps.diff.outputs.count != '0'
        run: |
          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Run typecheck
        id: typecheck
        if: steps.merge.outputs.result == 'success' && steps.diff.outputs.count != '0'
        run: |
          bun --cwd packages/opencode typecheck

      - name: Run tests
        id: tests
        if: steps.merge.outputs.result == 'success' && steps.diff.outputs.count != '0' && steps.typecheck.outcome == 'success'
        run: |
          bun turbo test

      - name: Create or update upstream sync PR
        if: steps.merge.outputs.result == 'success' && steps.diff.outputs.count != '0' && steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(date +%Y-%m-%d)"

          body="Automated upstream sync from \`sst/opencode\` — $date.

          Validation passed ✅

          - Typecheck passed
          - Tests passed

          Awaiting team review before merge into \`$TARGET_BRANCH\`."

          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: nightly upstream sync $date" \
              --body "$body"

            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: nightly upstream sync $date" \
              --body "$body" \
              --head "$SYNC_BRANCH" \
              --base "$TARGET_BRANCH"

            echo "Created new upstream sync PR."
          fi

      - name: Create sync branch from upstream for conflict PR
        if: steps.merge.outputs.result == 'conflict'
        run: |
          git checkout -B "$SYNC_BRANCH" "upstream/$UPSTREAM_REF"

          git rm -rf .github/workflows/ || true
          git checkout "origin/$TARGET_BRANCH" -- .github/workflows/

          if git diff --cached --quiet && git diff --quiet; then
            echo "No workflow restore changes to commit."
          else
            git add .github/workflows/
            git commit -m "chore: restore fork workflow files for sync PR"
          fi

          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Create or update conflict review PR
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(date +%Y-%m-%d)"

          body="Automated upstream sync from \`sst/opencode\` hit merge conflicts on $date.

          This PR contains upstream's latest code with our workflow files restored so the branch can be pushed safely.

          Conflicted files:
          \`${{ steps.merge.outputs.conflicted_files }}\`

          Manual intervention is required to resolve the conflicts and merge upstream into \`$TARGET_BRANCH\`."

          existing="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$existing" ]; then
            gh pr edit "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: upstream sync conflict review $date" \
              --body "$body"

            echo "Updated existing conflict review PR #$existing"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "chore: upstream sync conflict review $date" \
              --body "$body" \
              --head "$SYNC_BRANCH" \
              --base "$TARGET_BRANCH"

            echo "Created new conflict review PR."
          fi

      - name: Open issue on merge conflict
        if: always() && steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(date +%Y-%m-%d)"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "⚠️ Upstream sync conflict — $date" \
            --body "The upstream sync from \`sst/opencode\` detected merge conflicts on $date.

          Conflicted files:
          \`${{ steps.merge.outputs.conflicted_files }}\`

          A draft PR was also opened or updated using the \`$SYNC_BRANCH\` branch.

          Manual intervention is required to sync the latest upstream changes into \`$TARGET_BRANCH\`." \
            --label bug

      - name: Fail on merge conflict
        if: always() && steps.merge.outputs.result == 'conflict'
        run: |
          exit 1

      - name: Open issue on validation failure
        if: always() && (steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          date="$(date +%Y-%m-%d)"

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "⚠️ Upstream sync validation failed — $date" \
            --body "The upstream sync from \`sst/opencode\` merged successfully on $date but failed validation.

          The sync branch \`$SYNC_BRANCH\` has been pushed.

          Manual review is required before merging into \`$TARGET_BRANCH\`." \
            --label bug
