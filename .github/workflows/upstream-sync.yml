name: upstream-tag-sync

on:
  workflow_dispatch:
  schedule:
    # JST 08:00 / 12:00 / 17:00 (= UTC 23:00 (前日) / 03:00 / 08:00) に upstream の次の tag を取り込む。
    # 1 個ずつ sync する設計のため、追いつくのに複数日かかる。3 回 / 日で現実的な追従速度を確保する。
    - cron: "0 23,3,8 * * *"
  repository_dispatch:
    types: [upstream_tag]

concurrency:
  group: upstream-tag-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Guard local git config
        run: bun script/upstream.ts guard

      - name: Mirror upstream tag
        id: mirror
        run: bun script/upstream.ts mirror >> "$GITHUB_OUTPUT"

      - name: Plan sync branch
        id: plan
        run: bun script/upstream.ts plan >> "$GITHUB_OUTPUT"

      - name: Check existing sync PR
        id: gate
        if: steps.plan.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 既に open の sync/upstream-v* PR があれば、たとえ同じ branch でも block する。
          # 人間が conflict 解決したり review 中の PR を、次の cron が force-push で上書きする事故を防ぐ。
          # 新しい tag を取り込みたい時は、既存 PR を merge / close してから次の run を待つ。
          PR="$(gh pr list -R ${{ github.repository }} --state open --base "${{ steps.plan.outputs.base }}" --json number,headRefName --jq '.[] | select(.headRefName | startswith("sync/upstream-v")) | .headRefName' | head -n 1)"
          if [ -z "$PR" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "blocked=true" >> "$GITHUB_OUTPUT"
          echo "existing=$PR" >> "$GITHUB_OUTPUT"

      - name: Build sync branch
        id: sync
        if: steps.plan.outputs.needed == 'true' && steps.gate.outputs.blocked != 'true'
        run: bun script/upstream.ts sync >> "$GITHUB_OUTPUT"

      - name: Ensure conflict label
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-manual-resolution \
            -R ${{ github.repository }} \
            --description "Upstream sync PR has merge conflicts requiring manual resolution" \
            --color FBCA04 || true

      - name: Create sync PR
        if: steps.plan.outputs.needed == 'true' && steps.gate.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICT: ${{ steps.sync.outputs.conflict }}
          CONFLICT_FILES: ${{ steps.sync.outputs.conflict_files }}
          FROM_TAG: ${{ steps.plan.outputs.from_tag }}
          TARGET_TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          BASE: ${{ steps.plan.outputs.base }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail

          if [ "$CONFLICT" = "true" ]; then
            TITLE="chore(sync): merge upstream ${TARGET_TAG} (conflicts)"
          else
            TITLE="chore(sync): merge upstream ${TARGET_TAG}"
          fi

          {
            echo "Automated intake PR for the next upstream release tag."
            echo
            echo "- Current dev upstream tag: \`${FROM_TAG}\`"
            echo "- Target upstream tag: \`${TARGET_TAG}\`"
            echo "- Mirror branch: \`vendor/upstream-release\`"
            echo "- Intake branch: \`${BRANCH}\`"
            echo "- Upstream commit: \`${SHA}\`"
            echo "- Base branch: \`${BASE}\`"
            echo "- Merge method: \`Create a merge commit\`"
          } > /tmp/pr-body.md

          if [ "$CONFLICT" = "true" ]; then
            {
              echo
              echo "## ⚠️ Merge conflicts detected"
              echo
              echo "This branch contains conflict markers and **must be resolved manually** before merging."
              echo
              echo "Conflicting files:"
              echo "$CONFLICT_FILES" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/'
            } >> /tmp/pr-body.md
          fi

          DRAFT_FLAG=""
          LABEL_FLAG=""
          if [ "$CONFLICT" = "true" ]; then
            DRAFT_FLAG="--draft"
            LABEL_FLAG="--label needs-manual-resolution"
          fi

          gh pr create \
            -R ${{ github.repository }} \
            --base "${BASE}" \
            --head "${BRANCH}" \
            --title "$TITLE" \
            --body-file /tmp/pr-body.md \
            $DRAFT_FLAG \
            $LABEL_FLAG

      - name: Summary
        run: |
          {
            echo "## upstream-tag-sync"
            echo ""
            echo "- current dev upstream tag: ${{ steps.plan.outputs.from_tag }}"
            echo "- mirrored upstream tag: ${{ steps.mirror.outputs.tag }}"
            echo "- mirrored sha: ${{ steps.mirror.outputs.sha_short }}"
            echo "- sync needed: ${{ steps.plan.outputs.needed }}"
            echo "- sync branch: ${{ steps.plan.outputs.branch }}"
            echo "- merge conflict: ${{ steps.sync.outputs.conflict }}"
            if [ "${{ steps.gate.outputs.blocked }}" = "true" ]; then
              echo "- blocked by open sync PR: ${{ steps.gate.outputs.existing }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
