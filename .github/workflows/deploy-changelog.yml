name: deploy-changelog

on:
  push:
    branches:
      - dev
    paths:
      - services/changelog/**
      - .github/workflows/deploy-changelog.yml
  workflow_dispatch:

concurrency:
  group: deploy-changelog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode' && github.ref_name == 'dev'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Typecheck
        working-directory: services/changelog
        run: bun run typecheck:tsc

      - name: Test
        working-directory: services/changelog
        run: bun test

      - name: Deploy
        working-directory: services/changelog
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
