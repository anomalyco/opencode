name: flatpak

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  repo:
    if: github.repository == 'anomalyco/opencode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder unzip
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Vendor offline sources
        run: ./vendor.sh
        working-directory: packages/desktop/flatpak

      - name: Build Flatpak repo
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=repo builddir ai.opencode.desktop.yml
          flatpak build-update-repo repo
        working-directory: packages/desktop/flatpak
        timeout-minutes: 90

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -a repo site/repo
          cp opencode.flatpakrepo site/
        working-directory: packages/desktop/flatpak

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 # pin a commit SHA before enabling on releases
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/desktop/flatpak/site
          publish_branch: gh-pages