name: test-tools

# 手动触发：用真 key 对 tools 镜像做只读功能测试。
# key 全部来自 fork 的 Actions Secrets（Settings → Secrets and variables → Actions），
# 由 runner 以环境变量注入，日志自动打码。需预先填好：
#   GH_TOKEN, HCLOUD_AK, HCLOUD_SK,
#   ALIYUN_AK, ALIYUN_SK,
#   OCI_CONFIG_B64, OCI_KEY_PEM,
#   CLOUDFLARE_API_TOKEN
# （git / tailscale / markitdown / lmnr-cli 无需 key，只验版本与本地操作）
on:
  workflow_dispatch:
    inputs:
      image:
        description: "待测镜像 tag（空则用 latest）"
        required: false
        default: ""

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xieyucheng123/opencode-tools:${{ inputs.image != '' && inputs.image || 'latest' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      HCLOUD_AK: ${{ secrets.HCLOUD_AK }}
      HCLOUD_SK: ${{ secrets.HCLOUD_SK }}
      ALIYUN_AK: ${{ secrets.ALIYUN_AK }}
      ALIYUN_SK: ${{ secrets.ALIYUN_SK }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: gh
        run: gh auth status

      - name: git (版本 + 本地提交冒烟, 无需 key)
        run: |
          git --version
          rm -rf /tmp/git-smoke && mkdir -p /tmp/git-smoke && cd /tmp/git-smoke
          git init -q && git config user.email tools@test && git config user.name tools
          echo hi > f.txt && git add . && git commit -qm init && git log --oneline

      - name: hcloud (dryrun, 不真实执行)
        run: hcloud ECS NovaListServers --cli-region=cn-north-4 --cli-access-key="$HCLOUD_AK" --cli-secret-key="$HCLOUD_SK" --dryrun

      - name: aliyun (只读 DescribeRegions)
        run: aliyun ecs DescribeRegions --access-key-id "$ALIYUN_AK" --access-key-secret "$ALIYUN_SK" --region cn-hangzhou

      - name: oci (只读 region list)
        env:
          OCI_CONFIG_B64: ${{ secrets.OCI_CONFIG_B64 }}
          OCI_KEY_PEM: ${{ secrets.OCI_KEY_PEM }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_CONFIG_B64" | base64 -d > ~/.oci/config
          echo "$OCI_KEY_PEM" > ~/.oci/key.pem
          chmod 600 ~/.oci/config ~/.oci/key.pem
          sed -i "s|^key_file=.*|key_file=$HOME/.oci/key.pem|" ~/.oci/config
          oci iam region list --config-file ~/.oci/config

      - name: wrangler
        run: wrangler whoami

      - name: markitdown (本地转码，无需 key)
        run: |
          printf '# hi\n\nhello\n' > /tmp/t.md
          markitdown /tmp/t.md

      - name: baked-config (非涉密默认配置已烘入镜像)
        run: |
          test -f /root/.config/opencode/opencode.jsonc
          test -f /root/.config/opencode/AGENTS.md
          grep -q muse-spark /root/.config/opencode/opencode.jsonc

      - name: tailscale + lmnr-cli (版本，无需 key/daemon)
        run: |
          tailscale version
          lmnr-cli --help | head -5

      - name: ssh (版本 + 本地 keygen 冒烟, 无需 key)
        run: |
          ssh -V
          ssh-keygen -t ed25519 -f /tmp/ssh-smoke -N "" -q && test -f /tmp/ssh-smoke && rm -f /tmp/ssh-smoke /tmp/ssh-smoke.pub
