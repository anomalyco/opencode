name: claude-issue-implement

# Issue に `/claude-approve` とコメントされたら、Claude が実装方針に沿って
# 実装・コミット・push し、Pull Request を自動作成する。

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-issue-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # `/claude-approve` で始まり、PR ではなく Issue へのコメントで、
    # 信頼できる権限の発言者のみ実装を許可する。
    if: |
      startsWith(github.event.comment.body, '/claude-approve') &&
      !github.event.issue.pull_request &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # PR は既定の GITHUB_TOKEN で作成する。GitHub の仕様により、この場合は
      # 自動作成された PR で他のワークフロー（test / review / pr-standards 等）が
      # 起動しない。CI を回したいときはメンテナが PR を close→reopen するか、
      # コミットを追加するなどして手動で再トリガーすること。
      - name: Implement issue and open pull request
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Claude Max サブスクの OAuth トークンで認証する（API の従量課金・
          # レート Tier ではなく Max プランの利用枠を使う）。
          # トークンは `claude setup-token` で発行する。
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github_token を明示すると Action は OIDC を使わない。指定しない場合
          # Claude GitHub App との OIDC トークン交換（id-token: write 必須・
          # App インストール前提）になり失敗するため、既定の GITHUB_TOKEN を渡す。
          github_token: ${{ github.token }}
          # Claude の各ターン（ツール呼び出し・出力）を Actions ログに表示する。
          # 既定では伏せられ実装失敗時の調査ができないため有効化する。本リポジトリは
          # private で、認証トークンは登録済み Secret として常にマスクされる。
          show_full_output: true
          claude_args: |
            --model claude-opus-4-7
            --max-turns 50
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(bun:*)"
          prompt: |
            あなたはこのリポジトリの実装担当 AI です。対象は Issue #${{ github.event.issue.number }} です。
            ユーザーが `/claude-approve` で実装を承認しました。実装し、Pull Request を作成してください。
            すべての出力（コミットメッセージ・PR・コメント）は日本語で書いてください。

            重要: このリポジトリは fork のため、`gh` コマンドには必ず `-R ${{ github.repository }}`
            を付けること。付けないと upstream の親リポジトリに解決され、別物の Issue を読んだり
            親リポジトリへ PR を作ろうとして失敗する。

            ## 手順

            1. `gh issue view ${{ github.event.issue.number }} -R ${{ github.repository }} --comments`
               で Issue 本文と、Claude が以前投稿した「実装方針」コメントを読む。これに沿って実装する。
            2. PR を作成する前に、次のリポジトリ規約を必ず読み、従う:
               - `.opencode/skills/gh-pr-compliance/SKILL.md`
               - `.github/pull_request_template.md`
               - `CONTRIBUTING.md`
            3. ベースブランチ `dev` から作業ブランチ `claude/issue-${{ github.event.issue.number }}` を作成する。
            4. 実装方針に沿ってコードを変更する。可能なら `bun` で型チェック・テストを行い壊れていないか確認する。
            5. Conventional Commits 形式（例 `fix:` `feat:` `chore:`）で簡潔にコミットし、ブランチを push する。
            6. `gh pr create -R ${{ github.repository }} --base dev` で Pull Request を作成する:
               - タイトルは Conventional Commits の接頭辞付きで簡潔に。
               - 本文は `.github/pull_request_template.md` の見出しをそのまま使い、各セクションを埋める。
               - `### Issue for this PR` セクションに `Closes #${{ github.event.issue.number }}` を書く。
               - 本文は簡潔・具体的に。明らかに AI 生成と分かる冗長な文章は書かない
                 （テンプレートにそうした PR は閉じられると明記されている）。
            7. PR 作成後、`gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }}`
               で作成した PR の URL を Issue にコメントする。

            ## 注意
            - 実装方針が見当たらない、または実装が現実的でないと判断した場合は、
              無理に PR を作らず、その理由を `gh issue comment ${{ github.event.issue.number }}
              -R ${{ github.repository }}` で Issue に説明して終了する。
            - Issue に直接関係しない変更は含めない。
            - `dev` ブランチへ直接 push しない。必ず作業ブランチを使う。

      # claude-code-action の execution_file（SDKMessage の JSON 配列）を、ベンダリングした
      # format-claude-stream で人間が読みやすいテキストへ整形し、Job Summary に出力する。
      # 失敗時の調査用に if: always() で必ず走らせる。詳細は
      # .github/format-claude-stream/VENDORING.md を参照。
      - name: Render Claude log to job summary
        if: ${{ always() && steps.claude.outputs.execution_file != '' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          bun install --cwd .github/format-claude-stream --frozen-lockfile --ignore-scripts
          bun .github/format-claude-stream/render-execution-file.ts "$EXECUTION_FILE" \
            > /tmp/claude-log.txt 2> /tmp/claude-log.err || {
              echo "(ログの整形に失敗しました)" >> /tmp/claude-log.txt
              cat /tmp/claude-log.err >> /tmp/claude-log.txt
            }
          # ログ本文にバッククォートが含まれても閉じないよう、コードフェンスは ~~~ を使う。
          {
            echo "## 🧩 Claude 実行ログ（整形済み）"
            echo ""
            echo "<details><summary>クリックで展開</summary>"
            echo ""
            echo "~~~text"
            cat /tmp/claude-log.txt
            echo "~~~"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
