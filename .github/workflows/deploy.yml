name: deploy

on:
  push:
    branches:
      - dev
      - production
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  legacy:
    if: github.repository == 'anomalyco/opencode' && (github.ref_name == 'dev' || github.ref_name == 'production')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-${{ github.ref_name }}
          role-session-name: opencode-${{ github.run_id }}
          aws-region: us-east-1

      # A 15-minute token for this stage's Workers only, minted by the token issuer (anomalyco/secrets) from the role
      # above. It is a step output, so only the Deploy step gets it.
      - name: Cloudflare token
        id: cloudflare-token
        run: bash .github/release/cloudflare-token.sh
        env:
          CLOUDFLARE_TOKEN_URL: ${{ vars.CLOUDFLARE_TOKEN_URL }}

      # The GitHub App secrets are read here, so only this step ever has them. They reach cf through a file in the
      # runner's temp directory, never argv, and the file is removed when the step ends.
      - name: Deploy
        working-directory: services/legacy
        env:
          STAGE: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-token.outputs.token }}
        # An explicit bash runs with pipefail, so a failed secret read fails the step.
        shell: bash
        run: |
          umask 077
          secrets="$RUNNER_TEMP/legacy-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          for name in GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY; do
            aws secretsmanager get-secret-value --secret-id "opencode/$STAGE/$name" --output json |
              jq --arg name "$name" '{($name): .SecretString}'
          done | jq -s add > "$secrets"
          bun run deploy:$STAGE --secrets-file "$secrets"

  # The /data site, its OG image Worker and the sync Workflow (services/data).
  data:
    if: github.repository == 'anomalyco/opencode' && (github.ref_name == 'dev' || github.ref_name == 'production')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-${{ github.ref_name }}
          role-session-name: opencode-${{ github.run_id }}
          aws-region: us-east-1

      - name: Cloudflare token
        id: cloudflare-token
        run: bash .github/release/cloudflare-token.sh
        env:
          CLOUDFLARE_TOKEN_URL: ${{ vars.CLOUDFLARE_TOKEN_URL }}

      # The Workers' secrets are read here, so only this step ever has them. They reach cf through files in the
      # runner's temp directory, never argv, and are removed when the step ends.
      - name: Deploy
        working-directory: services/data
        env:
          STAGE: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ steps.cloudflare-token.outputs.token }}
        # An explicit bash runs with pipefail, so a failed secret read fails the step.
        shell: bash
        run: |
          umask 077
          secrets="$RUNNER_TEMP/data-secrets.json"
          trap 'rm -f "$secrets" "$secrets".*' EXIT
          for name in DATA_DATABASE_HOST DATA_DATABASE_USERNAME DATA_DATABASE_PASSWORD R2_SQL_AUTH_TOKEN DATA_HIDDEN_MODELS; do
            aws secretsmanager get-secret-value --secret-id "opencode/$STAGE/$name" --output json |
              jq --arg name "$name" '{($name): .SecretString}'
          done | jq -s add > "$secrets"
          bun run deploy:$STAGE --secrets-file "$secrets"
