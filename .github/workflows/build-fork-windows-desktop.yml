name: build-fork-windows-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to stamp into package.json"
        required: true
        type: string
      release_tag:
        description: "Optional GitHub release tag to upload the installer to"
        required: false
        type: string
      release_name:
        description: "Optional GitHub release title"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}

permissions:
  contents: write

jobs:
  build-cli:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Build Windows CLI sidecar
        run: bun ./packages/opencode/script/build.ts --single --baseline
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: prod

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows
          path: packages/opencode/dist/opencode-windows-*

  build-desktop:
    needs: build-cli
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: fork-windows-desktop-x64

      - name: Prepare desktop sidecar
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          OPENCODE_CHANNEL: prod
          OPENCODE_CLI_ARTIFACT: opencode-cli-windows
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_WINDOWS_SIGN: "false"
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Build unsigned Windows desktop installer
        run: bun run tauri build --target x86_64-pc-windows-msvc --config ./src-tauri/tauri.fork.windows.conf.json --verbose
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_WINDOWS_SIGN: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64-unsigned-${{ inputs.version }}
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Publish installer to GitHub release
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.release_tag }}"
          $title = "${{ inputs.release_name || inputs.release_tag }}"
          $files = Get-ChildItem "packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -ExpandProperty FullName

          if (-not $files) {
            throw "No NSIS installer was produced"
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes "Unsigned Windows desktop build generated by build-fork-windows-desktop."
          }

          gh release upload $tag $files --clobber
