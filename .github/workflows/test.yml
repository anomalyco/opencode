name: test

on:
  push:
    branches: [dev]
    paths:
      - "packages/opencode/**"
      - "packages/app/**"
      - "packages/ui/**"
      - "packages/core/**"
      - "packages/plugin/**"
      - "packages/sdk/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
  pull_request:
    paths:
      - "packages/opencode/**"
      - "packages/app/**"
      - "packages/ui/**"
      - "packages/core/**"
      - "packages/plugin/**"
      - "packages/sdk/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run unit tests
        run: bun turbo opencode#test:ci @yunpat/app#test:ci @yunpat/ui#test:ci
        env:
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: "false"

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: packages/*/.artifacts/unit/junit.xml
          check_name: unit results
          detailed_summary: true
          fail_on_failure: true
