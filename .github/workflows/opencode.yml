name: lotioncode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  lotioncode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /lotioncode') ||
      startsWith(github.event.comment.body, '/lotioncode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run lotioncode
        uses: anomalyco/lotioncode/github@latest
        env:
          LOTIONCODE_API_KEY: ${{ secrets.LOTIONCODE_API_KEY }}
          LOTIONCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: lotioncode/claude-opus-4-5
