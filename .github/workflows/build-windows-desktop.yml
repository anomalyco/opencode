name: Build Windows Desktop
run-name: "Build Windows Desktop App"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.1). Leave empty to skip release creation."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-desktop:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      OPENCODE_CHANNEL: prod
      RUST_TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install

      - name: Prepare Desktop
        run: |
          $rootVersion = $env:APP_VERSION -replace '^v', ''
          if ($rootVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$') {
            $base = (Get-Content VERSION).Trim()
            $tag = [regex]::Replace($env:APP_VERSION.ToLowerInvariant(), '[^0-9a-z-]+', '-').Trim('-')
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = 'dev' }
            $rootVersion = "$base-$tag.$env:GITHUB_RUN_NUMBER"
          }
          bun ./script/sync-version.ts $rootVersion
        shell: pwsh

      - name: Build Desktop App
        run: |
          cd packages/desktop
          bun run package:win

          $version = $env:APP_VERSION -replace '^v', ''
          $installer = Get-ChildItem -Path dist -Filter "*.exe" -File |
            Where-Object { $_.Name -notmatch "blockmap" } |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not produced"
          }
          Rename-Item -Path $installer.FullName -NewName "OpenCode_${version}_x64-setup.exe" -Force
          ./../../script/sign-windows.ps1 "dist/OpenCode_${version}_x64-setup.exe"
        shell: pwsh

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64
          path: packages/desktop/dist/OpenCode_*_x64-setup.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
        run: |
          $tag = $env:APP_VERSION
          $version = $tag -replace '^v', ''
          $asset = "packages/desktop/dist/OpenCode_${version}_x64-setup.exe"
          gh release view $tag -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $env:GITHUB_REPOSITORY --draft --title $tag --target $env:GITHUB_SHA
          }
          gh release upload $tag $asset -R $env:GITHUB_REPOSITORY --clobber
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
