name: build-nix-deps

on:
  push:
    branches: [dev]
    paths:
      - "bun.lock"
      - "package.json"
      - "packages/**/package.json"
      - "services/**/package.json"
      - "patches/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/build-nix-deps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.ref == 'refs/heads/dev'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - system: aarch64-linux
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - system: aarch64-darwin
            runner: blacksmith-6vcpu-macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Check lockfile source selection
        if: matrix.system == 'x86_64-linux'
        run: nix shell --inputs-from . nixpkgs#bun --command bun nix/check-lock.ts

      - name: Build dependencies and run offline cache fixtures
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix build --no-link \
            ".#packages.${SYSTEM}.opencode.node_modules" \
            ".#checks.${SYSTEM}.bun-cache"
