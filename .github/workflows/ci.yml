name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - run: bun typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install
      - name: Configure git identity
        run: |
          git config --global user.email "ci@opencode.ai"
          git config --global user.name "opencode-ci"
      - run: bun turbo test

  build:
    needs: [typecheck, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            archive: tar.gz
          - os: ubuntu-latest
            target: bun-linux-arm64
            archive: tar.gz
          - os: macos-latest
            target: bun-darwin-x64
            archive: zip
          - os: macos-latest
            target: bun-darwin-arm64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install

      - name: Build
        run: bun ./script/build.ts --single --skip-install
        working-directory: packages/opencode

      - name: Find build output
        id: find
        run: |
          dir=$(ls -d packages/opencode/dist/opencode-* 2>/dev/null | head -1)
          name=$(basename "$dir")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: tar -czf ${{ steps.find.outputs.name }}.tar.gz -C ${{ steps.find.outputs.dir }} bin

      - name: Package (zip)
        if: matrix.archive == 'zip'
        run: cd ${{ steps.find.outputs.dir }} && zip -r ../../${{ steps.find.outputs.name }}.zip bin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find.outputs.name }}
          path: |
            packages/opencode/${{ steps.find.outputs.name }}.tar.gz
            packages/opencode/${{ steps.find.outputs.name }}.zip
          if-no-files-found: warn
          retention-days: 30
