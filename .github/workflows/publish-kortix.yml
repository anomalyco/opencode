name: Publish @kortix/opencode-ai

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.2.0)"
        required: true
      tag:
        description: "npm tag (latest, beta, dev)"
        default: "latest"
      dry_run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Build CLI (all platforms)
        run: bun run build
        working-directory: packages/opencode
        env:
          KORTIX_BUILD: "true"
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_CHANNEL: ${{ inputs.tag }}

      - name: Publish CLI to npm
        run: bun ./script/publish-kortix.ts ${{ inputs.tag }}
        working-directory: packages/opencode
        env:
          KORTIX_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build SDK
        run: bun run build
        working-directory: packages/sdk/js

      - name: Publish SDK to npm
        run: bun ./script/publish-kortix.ts ${{ inputs.tag }}
        working-directory: packages/sdk/js
        env:
          KORTIX_SDK_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ !inputs.dry_run }}
