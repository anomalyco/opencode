name: Update Nix Hashes

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'packages/*/package.json'
      - 'nix/optional-packages/**'
      - 'nix/scripts/optional-metadata.ts'
  pull_request:
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'packages/*/package.json'
      - 'nix/optional-packages/**'
      - 'nix/scripts/optional-metadata.ts'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            platform: linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            platform: linux
          - runner: macos-latest
            system: aarch64-darwin
            platform: darwin
          - runner: macos-15-intel
            system: x86_64-darwin
            platform: darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Configure git
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"

      - name: Preflight build
        id: preflight
        continue-on-error: true
        run: |
          echo "Verifying existing hashes for ${{ matrix.system }}..."
          nix build .#packages.${{ matrix.system }}.default --system ${{ matrix.system }} -L
          echo "${{ matrix.system }} preflight build successful."

      - name: Summarize preflight status
        id: preflight_status
        run: |
          set -e
          if [ "${PREFLIGHT_OUTCOME}" = "failure" ]; then
            echo "Preflight detected stale hashes."
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Preflight build passed."
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}

      - name: Update build output hashes
        env:
          SYSTEMS: ${{ matrix.system }}
        run: |
          set -euo pipefail
          nix/scripts/update-hashes.sh

      - name: Detect hash changes
        id: hash_change
        run: |
          set -euo pipefail
          if git diff --quiet nix/hashes.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hash changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Hashes updated; running post-update verification."
          fi

      - name: Verification build
        if: steps.hash_change.outputs.changed == 'true'
          || steps.preflight_status.outputs.failed == 'true'
        run: |
          echo "Running post-update verification build for ${{ matrix.system }}..."
          nix build .#packages.${{ matrix.system }}.default --system ${{ matrix.system }} -L
          echo "${{ matrix.system }} build successful."

      - name: Upload hash changes
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.system }}
          path: nix/hashes.json
          retention-days: 1

  commit-hashes:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"

      - name: Download all hash files
        uses: actions/download-artifact@v4
        with:
          path: hash-artifacts

      - name: Merge hash files
        run: |
          set -euo pipefail

          BASE_HASH="nix/hashes.json"
          for system in x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin; do
            if [ -f "hash-artifacts/hashes-${system}/hashes.json" ]; then
              echo "Merging ${system} hashes..."
              # Deep merge: preserve all keys in nested objects
              jq --arg sys "$system" \
                --slurpfile new "hash-artifacts/hashes-${system}/hashes.json" \
                '.models = ($new[0].models // .models) |
                 .nodeModules[$sys] = $new[0].nodeModules[$sys] |
                 .optional = (.optional + $new[0].optional)' \
                "$BASE_HASH" > /tmp/merged.json
              mv /tmp/merged.json "$BASE_HASH"
            else
              echo "Warning: No hash artifact found for ${system}"
            fi
          done

          echo "Final merged hashes.json:"
          cat "$BASE_HASH"

      - name: Derive commit metadata
        id: commit_meta
        run: |
          set -euo pipefail
          EVENT="$GITHUB_EVENT_NAME"
          LABEL="$GITHUB_REF_NAME"
          SUMMARY="Hashes refreshed for $LABEL"
          TAG_NAME=""
          PR_NUMBER=""
          if [ -f "$GITHUB_EVENT_PATH" ]; then
            TAG_NAME="$(jq -r '.release.tag_name // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            PR_NUMBER="$(jq -r '.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
          fi
          case "$EVENT" in
            release)
              LABEL="release:${GITHUB_REF_NAME}"
              if [ -n "$TAG_NAME" ]; then
                LABEL="release:${TAG_NAME}"
              fi
              SUMMARY="Hashes refreshed for ${LABEL}"
              ;;
            pull_request)
              LABEL="pr:${GITHUB_REF_NAME}"
              if [ -n "$PR_NUMBER" ]; then
                LABEL="pr:${PR_NUMBER}"
              fi
              SUMMARY="Hashes refreshed for ${LABEL}"
              ;;
            workflow_dispatch)
              LABEL="manual:${GITHUB_REF_NAME}"
              SUMMARY="Manual hash refresh for ${LABEL}"
              ;;
            *)
              LABEL="branch:${GITHUB_REF_NAME}"
              SUMMARY="Hashes refreshed for ${LABEL}"
              ;;
          esac
          MESSAGE="nix: update hashes (${LABEL})"
          {
            echo "message=$MESSAGE"
            echo "label=$LABEL"
            echo "summary=$SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Commit Nix hash changes
        env:
          COMMIT_MESSAGE: ${{ steps.commit_meta.outputs.message }}
          UPDATE_LABEL: ${{ steps.commit_meta.outputs.label }}
          UPDATE_SUMMARY: ${{ steps.commit_meta.outputs.summary }}
        run: |
          set -euo pipefail

          summarize() {
            local status="$1"
            {
              echo "### Nix Hash Update"
              echo ""
              echo "- context: ${UPDATE_LABEL}"
              echo "- ref: ${GITHUB_REF_NAME}"
              echo "- status: ${status}"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${UPDATE_SUMMARY:-}" ]; then
              echo "- note: ${UPDATE_SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -n "${GITHUB_SERVER_URL:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ] && [ -n "${GITHUB_RUN_ID:-}" ]; then
              echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          if git diff --quiet flake.nix nix/node-modules.nix nix/hashes.json; then
            summarize "no changes"
            echo "No changes to tracked Nix files. Hashes are already up to date."
            exit 0
          fi

          # Prevent infinite loop: check if the last commit was a hash update
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_COMMIT_MSG" | grep -q "^nix: update hashes"; then
            summarize "skipped (recent hash update)"
            echo "Last commit was already a hash update. Skipping to prevent loop."
            exit 0
          fi

          git add flake.nix nix/node-modules.nix nix/hashes.json
          git commit -m "$COMMIT_MESSAGE"

          # For PRs, push to the head branch; for push events, push to current branch
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin HEAD:${{ github.head_ref }}
          else
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

          summarize "committed $(git rev-parse --short HEAD)"
