name: Update Nix Hashes

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'packages/*/package.json'
      - 'nix/optional-packages/**'
      - 'nix/scripts/optional-metadata.ts'
  pull_request:
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'packages/*/package.json'
      - 'nix/optional-packages/**'
      - 'nix/scripts/optional-metadata.ts'

jobs:
  cancel-previous:
    runs-on: ubuntu-latest
    steps:
      - uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

  verify:
    needs: cancel-previous
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            platform: linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            platform: linux
          - runner: macos-latest
            system: aarch64-darwin
            platform: darwin
          - runner: macos-15-intel
            system: x86_64-darwin
            platform: darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Configure git
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"

      - name: Build and extract hashes
        id: build_extract
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Building for ${{ matrix.system }} to verify/extract hashes..."
          
          BUILD_LOG=$(mktemp)
          nix build .#packages.${{ matrix.system }}.default --system ${{ matrix.system }} -L 2>&1 | tee "$BUILD_LOG" || BUILD_FAILED=true
          
          if [ -z "${BUILD_FAILED:-}" ]; then
            echo "Build successful with current hashes."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            rm -f "$BUILD_LOG"
            exit 0
          fi
          
          echo "Build failed, extracting correct hash..."
          CORRECT_HASH=$(grep -E 'got:\s+sha256-[A-Za-z0-9+/=]+' "$BUILD_LOG" | awk '{print $2}' | head -n1 || true)
          
          if [ -z "$CORRECT_HASH" ]; then
            CORRECT_HASH=$(grep -A2 'hash mismatch' "$BUILD_LOG" | grep 'got:' | awk '{print $2}' | sed 's/sha256:/sha256-/' || true)
          fi
          
          if [ -z "$CORRECT_HASH" ]; then
            echo "Failed to extract hash from build output"
            tail -100 "$BUILD_LOG"
            rm -f "$BUILD_LOG"
            exit 1
          fi
          
          echo "Extracted hash: $CORRECT_HASH"
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          echo "hash=$CORRECT_HASH" >> "$GITHUB_OUTPUT"
          rm -f "$BUILD_LOG"

      - name: Update hash file
        if: steps.build_extract.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          HASH_FILE="nix/hashes.json"
          SYSTEM="${{ matrix.system }}"
          CORRECT_HASH="${{ steps.build_extract.outputs.hash }}"
          
          if [ ! -f "$HASH_FILE" ]; then
            mkdir -p "$(dirname "$HASH_FILE")"
            jq -n '{nodeModules: {}, optional: {}}' > "$HASH_FILE"
          fi
          
          echo "Updating hash for ${SYSTEM} to ${CORRECT_HASH}"
          tmp=$(mktemp)
          jq --arg system "$SYSTEM" --arg value "$CORRECT_HASH" '.nodeModules[$system] = $value' "$HASH_FILE" >"$tmp"
          mv "$tmp" "$HASH_FILE"
          
          echo "Hash file updated."

      - name: Upload hash changes
        uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.system }}
          path: nix/hashes.json
          retention-days: 1

  commit-hashes:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --global user.email "opencode@sst.dev"
          git config --global user.name "opencode"

      - name: Download all hash files
        uses: actions/download-artifact@v4
        with:
          path: hash-artifacts

      - name: Sync branch state
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          BRANCH="${TARGET_BRANCH:-${GITHUB_REF_NAME}}"
          git fetch origin "$BRANCH"
          if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          git reset --hard "origin/$BRANCH"

      - name: Merge hash files
        id: merge_hashes
        run: |
          set -euo pipefail

          BASE_HASH="nix/hashes.json"
          if [ ! -f "$BASE_HASH" ]; then
            mkdir -p "$(dirname "$BASE_HASH")"
            jq -n '{nodeModules: {}, optional: {}}' > "$BASE_HASH"
          fi
          for system in x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin; do
            if [ -f "hash-artifacts/hashes-${system}/hashes.json" ]; then
              echo "Merging ${system} hashes..."
              # Deep merge: preserve all keys in nested objects
              jq --arg sys "$system" \
                --slurpfile new "hash-artifacts/hashes-${system}/hashes.json" \
                '.nodeModules[$sys] = $new[0].nodeModules[$sys] |
                 .optional = (.optional + $new[0].optional)' \
                "$BASE_HASH" > /tmp/merged.json
              mv /tmp/merged.json "$BASE_HASH"
            else
              echo "Warning: No hash artifact found for ${system}"
            fi
          done

          echo "Final merged hashes.json:"
          cat "$BASE_HASH"

          DUMMY="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          HAS_NODE=$(jq --arg dummy "$DUMMY" '[ (.nodeModules // {})[] | select(. != $dummy) ] | length' "$BASE_HASH")
          HAS_OPTIONAL=$(jq '(.optional // {}) | length' "$BASE_HASH")
          if [ "$HAS_NODE" -gt 0 ] || [ "$HAS_OPTIONAL" -gt 0 ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Nix hash changes
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          summarize() {
            local status="$1"
            {
              echo "### Nix Hash Update"
              echo ""
              echo "- ref: ${GITHUB_REF_NAME}"
              echo "- status: ${status}"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${GITHUB_SERVER_URL:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ] && [ -n "${GITHUB_RUN_ID:-}" ]; then
              echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
          }

          FILES=(flake.nix nix/node-modules.nix nix/hashes.json)
          STATUS="$(git status --short -- "${FILES[@]}" || true)"
          if [ -z "$STATUS" ]; then
            summarize "no changes"
            echo "No changes to tracked Nix files. Hashes are already up to date."
            exit 0
          fi

          git add flake.nix nix/node-modules.nix nix/hashes.json
          git commit -m "Update Nix hashes"

          BRANCH="${TARGET_BRANCH:-${GITHUB_REF_NAME}}"
          git push origin HEAD:"$BRANCH"

          summarize "committed $(git rev-parse --short HEAD)"
