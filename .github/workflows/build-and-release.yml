name: Build and Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build opencode
        run: cd packages/opencode && bun run build

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=dev-${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OpenCode ${{ steps.version.outputs.version }} (Dev)
          draft: false
          prerelease: true
          files: packages/opencode/dist/*/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
