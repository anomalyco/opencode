name: Build and Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build opencode
        run: cd packages/opencode && bun run build

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=dev-nfs-${VERSION}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "release_name=OpenCode ${VERSION} (Dev NFS)" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        if: always()
        run: |
          gh release delete ${{ steps.version.outputs.tag }} --yes || true
          git push origin :refs/tags/${{ steps.version.outputs.tag }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          draft: false
          prerelease: true
          make_latest: false
          files: |
            packages/opencode/dist/*/bin/opencode*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
