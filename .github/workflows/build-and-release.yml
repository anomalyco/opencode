name: Build and Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=dev-nfs-${VERSION}-${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "release_name=OpenCode ${VERSION} (Dev NFS)" >> $GITHUB_OUTPUT

      - name: Delete existing release (if any)
        if: always()
        run: |
          gh release delete ${{ steps.version.outputs.tag }} --yes || true
          git push origin :refs/tags/${{ steps.version.outputs.tag }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create install script
        run: |
          cat > install-opencode.sh << 'EOF'
          #!/bin/bash
          set -e
          echo "Installing OpenCode dev binary..."
          cd /tmp
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
             BINARY="opencode-linux-x64"
          elif [ "$ARCH" = "aarch64" ]; then
             BINARY="opencode-linux-arm64"
          else
             echo "Unsupported architecture: $ARCH"
             exit 1
          fi
          curl -L -o opencode "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${BINARY}"
          chmod +x opencode
          mkdir -p ~/.opencode/bin
          mv opencode ~/.opencode/bin/opencode
          echo "OpenCode installed to ~/.opencode/bin/opencode"
          echo ""
          echo "Add to your PATH:"
          echo '  export PATH="$HOME/.opencode/bin:$PATH"'
          echo ""
          echo "Run with: opencode"
          EOF
          chmod +x install-opencode.sh

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        run: |
          # Backup original package.json
          cp packages/opencode/package.json packages/opencode/package.json.bak
          
          # Replace workspace:* with file:../ paths in opencode package.json
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('packages/opencode/package.json', 'utf8'));
          
          // Replace workspace dependencies with file paths
          if (pkg.dependencies) {
            if (pkg.dependencies['@opencode-ai/plugin'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/plugin'] = 'file:../plugin';
            }
            if (pkg.dependencies['@opencode-ai/script'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/script'] = 'file:../script';
            }
            if (pkg.dependencies['@opencode-ai/sdk'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/sdk'] = 'file:../sdk/js';
            }
            if (pkg.dependencies['@opencode-ai/util'] === 'workspace:*') {
              pkg.dependencies['@opencode-ai/util'] = 'file:../util';
            }
          }
          
          fs.writeFileSync('packages/opencode/package.json', JSON.stringify(pkg, null, 2));
          "
          
          # Reinstall with file paths
          cd packages/opencode
          rm -rf node_modules
          bun install --no-save
          cd ../..

      - name: Build all linux binaries
        run: |
          cd packages/opencode
          bun run build
          
      - name: Restore original package.json
        if: always()
        run: |
          if [ -f packages/opencode/package.json.bak ]; then
            mv packages/opencode/package.json.bak packages/opencode/package.json
          fi

      - name: Copy all linux binaries
        run: |
          mkdir -p release-binaries
          for dir in packages/opencode/dist/opencode-linux*/bin; do
            binary="$dir/opencode"
            if [ -f "$binary" ]; then
              platform=$(basename $(dirname "$dir"))
              cp "$binary" "release-binaries/opencode-${platform}"
              chmod +x "release-binaries/opencode-${platform}"
            fi
          done
          ls -la release-binaries/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          draft: false
          prerelease: true
          files: |
            release-binaries/*
            install-opencode.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        run: |
          cp packages/opencode/package.json packages/opencode/package.json.bak
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('packages/opencode/package.json', 'utf8'));
          if (pkg.dependencies) {
            if (pkg.dependencies['@opencode-ai/plugin'] === 'workspace:*') pkg.dependencies['@opencode-ai/plugin'] = 'file:../plugin';
            if (pkg.dependencies['@opencode-ai/script'] === 'workspace:*') pkg.dependencies['@opencode-ai/script'] = 'file:../script';
            if (pkg.dependencies['@opencode-ai/sdk'] === 'workspace:*') pkg.dependencies['@opencode-ai/sdk'] = 'file:../sdk/js';
            if (pkg.dependencies['@opencode-ai/util'] === 'workspace:*') pkg.dependencies['@opencode-ai/util'] = 'file:../util';
          }
          fs.writeFileSync('packages/opencode/package.json', JSON.stringify(pkg, null, 2));
          "
          cd packages/opencode
          rm -rf node_modules
          bun install --no-save
          cd ../..

      - name: Build macOS arm64 binary
        run: |
          cd packages/opencode
          bun run build --single

      - name: Copy binary and make executable
        run: |
          BINARY=$(find packages/opencode/dist -name "opencode" -type f | head -1)
          cp "$BINARY" opencode-macos-arm64
          chmod +x opencode-macos-arm64

      - name: Upload macOS binary to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: opencode-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    runs-on: macos-13
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        run: |
          cp packages/opencode/package.json packages/opencode/package.json.bak
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('packages/opencode/package.json', 'utf8'));
          if (pkg.dependencies) {
            if (pkg.dependencies['@opencode-ai/plugin'] === 'workspace:*') pkg.dependencies['@opencode-ai/plugin'] = 'file:../plugin';
            if (pkg.dependencies['@opencode-ai/script'] === 'workspace:*') pkg.dependencies['@opencode-ai/script'] = 'file:../script';
            if (pkg.dependencies['@opencode-ai/sdk'] === 'workspace:*') pkg.dependencies['@opencode-ai/sdk'] = 'file:../sdk/js';
            if (pkg.dependencies['@opencode-ai/util'] === 'workspace:*') pkg.dependencies['@opencode-ai/util'] = 'file:../util';
          }
          fs.writeFileSync('packages/opencode/package.json', JSON.stringify(pkg, null, 2));
          "
          cd packages/opencode
          rm -rf node_modules
          bun install --no-save
          cd ../..

      - name: Build macOS x64 binary
        run: |
          cd packages/opencode
          bun run build --single

      - name: Copy binary and make executable
        run: |
          BINARY=$(find packages/opencode/dist -name "opencode" -type f | head -1)
          cp "$BINARY" opencode-macos-x64
          chmod +x opencode-macos-x64

      - name: Upload macOS Intel binary to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: opencode-macos-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build full project
        run: bun install

      - name: Replace workspace dependencies with file paths
        shell: pwsh
        run: |
          Copy-Item packages/opencode/package.json packages/opencode/package.json.bak
          $pkg = Get-Content packages/opencode/package.json | ConvertFrom-Json
          if ($pkg.dependencies.'@opencode-ai/plugin' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/plugin' = 'file:../plugin' }
          if ($pkg.dependencies.'@opencode-ai/script' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/script' = 'file:../script' }
          if ($pkg.dependencies.'@opencode-ai/sdk' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/sdk' = 'file:../sdk/js' }
          if ($pkg.dependencies.'@opencode-ai/util' -eq 'workspace:*') { $pkg.dependencies.'@opencode-ai/util' = 'file:../util' }
          $pkg | ConvertTo-Json -Depth 100 | Set-Content packages/opencode/package.json
          cd packages/opencode
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          bun install --no-save
          cd ../..

      - name: Build Windows x64 binary
        run: |
          cd packages/opencode
          bun run build --single

      - name: Copy binary
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path packages/opencode/dist -Filter opencode.exe -File | Select-Object -First 1
          Copy-Item $binary.FullName opencode.exe

      - name: Upload Windows binary to existing release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: opencode.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
