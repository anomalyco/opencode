name: Update Nix Flake

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update node_modules Output Hash
        run: |
          set -euo pipefail

          FILE="flake.nix"
          DUMMY="sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          export DUMMY

          echo "Setting dummy node_modules outputHash..."
          perl -0pi -e 's/(node_modules = stdenvNoCC\.mkDerivation\s*\{.*?outputHash = ")sha256-[^"]+(";\n)/${1}$ENV{DUMMY}${2}/s' "$FILE"

          if ! grep -q "$DUMMY" "$FILE"; then
            echo "Failed to set dummy hash placeholder"
            exit 1
          fi

          echo "Refreshing models-dev hash..."
          MODELS_URL="https://models.dev/api.json"
          MODELS_HASH=$(nix store prefetch-file "$MODELS_URL" --json | jq -r '.hash // empty')
          if [ -z "$MODELS_HASH" ]; then
            echo "Failed to prefetch models-dev hash"
            exit 1
          fi
          current_models_hash="$(perl -0ne 'print $1 if /models-dev\s*=\s*pkgs\.stdenvNoCC\.mkDerivation\s*\{.*?hash = "(sha256-[^"]+)"/s' "$FILE")"
          if [ "$MODELS_HASH" != "$current_models_hash" ]; then
            export MODELS_HASH
            perl -0pi -e 's/(models-dev\s*=\s*pkgs\.stdenvNoCC\.mkDerivation\s*\{.*?hash = ")sha256-[^"]+(";\n)/${1}$ENV{MODELS_HASH}${2}/s' "$FILE"
            if ! grep -q "$MODELS_HASH" "$FILE"; then
              echo "Failed to update models-dev hash"
              exit 1
            fi
            echo "models-dev hash updated: $MODELS_HASH"
          fi
          if [ "$MODELS_HASH" = "$current_models_hash" ]; then
            echo "models-dev hash already up to date: $MODELS_HASH"
          fi

          SYSTEM="x86_64-linux"
          TARGET="packages.${SYSTEM}.default"

          echo "Building ${TARGET} to discover correct node_modules outputHash..."
          LOG=$(mktemp)
          nix build ".#${TARGET}" --system "$SYSTEM" --no-link -L >"$LOG" 2>&1 || true

          CORRECT_HASH=""
          FALLBACK=""
          while IFS= read -r line; do
            if [[ $line =~ \"actualHash\":\"(sha256-[A-Za-z0-9+/=]+)\" ]]; then
              value="${BASH_REMATCH[1]}"
              if [ "$value" != "$DUMMY" ]; then
                CORRECT_HASH="$value"
                break
              fi
            fi
            if [[ $line =~ got:\s*(sha256-[A-Za-z0-9+/=]+) ]]; then
              value="${BASH_REMATCH[1]}"
              if [ "$value" != "$DUMMY" ]; then
                CORRECT_HASH="$value"
                break
              fi
            fi
            if [[ -z "$FALLBACK" && $line =~ (sha256-[A-Za-z0-9+/=]+) ]]; then
              value="${BASH_REMATCH[1]}"
              if [ "$value" != "$DUMMY" ]; then
                FALLBACK="$value"
              fi
            fi
          done < "$LOG"

          if [ -z "$CORRECT_HASH" ]; then
            CORRECT_HASH="$FALLBACK"
          fi

          if [ -z "$CORRECT_HASH" ]; then
            echo "Failed to extract node_modules hash"
            tail -100 "$LOG"
            rm -f "$LOG"
            exit 1
          fi

          rm -f "$LOG"

          export CORRECT_HASH="$CORRECT_HASH"

          perl -0pi -e 's/(node_modules = stdenvNoCC\.mkDerivation\s*\{.*?outputHash = ")sha256-[^"]+(";\n)/${1}$ENV{CORRECT_HASH}${2}/s' "$FILE"

          if ! grep -q "$CORRECT_HASH" "$FILE"; then
            echo "Failed to update flake with new hash"
            exit 1
          fi

          echo "node_modules hash updated: $CORRECT_HASH"

      - name: Verification Build (x86_64-linux)
        run: |
          echo "Running final verification build for x86_64-linux..."
          nix build .#packages.x86_64-linux.default --system x86_64-linux -L
          echo "x86_64-linux build successful."

      - name: Verification Build (aarch64-linux)
        run: |
          echo "Running final verification build for aarch64-linux..."
          nix build .#packages.aarch64-linux.default --system aarch64-linux -L
          echo "aarch64-linux build successful."

      - name: Commit and Push Changes
        run: |
          set -euo pipefail

          echo "Checking for changes..."
          if git diff --quiet flake.nix; then
            echo "No changes to flake.nix. Hash is already up to date."
            exit 0
          fi

          VERSION=$(jq -r '.version' packages/opencode/package.json)
          git add flake.nix
          git commit -m "nix: update node_modules hash for v$VERSION"

          git pull --rebase origin dev
          git push origin HEAD:dev

      - name: Summary
        run: |
          echo "✓ Nix flake updated and verified"
          echo "  - node_modules hash: Updated"
          echo "  - x86_64-linux: Build successful"
          echo "  - aarch64-linux: Build successful"
