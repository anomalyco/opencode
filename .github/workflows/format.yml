name: format

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  format:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Check formatting
        run: ./script/format.ts --check
        env:
          CI: true
