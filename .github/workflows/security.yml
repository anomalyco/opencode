name: security

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          version=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan changed commits for secrets
        env:
          # Scan only this change's commits, not 13k+ commits of history. A fresh full-history scan
          # surfaces pre-existing findings unrelated to the PR; .gitleaks.toml allowlists test fixtures.
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$RANGE_BASE" ] && git cat-file -e "${RANGE_BASE}^{commit}" 2>/dev/null; then
            gitleaks detect --redact --no-banner --config .gitleaks.toml --log-opts="${RANGE_BASE}..HEAD"
          else
            gitleaks detect --redact --no-banner --config .gitleaks.toml --log-opts="-1 HEAD"
          fi

  sast:
    name: semgrep (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install semgrep
        run: pipx install semgrep
      - name: Run semgrep (report only)
        # Advisory: no --error, so semgrep prints findings but exits 0 and this check stays green.
        # Findings are surfaced for human review and never block a merge (automated security gating
        # showed ~86% false positives). See docs/adr/0001-verification-and-quality-pipeline.
        run: semgrep scan --config p/typescript --config p/javascript --config p/secrets packages script .opencode
