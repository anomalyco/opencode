name: generate

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        if: github.repository == 'anomalyco/opencode'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: generate"
          git push origin HEAD:${{ github.ref_name }} --no-verify

      - name: Check for generated changes
        if: github.repository != 'anomalyco/opencode'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "============================================"
            echo "There are uncommitted generated changes."
            echo "Please run locally and push:"
            echo ""
            echo "  ./script/generate.ts"
            echo "  git add -A && git commit -m \"chore: generate\" && git push"
            echo ""
            echo "============================================"
            exit 1
          fi
