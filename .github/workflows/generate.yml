name: generate

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  generate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Generate
        run: ./script/generate.ts

      - name: Commit and push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add -A
          git commit -m "chore: generate" --allow-empty
          git push origin HEAD:${{ github.ref_name }} --no-verify

      - name: Check for generated changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo ""
            echo "============================================"
            echo "There are uncommitted generated changes."
            echo "Please run locally and push:"
            echo ""
            echo "  ./script/generate.ts"
            echo "  git add -A && git commit -m \"chore: generate\" && git push"
            echo ""
            echo "============================================"
            exit 1
          fi
