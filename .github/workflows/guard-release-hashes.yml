name: Guard Release Hashes

on:
  release:
    types:
      - published
      - prereleased

permissions:
  contents: read
  actions: read

jobs:
  ensure-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Check pending hash workflow
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.event.release.target_commitish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="${TARGET_BRANCH:-}"
          if [ -z "$branch" ]; then
            branch="$DEFAULT_BRANCH"
          fi
          if printf '%s' "$branch" | grep -Eq '^[0-9a-f]{40}$'; then
            branch="$DEFAULT_BRANCH"
          fi
          api="${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/update-nix-hashes.yml/runs?per_page=20&branch=${branch}"
          data=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api")
          if [ -z "$data" ]; then
            echo "Failed to read workflow runs"
            exit 1
          fi
          pending=$(printf '%s' "$data" | jq '[.workflow_runs[] | select(.status != "completed")]')
          count=$(printf '%s' "$pending" | jq 'length')
          if [ "$count" -gt 0 ]; then
            urls=$(printf '%s' "$pending" | jq -r '.[].html_url')
            {
              echo "pending=true"
              echo "branch=$branch"
              echo "urls<<EOF"
              printf '%s\n' "$urls"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Pending hash workflow detected on ${branch}"
            exit 1
          fi
          {
            echo "pending=false"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate dependency coverage
        id: coverage
        run: |
          set -euo pipefail
          if [ ! -f nix/hashes.json ]; then
            echo "nix/hashes.json missing in release commit"
            exit 1
          fi
          source_commit=$(jq -r '.metadata.sourceCommit // empty' nix/hashes.json)
          if [ -z "$source_commit" ]; then
            echo "metadata.sourceCommit missing; rerun nix workflow"
            exit 1
          fi
          if ! git cat-file -e "${source_commit}^{commit}" >/dev/null 2>&1; then
            echo "metadata.sourceCommit ${source_commit} not found in repo history"
            exit 1
          fi
          mapfile -t package_files < <(git ls-files 'packages/*/package.json')
          paths=()
          if git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            paths+=("bun.lock")
          fi
          if git ls-files --error-unmatch package.json >/dev/null 2>&1; then
            paths+=("package.json")
          fi
          if [ "${#package_files[@]}" -gt 0 ]; then
            paths+=("${package_files[@]}")
          fi
          release_commit=$(git rev-parse HEAD)
          diff_out=""
          if [ "${#paths[@]}" -gt 0 ]; then
            diff_out=$(git diff --name-only "${source_commit}..${release_commit}" -- "${paths[@]}" || true)
          fi
          if [ -n "${diff_out:-}" ]; then
            echo "Dependency files changed since last hash update:"
            printf '%s\n' "$diff_out"
            {
              echo "outdated=true"
              echo "diff<<EOF"
              printf '%s\n' "$diff_out"
              echo "EOF"
              echo "source_commit=${source_commit}"
              echo "release_commit=${release_commit}"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "outdated=false"
            echo "source_commit=${source_commit}"
            echo "release_commit=${release_commit}"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize guard status
        if: always()
        run: |
          {
            echo "### Release Hash Guard"
            echo ""
            echo "- tag: ${{ github.event.release.tag_name }}"
            echo "- branch: ${{ steps.pending.outputs.branch }}"
            echo "- pending-hash-run: ${{ steps.pending.outputs.pending }}"
            echo "- dependency-changes: ${{ steps.coverage.outputs.outdated }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.coverage.outputs.outdated }}" = "true" ]; then
            {
              echo "- last-hash-commit: ${{ steps.coverage.outputs.source_commit }}"
              echo "- release-commit: ${{ steps.coverage.outputs.release_commit }}"
              echo ""
              echo "#### Files requiring hash refresh"
              echo ""
              printf '%s\n' "${{ steps.coverage.outputs.diff }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.pending.outputs.pending }}" = "true" ]; then
            {
              echo ""
              echo "#### Pending Runs"
              echo ""
              printf '%s\n' "${{ steps.pending.outputs.urls }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
