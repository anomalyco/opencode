name: publish-mysterycode

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.20)"
        required: true
        type: string
  push:
    tags:
      - "mystery-v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#mystery-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.ver.outputs.tag }}" --title "mysterycode v${{ steps.ver.outputs.version }}" --notes "mysterycode release v${{ steps.ver.outputs.version }}"

      - name: Build CLI binaries and upload assets
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_RELEASE: "1"
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./packages/opencode/script/build.ts

      - name: Publish npm package mysterycode
        env:
          OPENCODE_VERSION: ${{ steps.ver.outputs.version }}
          OPENCODE_CHANNEL: latest
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          bun ./packages/mysterycode/script/publish.ts
