name: Guidelines Check

on:
  pull_request:
    types: [opened, edited]

jobs:
  guidelines-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        if: ${{ !startsWith(github.event.pull_request.title, 'feat:') && !startsWith(github.event.pull_request.title, 'fix:') && !startsWith(github.event.pull_request.title, 'refactor:') && !startsWith(github.event.pull_request.title, 'chore:') && !startsWith(github.event.pull_request.title, 'docs:') }}
        run: |
          echo "::error::PR title must start with 'feat:', 'fix:', 'refactor:', 'chore:', or 'docs:'"
          exit 1
      - name: Check PR body
        if: ${{ github.event.pull_request.body == '' }}
        run: |
          echo "::error::PR body cannot be empty"
          exit 1
      - name: Check PR body for issue link
        if: ${{ !contains(github.event.pull_request.body, 'Resolves #') && !contains(github.event.pull_request.body, 'Fixes #') }}
        run: |
          echo "::error::PR body must contain 'Resolves #' or 'Fixes #'"
          exit 1
      - name: Check PR body for issue link format
        env:
    - name: Check PR title
      if: ${{ github.event_name == 'pull_request' }}
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: |
        if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|revert)\(.*\):.*$ ]]; then
          echo "PR title does not match the conventional commit format."
          exit 1
        fi
    - name: Check PR body
      if: ${{ github.event_name == 'pull_request' }}
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [[ "$PR_BODY" == "" ]]; then
          echo "PR body is empty."
          exit 1
        fi
    - name: Check issue link
      if: ${{ github.event_name == 'pull_request' }}
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        if [[ ! "$PR_BODY" =~ (close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)s?[\s]+#\d+ ]]; then
          echo "PR body does not contain a closing issue link."
          exit 1
        fi
    - name: Check branch name
      if: ${{ github.event_name == 'pull_request' }}
      env:
        BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      run: |
        if [[ ! "$BRANCH_NAME" =~ ^(feat|fix|docs|style|refactor|perf|test|chore|revert)\/.*$ ]]; then
          echo "Branch name does not match the required format."
          exit 1
        fi
