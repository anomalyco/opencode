name: CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "assets/**"
      - "docs/**"
      - ".github/*.md"

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.11"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.next_version.outputs.tag }}
      semver: ${{ steps.next_version.outputs.semver }}
      skip: ${{ steps.next_version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get latest CoBuilder tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-v:refname | grep -E '^cb-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          echo "tag=${TAG:-cb-v0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Determine next version and generate release notes
        id: next_version
        run: |
          TAG="${{ steps.latest_tag.outputs.tag }}"
          VERSION="${TAG#cb-v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            COMMITS=$(git log "${TAG}..HEAD" --pretty=format:"%s|||%H")
          else
            COMMITS=$(git log --pretty=format:"%s|||%H")
          fi

          SUBJECTS=$(echo "$COMMITS" | cut -d'|' -f1)

          # Skip release if no feat/fix/breaking commits since last tag
          if ! echo "$SUBJECTS" | grep -qE '^(feat|fix)(\(.+\))?!?:|^.+(\(.+\))?!:|^BREAKING CHANGE'; then
            echo "No releasable commits — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Determine version bump
          if echo "$SUBJECTS" | grep -qE '^.+(\(.+\))?!:|^BREAKING CHANGE'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$SUBJECTS" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEXT_TAG="cb-v${MAJOR}.${MINOR}.${PATCH}"
          NEXT_DISPLAY="v${MAJOR}.${MINOR}.${PATCH}"
          RELEASE_DATE=$(date -u +"%Y-%m-%d")

          echo "tag=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "display=${NEXT_DISPLAY}" >> "$GITHUB_OUTPUT"
          echo "semver=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${TAG}" >> "$GITHUB_OUTPUT"

          strip_prefix() {
            echo "$1" | sed -E 's/^(feat|fix|chore|ci|docs|refactor|perf|test|style|build|revert)(\([^)]+\))?!?:[[:space:]]*//' | sed 's/\(.\)/\u\1/'
          }

          BREAKING=""
          ADDED=""
          FIXED=""
          CHANGED=""
          SECURITY=""

          while IFS='|||' read -r subject hash; do
            [[ -z "$subject" ]] && continue
            CLEAN=$(strip_prefix "$subject")
            if echo "$subject" | grep -qE '^.+(\(.+\))?!:|^BREAKING CHANGE'; then
              BREAKING="${BREAKING}"$'\n'"- ${CLEAN}"
            elif echo "$subject" | grep -qE '^feat(\(.+\))?:'; then
              ADDED="${ADDED}"$'\n'"- ${CLEAN}"
            elif echo "$subject" | grep -qE '^fix(\(.+\))?:'; then
              FIXED="${FIXED}"$'\n'"- ${CLEAN}"
            elif echo "$subject" | grep -qE '^(perf|refactor)(\(.+\))?:'; then
              CHANGED="${CHANGED}"$'\n'"- ${CLEAN}"
            elif echo "$subject" | grep -qE '^(security|sec)(\(.+\))?:'; then
              SECURITY="${SECURITY}"$'\n'"- ${CLEAN}"
            fi
          done <<< "$COMMITS"

          NOTES="## CoBuilder ${NEXT_DISPLAY} — ${RELEASE_DATE}"$'\n'
          [[ -n "$BREAKING" ]] && NOTES+=$'\n'"### ⚠️ Breaking Changes"$'\n'"${BREAKING}"$'\n'
          [[ -n "$SECURITY" ]] && NOTES+=$'\n'"### 🔒 Security"$'\n'"${SECURITY}"$'\n'
          [[ -n "$ADDED" ]]    && NOTES+=$'\n'"### Added"$'\n'"${ADDED}"$'\n'
          [[ -n "$FIXED" ]]    && NOTES+=$'\n'"### Fixed"$'\n'"${FIXED}"$'\n'
          [[ -n "$CHANGED" ]]  && NOTES+=$'\n'"### Changed"$'\n'"${CHANGED}"$'\n'
          NOTES+=$'\n'"**Full Changelog**: https://github.com/CobuilderLabs/opencode/compare/${TAG}...${NEXT_TAG}"

          echo "$NOTES" > /tmp/release-notes.md
          cat /tmp/release-notes.md
          echo "Next release: ${NEXT_TAG}"

      - name: Update package version
        if: steps.next_version.outputs.skip != 'true'
        run: |
          cd packages/opencode
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.next_version.outputs.semver }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Create GitHub release (draft)
        if: steps.next_version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.next_version.outputs.tag }}" --repo CobuilderLabs/opencode > /dev/null 2>&1; then
            echo "Release ${{ steps.next_version.outputs.tag }} already exists — updating notes and ensuring draft state"
            gh release edit "${{ steps.next_version.outputs.tag }}" \
              --notes-file /tmp/release-notes.md \
              --draft \
              --repo CobuilderLabs/opencode
          else
            gh release create "${{ steps.next_version.outputs.tag }}" \
              --title "CoBuilder ${{ steps.next_version.outputs.display }}" \
              --notes-file /tmp/release-notes.md \
              --draft
          fi

      - name: Build and upload binaries
        if: steps.next_version.outputs.skip != 'true'
        env:
          OPENCODE_RELEASE: "1"
          OPENCODE_VERSION: ${{ steps.next_version.outputs.semver }}
          OPENCODE_CHANNEL: latest
          COBUILDER_RELEASE_TAG: ${{ steps.next_version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: CobuilderLabs/opencode
        run: |
          cd packages/opencode
          bun run build

      - name: Publish release
        if: steps.next_version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.next_version.outputs.tag }}" \
            --draft=false \
            --latest \
            --repo CobuilderLabs/opencode

  desktop-linux:
    name: Desktop (Linux)
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            packages/*/node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set desktop version
        run: |
          cd packages/desktop-electron
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.release.outputs.semver }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Build
        run: cd packages/desktop-electron && bun run build
        env:
          OPENCODE_CHANNEL: prod

      - name: Package
        run: cd packages/desktop-electron && bun run package:linux -- --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            packages/desktop-electron/dist/*.AppImage \
            packages/desktop-electron/dist/*.deb \
            packages/desktop-electron/dist/*.rpm \
            --repo CobuilderLabs/opencode --clobber

  desktop-windows:
    name: Desktop (Windows)
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\bun\install\cache
            node_modules
            packages\*\node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set desktop version
        run: |
          cd packages/desktop-electron
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.release.outputs.semver }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      # npm cannot handle Bun's catalog: protocol. We resolve catalog: entries
      # from the root package.json before running npm install + npx electron-vite.
      # bun run / bun x cannot be used here — Bun resolves electron-vite from an
      # isolated .bun cache path that lacks peer deps (picocolors, vite) on Windows.
      - name: Resolve catalog: deps and install with npm (Windows)
        shell: pwsh
        run: |
          $catalog = (Get-Content package.json | ConvertFrom-Json).catalog
          $pkg = Get-Content packages/desktop-electron/package.json | ConvertFrom-Json
          foreach ($section in @("dependencies","devDependencies")) {
            $deps = $pkg.$section
            if (-not $deps) { continue }
            $deps.PSObject.Properties | ForEach-Object {
              if ($_.Value -eq "catalog:") {
                $resolved = $catalog.($_.Name)
                if ($resolved) { $deps.($_.Name) = $resolved }
              }
            }
          }
          $pkg | ConvertTo-Json -Depth 10 | Set-Content packages/desktop-electron/package.json
          cd packages/desktop-electron
          npm install --legacy-peer-deps

      - name: Build
        run: cd packages/desktop-electron && npx electron-vite build
        env:
          OPENCODE_CHANNEL: prod

      - name: Package
        run: cd packages/desktop-electron && bun run package:win -- --publish never
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            packages/desktop-electron/dist/*.exe \
            --repo CobuilderLabs/opencode --clobber
