name: Deploy demo to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    env:
      NEXT_PUBLIC_BASE_PATH: /securecode/demo
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static export)
        run: bun run build

      # basePath /securecode/demo に対応させるため、out/ を _site/demo/ に
      # ネストしてから upload する。Pages の repo root (/securecode/) に
      # 配信されるアーティファクトの中で、HTML が /demo/ サブディレクトリに
      # 来るようにすることで、build 時のリンクと配信パスを一致させる。
      - name: Stage artifact under /demo subdirectory
        run: |
          mkdir -p _site/demo
          cp -a out/. _site/demo/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
