name: Deploy demo to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - demo/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    # カスタムドメイン securecode.acompany.tech を Pages に紐付けて root
    # 配信する。basePath は空 (= "/") のままビルドする。
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static export, root path)
        # GTM container ID は repo Variables の DEMO_GTM_ID から差し込む。
        # 未設定なら GTM タグは layout.tsx 側で no-op になり、本番でも
        # アクセス計測が走らない安全側のデフォルト。
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.DEMO_GTM_ID }}
          # waitlist フォームの送信先 (Cloud Run)。repo Variables の
          # DEMO_WAITLIST_ENDPOINT から差し込む。未設定ならフォームは送信時に
          # エラー表示になる安全側のデフォルト。
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ vars.DEMO_WAITLIST_ENDPOINT }}
        run: bun run build

      # out/ をそのまま Pages の DocumentRoot として置く。
      # カスタムドメインを使うため CNAME ファイルを root に置いて
      # Pages に行き先を教える。`.nojekyll` で Jekyll 処理を抑止する
      # (out/_next/ などのアンダースコア始まりディレクトリが除外
      # されないようにする)。
      - name: Stage artifact for Pages
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a out/. _site/
          echo "securecode.acompany.tech" > _site/CNAME
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
