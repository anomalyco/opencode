name: Delegation — create Windows release workflow (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create_windows_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch and write windows-release workflow via API
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'ci/windows-release-workflow';

            // get default branch sha
            const baseRef = await github.repos.get({ owner, repo });
            const defaultBranch = baseRef.data.default_branch;
            const ref = await github.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
            const sha = ref.data.object.sha;

            // create branch ref (ignore if exists)
            try {
              await github.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha
              });
              core = 'created';
            } catch (e) {
              if (e.status === 422) {
                // ref already exists
                // console.log('Branch exists, continuing.');
              } else {
                throw e;
              }
            }

            // windows-release workflow content (as a literal string)
            const content = `name: Build Windows NSIS installer (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and installer name
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          if (-not $version) { $version = "0.0.0" }
          $installer = "oc-custom-setup-x64-$version.exe"
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "installer_name=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure Bun is installed (bash)
        shell: bash
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
          fi
          bun --version || true

      - name: Install dependencies and build (bun)
        shell: bash
        run: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          bun install
          bun build

      - name: Prepare installer files (bash)
        shell: bash
        run: |
          OUTPUT_DIR="dist"
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Warning: $OUTPUT_DIR does not exist. Listing repo:" && ls -la
          fi
          rm -rf installer_files || true
          mkdir -p installer_files
          if [ -d "$OUTPUT_DIR" ]; then
            cp -r $OUTPUT_DIR/* installer_files/ || true
          fi
          if command -v bun >/dev/null 2>&1; then
            BUN_BIN=$(command -v bun)
            mkdir -p installer_files/bin
            cp "$BUN_BIN" installer_files/bin/ || true
          fi

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Create NSIS script
        shell: pwsh
        run: |
          $version = "\\${{ steps.get_version.outputs.version }}"
          $app = "oc-custom"
          $installerName = "\\${{ steps.get_version.outputs.installer_name }}"
          $nsi = @"
Name "$app Installer"
OutFile "$installerName"
InstallDir "$PROGRAMFILES64\\$app"
Page directory
Page instfiles
Section "Install"
  SetOutPath "$INSTDIR"
  File /r "installer_files\\*"
  CreateShortCut "$SMPROGRAMS\\$app.lnk" "$INSTDIR\\$app.exe"
SectionEnd
"@
          $nsi | Out-File -FilePath installer.nsi -Encoding utf8

      - name: Build installer with makensis
        shell: pwsh
        run: |
          $installerName = "\\${{ steps.get_version.outputs.installer_name }}"
          & "C:\\Program Files (x86)\\NSIS\\makensis.exe" installer.nsi
          if (-not (Test-Path $installerName)) { Write-Error "Installer not created: $installerName" }

      - name: List generated files
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Force | Where-Object { $_.Length -gt 0 } | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create GitHub Release and upload installer
        uses: ncipollo/release-action@v1
        with:
          tag: v\\${{ steps.get_version.outputs.version }}
          files: \\${{ steps.get_version.outputs.installer_name }}
        env:
          GITHUB_TOKEN: \\${{ secrets.PAT_FOR_SYNC }}
`;

            // create or update file on the new branch
            const path = '.github/workflows/windows-release.yml';
            const encoded = Buffer.from(content, 'utf8').toString('base64');

            try {
              // try to get the file on the branch to see if exists
              await github.repos.getContent({
                owner,
                repo,
                path,
                ref: branch
              });

              // if exists, update
              const current = await github.repos.getContent({ owner, repo, path, ref: branch });
              const sha = current.data.sha;
              await github.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message: 'ci: add windows release workflow (NSIS)',
                content: encoded,
                branch,
                sha
              });
            } catch (err) {
              // if not found, create
              if (err.status === 404) {
                await github.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  message: 'ci: add windows release workflow (NSIS)',
                  content: encoded,
                  branch
                });
              } else {
                throw err;
              }
            }

            // create PR from branch -> omo-custom (ignore if PR already exists)
            const prs = await github.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base: 'omo-custom',
              state: 'open'
            });

            if (prs.data.length === 0) {
              await github.pulls.create({
                owner,
                repo,
                title: 'Add Windows NSIS installer workflow',
                head: branch,
                base: 'omo-custom',
                body: 'This PR was created by the delegation workflow. It adds a manual workflow to build a Windows NSIS installer and publish it as a Release asset.'
              });
            } else {
              // PR already exists
            }
      - name: Done
        run: echo "Branch and PR created (or already existed)."
