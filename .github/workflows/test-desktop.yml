name: Test Desktop Build

on:
  push:
    branches:
      - feature/zflow
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Enable Git long paths on Windows
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      # Disable symbolic links on Windows
      - name: Disable Git symbolic links
        run: git config --global core.symlinks false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Bun installation
        run: |
          echo "Bun version:"
          bun --version

      - name: Install frontend dependencies
        run: |
          cd packages/desktop
          echo "Current directory: $(pwd)"
          echo "Installing dependencies..."
          bun install

      - name: Build frontend
        run: |
          cd packages/desktop
          echo "Current directory: $(pwd)"
          echo "Building frontend..."
          bun run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI via Cargo
        run: |
          echo "Installing Tauri CLI..."
          cargo install tauri-cli --version "^2.0.0"
          echo "Tauri CLI version:"
          cargo tauri --version

      - name: Build Tauri app (using Cargo)
        id: build-tauri
        continue-on-error: true
        run: |
          cd packages/desktop
          echo "Starting Tauri build..."
          cargo tauri build --debug --config ./src-tauri/tauri.prod.conf.json || true
        env:
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Check build result
        run: |
          echo "Build exit code: ${{ steps.build-tauri.outcome }}"

      - name: Check build output
        run: |
          echo "Checking for build output..."
          if [ -d "packages/desktop/src-tauri/target/debug" ]; then
            echo "✅ Debug target directory exists"
            ls -la packages/desktop/src-tauri/target/debug/
          else
            echo "❌ Debug target directory NOT found"
            exit 1
          fi

          if [ -d "packages/desktop/src-tauri/target/debug/bundle" ]; then
            echo "✅ Bundle directory exists!"
            echo "Bundle contents:"
            find packages/desktop/src-tauri/target/debug/bundle -type f -name "*.exe" -o -name "*.msi"
          else
            echo "❌ Bundle directory NOT found"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: |
            packages/desktop/src-tauri/target/debug/bundle/**/*
            packages/desktop/src-tauri/target/debug/*.exe
          if-no-files-found: warn

      - name: Upload build summary
        if: always()
        run: |
          echo "=== BUILD SUMMARY ==="
          echo "Build Status: ${{ steps.build-tauri.outcome }}"
          echo ""
          echo "Generated files:"
          find packages/desktop/src-tauri/target/debug/bundle -name "*.exe" 2>/dev/null || echo "No exe files found"
          echo ""
          echo "The installer should be available in the artifacts!"
