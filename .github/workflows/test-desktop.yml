name: Test Desktop Build

on:
  push:
    branches:
      - feature/zflow
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      # Enable Git long paths on Windows
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify Bun installation
        run: |
          echo "Bun version:"
          bun --version

      - name: Install frontend dependencies
        working-directory: packages/desktop
        run: bun install

      - name: Build frontend
        working-directory: packages/desktop
        run: |
          echo "Building frontend..."
          bun run build
          echo "Build output:"
          Get-ChildItem dist/ -Recurse | Select-Object FullName

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI via Cargo
        run: |
          echo "Installing Tauri CLI..."
          cargo install tauri-cli --version "^2.0.0"
          echo "Tauri CLI version:"
          cargo tauri --version

      - name: Build Tauri app (using Cargo)
        working-directory: packages/desktop
        run: |
          echo "Starting Tauri build..."
          cargo tauri build --debug --verbose
        env:
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Check build output
        working-directory: packages/desktop
        run: |
          echo "Checking for build output..."
          if (Test-Path "src-tauri/target/debug") {
            echo "Debug target directory exists"
            Get-ChildItem src-tauri/target/debug/ -File
          } else {
            echo "Debug target directory NOT found"
          }

          if (Test-Path "src-tauri/target/debug/bundle") {
            echo "Bundle directory exists!"
            Get-ChildItem src-tauri/target/debug/bundle/ -Recurse -File
          } else {
            echo "Bundle directory NOT found"
            echo "Target directory structure:"
            Get-ChildItem src-tauri/target/ -Recurse -Directory | Select-Object -First 20
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: packages/desktop/src-tauri/target/debug/bundle/*/*
          if-no-files-found: warn
