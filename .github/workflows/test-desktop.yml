name: Test Desktop Build

on:
  push:
    branches:
      - feature/zflow
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      # Enable Git long paths on Windows
      - name: Enable Git long paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: |
          cd packages/desktop
          bun install

      - name: Build frontend
        run: |
          cd packages/desktop
          bun run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Tauri (debug)
        run: |
          cd packages/desktop
          bun run tauri build --debug --verbose
        env:
          TAURI_PRIVATE_KEY: ''
          TAURI_KEY_PASSWORD: ''

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test
          path: packages/desktop/src-tauri/target/debug/bundle/*/*
          if-no-files-found: warn
