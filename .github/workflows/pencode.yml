name: pencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  pencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /pencode') ||
      startsWith(github.event.comment.body, '/pencode')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run pencode
        uses: kiyosh11/pencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          PENCODE_API_KEY: ${{ secrets.PENCODE_API_KEY }}
          PENCODE_PERMISSION: '{"bash": "deny"}'
        with:
          model: pencode/claude-opus-4-5
