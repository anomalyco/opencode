name: Upstream Sync Threshold

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream branch/ref to sync from"
        required: false
        default: "dev"
        type: string
      min_commits:
        description: "Minimum upstream commits required before running sync"
        required: false
        default: "150"
        type: string
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: upstream-sync-threshold
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-sync-threshold:
    name: Threshold-based upstream sync
    runs-on: ubuntu-latest

    env:
      HUSKY: "0"
      UPSTREAM_REPO: https://github.com/sst/opencode.git
      UPSTREAM_REF: ${{ github.event.inputs.upstream_ref || 'dev' }}
      TARGET_BRANCH: dev
      MIN_COMMITS: ${{ github.event.inputs.min_commits || '150' }}
      SYNC_BRANCH: sync/upstream-threshold

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Add upstream remote
        run: |
          git remote add upstream "$UPSTREAM_REPO" || git remote set-url upstream "$UPSTREAM_REPO"
          git fetch origin "$TARGET_BRANCH"
          git fetch upstream "$UPSTREAM_REF"

      - name: Check upstream threshold
        id: threshold
        run: |
          behind_count="$(git rev-list --count "origin/${TARGET_BRANCH}..upstream/${UPSTREAM_REF}")"
          upstream_sha="$(git rev-parse --short "upstream/${UPSTREAM_REF}")"

          echo "behind_count=$behind_count" >> "$GITHUB_OUTPUT"
          echo "minimum_commits=$MIN_COMMITS" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          if [ "$behind_count" -ge "$MIN_COMMITS" ]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Upstream is $behind_count commits ahead. Sync threshold met."
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is $behind_count commits ahead. Sync threshold not met."
          fi

          {
            echo "## Upstream Sync Threshold Check"
            echo
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- Upstream ref: \`$UPSTREAM_REF\` (\`$upstream_sha\`)"
            echo "- Commits behind upstream: \`$behind_count\`"
            echo "- Minimum threshold: \`$MIN_COMMITS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when threshold is not met
        if: steps.threshold.outputs.should_sync != 'true'
        run: |
          echo "Skipping upstream sync because threshold was not met."

      - name: Create sync branch
        if: steps.threshold.outputs.should_sync == 'true'
        run: |
          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"

      - name: Merge upstream
        id: merge
        if: steps.threshold.outputs.should_sync == 'true'
        run: |
          set +e
          git merge --no-ff --no-edit "upstream/${UPSTREAM_REF}"
          merge_status=$?
          set -e

          if [ "$merge_status" -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "Upstream merge completed without conflicts."
            exit 0
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            conflicted_files="$(git diff --name-only --diff-filter=U || true)"
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "conflicted_files<<EOF"
              echo "$conflicted_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "Merge conflicts detected:"
            echo "$conflicted_files"
            exit 0
          fi

          echo "result=failed" >> "$GITHUB_OUTPUT"
          echo "Merge failed for a reason other than conflicts."
          exit "$merge_status"

      - name: Attempt automated conflict resolution
        id: resolution
        if: steps.threshold.outputs.should_sync == 'true' && steps.merge.outputs.result == 'conflict'
        continue-on-error: true
        run: .github/scripts/resolve-conflicts.sh

      - name: Attempt guarded resolution for escalated conflicts
        id: guarded_resolution
        if: always() && steps.threshold.outputs.should_sync == 'true' && steps.merge.outputs.result == 'conflict' && steps.resolution.outputs.can_complete_merge != 'true'
        run: |
          summary="/tmp/resolution-summary.md"
          touch "$summary"

          {
            echo
            echo "## Guarded Second-Pass Resolution"
            echo
            echo "The first resolver escalated one or more files. This step attempts to safely resolve those remaining files only when the conflict matches a high-confidence protected-code pattern."
            echo
            echo "The guarded resolver will not force speculative merges. If confidence is low, the file remains escalated for manual review."
          } >> "$summary"

          python3 <<'PY'
import pathlib
import subprocess

summary = pathlib.Path("/tmp/resolution-summary.md")


def run(cmd, check=False):
    return subprocess.run(cmd, text=True, capture_output=True, check=check)


unmerged = run(["git", "diff", "--name-only", "--diff-filter=U"]).stdout.splitlines()

anr_protected_keywords = [
    "anr",
    "opencode_flavor",
    "opencode_anr",
    "loadanrconfig",
    "opencode_anr_env_file",
    "reconstructtelemetrycontextfromenv",
    "initializeotel",
]

risk_keywords = [
    "auth",
    "federation",
    "credential",
    "token",
    "login",
    "telemetry",
    "otel",
    "audit",
    "logger",
    "src/cli",
    "tui",
    "worker",
    "release",
    "workflow",
    "desktop",
    "tauri",
    "electron",
    "infra",
    "backend",
    "aws",
    "sst",
]


def has_any(text, keywords):
    low = text.lower()
    return any(k in low for k in keywords)


def split_conflict_file(text):
    lines = text.splitlines()
    output = []
    hunks = []
    i = 0

    while i < len(lines):
        line = lines[i]

        if not line.startswith("<<<<<<<"):
            output.append(line)
            i += 1
            continue

        marker_start = line
        i += 1
        ours = []

        while i < len(lines) and not lines[i].startswith("======="):
            ours.append(lines[i])
            i += 1

        if i >= len(lines):
            return None, []

        marker_sep = lines[i]
        i += 1
        theirs = []

        while i < len(lines) and not lines[i].startswith(">>>>>>>"):
            theirs.append(lines[i])
            i += 1

        if i >= len(lines):
            return None, []

        marker_end = lines[i]
        i += 1

        hunks.append({
            "start": marker_start,
            "sep": marker_sep,
            "end": marker_end,
            "ours": ours,
            "theirs": theirs,
        })

        output.append({"__CONFLICT_HUNK__": len(hunks) - 1})

    return output, hunks


def build_text(template, decisions):
    final = []

    for item in template:
        if isinstance(item, dict) and "__CONFLICT_HUNK__" in item:
            idx = item["__CONFLICT_HUNK__"]
            final.extend(decisions[idx])
        else:
            final.append(item)

    return "\n".join(final) + "\n"


def preview_hunk(hunk, max_lines=80):
    lines = []
    lines.append(hunk["start"])
    lines.extend(hunk["ours"])
    lines.append(hunk["sep"])
    lines.extend(hunk["theirs"])
    lines.append(hunk["end"])

    if len(lines) > max_lines:
        return "\n".join(lines[:max_lines]) + "\n...truncated..."

    return "\n".join(lines)


resolved_files = []
still_manual = []

with summary.open("a", encoding="utf-8") as out:
    for file_name in unmerged:
        path = pathlib.Path(file_name)

        if not path.exists():
            still_manual.append(file_name)
            out.write(f"\n### File requiring review: `{file_name}`\n\n")
            out.write("The file was listed as conflicted but was not available for analysis.\n")
            continue

        text = path.read_text(errors="replace")
        template, hunks = split_conflict_file(text)

        if template is None or not hunks:
            still_manual.append(file_name)
            out.write(f"\n### File requiring review: `{file_name}`\n\n")
            out.write("The guarded resolver could not parse the conflict markers safely.\n")
            continue

        file_context = f"{file_name}\n{text}"
        detected_risk = has_any(file_context, risk_keywords)

        decisions = []
        explanations = []
        can_resolve_file = True

        for hunk in hunks:
            ours = "\n".join(hunk["ours"])
            theirs = "\n".join(hunk["theirs"])

            ours_has_anr = has_any(ours, anr_protected_keywords)
            theirs_has_anr = has_any(theirs, anr_protected_keywords)

            if ours_has_anr and not theirs_has_anr:
                decisions.append(hunk["ours"])
                explanations.append("Kept ours for one conflict hunk because ANR-protected logic appeared only on our side.")
            else:
                can_resolve_file = False
                decisions.append(None)
                explanations.append("Could not safely resolve one conflict hunk automatically.")

        out.write(f"\n### File analyzed by guarded resolver: `{file_name}`\n\n")
        out.write("**Plain-English summary:**\n\n")
        out.write("This file still had unresolved merge markers after the first deterministic resolver ran. ")
        out.write("The guarded resolver checked whether the conflict could be resolved safely by preserving ANR-protected code.\n\n")

        out.write("**Detected risk:** ")
        out.write("Yes\n\n" if detected_risk else "No obvious high-risk path/content keyword detected\n\n")

        out.write("**Guarded recommendation:**\n\n")

        if can_resolve_file:
            new_text = build_text(template, decisions)
            path.write_text(new_text, encoding="utf-8")
            run(["git", "add", file_name], check=True)
            resolved_files.append(file_name)

            out.write("The resolver automatically kept our side for all remaining conflict hunks because ANR-protected logic appeared only on our side. ")
            out.write("This preserves ANR-specific behavior while still allowing validation to determine whether the sync is safe.\n\n")

            out.write("**Action taken:** Guarded auto-resolution applied and staged.\n\n")
        else:
            still_manual.append(file_name)

            out.write("Manual review is still required. The conflict did not match a high-confidence pattern that should be auto-applied.\n\n")

            out.write("**Available options:**\n\n")
            out.write("1. **Keep ours** — safest when upstream would overwrite ANR-specific behavior.\n")
            out.write("2. **Take upstream** — only safe when upstream clearly does not remove ANR customizations.\n")
            out.write("3. **Manual merge** — best when both ANR and upstream changes matter.\n")
            out.write("4. **Add a reusable rule** — only after confirming this same pattern is safe in future syncs.\n\n")

            out.write("**Recommended resolution:**\n\n")
            out.write("Use manual merge. Preserve ANR-specific behavior first, then bring in compatible upstream changes. ")
            out.write("Only convert this to a reusable rule after the same pattern is confirmed safe.\n\n")

        out.write("<details>\n")
        out.write("<summary>Conflict preview</summary>\n\n")
        out.write("```diff\n")
        out.write(preview_hunk(hunks[0]))
        out.write("\n```\n\n")
        out.write("</details>\n")

with open("/tmp/guarded-resolved-files.txt", "w", encoding="utf-8") as f:
    f.write("\n".join(resolved_files))

with open("/tmp/guarded-manual-files.txt", "w", encoding="utf-8") as f:
    f.write("\n".join(still_manual))
PY

          remaining_conflicts="$(git diff --name-only --diff-filter=U || true)"
          resolved_files="$(cat /tmp/guarded-resolved-files.txt 2>/dev/null || true)"

          {
            echo
            echo "### Guarded resolver result"
            echo
            if [ -n "$resolved_files" ]; then
              echo "Guarded auto-resolved files:"
              echo "$resolved_files" | sed 's/^/- /'
              echo
            else
              echo "Guarded auto-resolved files: none"
              echo
            fi

            if [ -n "$remaining_conflicts" ]; then
              echo "Files still requiring manual review:"
              echo "$remaining_conflicts" | sed 's/^/- /'
            else
              echo "No unresolved conflict files remain after guarded resolution."
            fi
          } >> "$summary"

          if [ -n "$remaining_conflicts" ]; then
            echo "can_complete_merge=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_complete_merge=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish conflict resolution summary
        if: always() && steps.threshold.outputs.should_sync == 'true' && steps.merge.outputs.result == 'conflict'
        run: |
          if [ -f /tmp/resolution-summary.md ]; then
            cat /tmp/resolution-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No conflict resolution summary was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload conflict resolution artifacts
        if: always() && steps.threshold.outputs.should_sync == 'true' && steps.merge.outputs.result == 'conflict'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-conflict-resolution
          path: |
            /tmp/resolution-summary.md
            /tmp/guarded-resolved-files.txt
            /tmp/guarded-manual-files.txt
            .github/conflict-rules.conf
            .github/conflict-escalations.log
          if-no-files-found: ignore

      - name: Handle conflicts requiring manual review
        if: always() && steps.threshold.outputs.should_sync == 'true' && steps.merge.outputs.result == 'conflict' && steps.resolution.outputs.can_complete_merge != 'true' && steps.guarded_resolution.outputs.can_complete_merge != 'true'
        run: |
          echo "::warning::Automated conflict resolution escalated one or more files for manual review."
          echo "Review the workflow summary and uploaded conflict resolution artifacts."

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow run failed because conflicts require review."
            exit 1
          fi

          echo "Scheduled workflow run completed with manual review required. Not failing scheduled run to avoid repeated failure notifications."
          exit 0

      - name: Commit automated resolution
        if: steps.threshold.outputs.should_sync == 'true' && steps.merge.outputs.result == 'conflict' && (steps.resolution.outputs.can_complete_merge == 'true' || steps.guarded_resolution.outputs.can_complete_merge == 'true')
        run: |
          if git diff --cached --quiet; then
            echo "No staged automated conflict resolutions to commit."
          else
            git commit -m "chore(sync): automated conflict resolution"
          fi

      - name: Check sync changes
        id: sync_changes
        if: steps.threshold.outputs.should_sync == 'true' && (steps.merge.outputs.result == 'success' || steps.resolution.outputs.can_complete_merge == 'true' || steps.guarded_resolution.outputs.can_complete_merge == 'true')
        run: |
          if git diff --quiet "origin/${TARGET_BRANCH}..HEAD"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No sync changes detected after merge."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Sync changes detected."
          fi

      - name: Check for unresolved conflict markers
        if: steps.threshold.outputs.should_sync == 'true' && steps.sync_changes.outputs.has_changes == 'true'
        run: |
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unmerged files still exist:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!bun.lock'; then
            echo "Conflict markers remain in the repository."
            exit 1
          fi

          echo "No unresolved merge files or conflict markers detected."

      - name: Setup Bun
        if: steps.threshold.outputs.should_sync == 'true' && steps.sync_changes.outputs.has_changes == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        if: steps.threshold.outputs.should_sync == 'true' && steps.sync_changes.outputs.has_changes == 'true'
        run: bun install --frozen-lockfile

      - name: Run typecheck after sync
        if: steps.threshold.outputs.should_sync == 'true' && steps.sync_changes.outputs.has_changes == 'true'
        run: bun --cwd packages/opencode typecheck

      - name: Push sync branch
        if: steps.threshold.outputs.should_sync == 'true' && steps.sync_changes.outputs.has_changes == 'true'
        run: |
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Create or update upstream sync PR
        if: steps.threshold.outputs.should_sync == 'true' && steps.sync_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
        run: |
          existing_pr="$(gh pr list \
            --head "$SYNC_BRANCH" \
            --base "$TARGET_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          pr_title="chore(sync): upstream sync after threshold met"

          pr_body="$(cat <<EOF
          ## Upstream sync

          This PR was created by the threshold-based upstream sync workflow.

          - Upstream ref: \`$UPSTREAM_REF\`
          - Upstream SHA: \`${{ steps.threshold.outputs.upstream_sha }}\`
          - Target branch: \`$TARGET_BRANCH\`
          - Commits behind upstream: \`${{ steps.threshold.outputs.behind_count }}\`
          - Minimum threshold: \`${{ steps.threshold.outputs.minimum_commits }}\`

          ## Automation performed

          The workflow attempted to merge upstream changes into \`${TARGET_BRANCH}\`.

          If conflicts were detected, the deterministic conflict resolver ran first.

          If files were still escalated, the guarded second-pass resolver attempted to safely resolve high-confidence ANR-protected conflicts.

          Validation completed before this PR was created or updated.

          ## Validation

          - Conflict marker check
          - Dependency install: \`bun install --frozen-lockfile\`
          - Typecheck: \`bun --cwd packages/opencode typecheck\`

          ## Notes

          This workflow does not auto-merge upstream changes. Review and merge this PR through the normal approval process.
          EOF
          )"

          if [ -n "$existing_pr" ]; then
            echo "Updating existing PR #$existing_pr"
            gh pr edit "$existing_pr" \
              --title "$pr_title" \
              --body "$pr_body"
          else
            echo "Creating new upstream sync PR"
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$pr_title" \
              --body "$pr_body"
          fi