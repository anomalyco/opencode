name: compile linux-amd64 cli
on:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - id: version
        run: |
          ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_CHANNEL: canary
    outputs:
      version: ${{ steps.version.outputs.version }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-bun

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Build Linux amd64 CLI
        run: |
          ./packages/opencode/script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}
          OPENCODE_RELEASE: false
          OPENCODE_CHANNEL: canary
          OPENCODE_MODELS_URL: https://models.dev

      - name: Verify Binary
        run: |
          ls -lh packages/opencode/dist/opencode-linux-x64/bin/opencode
          packages/opencode/dist/opencode-linux-x64/bin/opencode --version

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-linux-amd64
          path: packages/opencode/dist/opencode-linux-x64/bin/opencode
