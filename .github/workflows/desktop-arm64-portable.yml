name: desktop-arm64-portable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install deps
        run: bun install

      - name: Build portable
        working-directory: packages/desktop
        run: |
          $env:RUST_TARGET = "aarch64-pc-windows-msvc"
          bun ./scripts/prepare.ts
          bun install
          bun run build
          npx electron-builder --win --arm64 --publish never --config electron-builder.config.ts

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: opencode-portable
          path: packages/desktop/dist/*portable*.exe