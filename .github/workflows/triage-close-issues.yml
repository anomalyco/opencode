name: triage-close-issues

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Log matching issues without closing them"
        type: boolean
        default: true

concurrency:
  group: triage-close-issues
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Close stale waiting-for-info issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs['dry-run'] }}" != "false" ]; then
            args+=("--dry-run")
          fi
          bun script/github/close-issues.ts "${args[@]}"
