name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  build-desktop:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install

      - name: Ensure native directory exists
        run: mkdir -p packages/desktop-electron/native
        shell: bash

      - name: Prepare desktop-electron
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: dev

      - name: Build desktop-electron
        run: bun run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: dev

      - name: Package with electron-builder (NSIS installer)
        run: npx electron-builder --win --config electron-builder.config.ts --publish never
        working-directory: packages/desktop-electron
        timeout-minutes: 30
        env:
          OPENCODE_CHANNEL: dev

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-win-x64-installer
          path: |
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.yml
