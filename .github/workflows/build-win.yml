name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install

      - name: 构建 Electron 主进程
        run: |
          cd packages/desktop-electron
          bun run build
        env:
          NODE_ENV: production

      - name: 查看构建产物（调试）
        run: |
          ls packages/desktop-electron/out/
          ls packages/desktop-electron/dist/
        continue-on-error: true

      - name: 打包成 EXE
        run: |
          cd packages/desktop-electron
          npx electron-builder --win --publish never
        env:
          NODE_ENV: production

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: opencode-win-installer
          path: |
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.msi
