name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  build-desktop:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install
        timeout-minutes: 15

      - name: Build CLI (Windows x64)
        run: bun ./packages/opencode/script/build.ts --single --skip-install
        env:
          OPENCODE_CHANNEL: dev
        timeout-minutes: 10

      - name: Copy CLI binary to Tauri sidecar folder
        shell: bash
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          cp packages/opencode/dist/opencode-windows-x64/bin/opencode.exe \
             packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: x86_64-pc-windows-msvc

      - name: Build Tauri desktop (NSIS installer)
        working-directory: packages/desktop
        run: bun run tauri build --target x86_64-pc-windows-msvc --verbose
        timeout-minutes: 30

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-win-x64-installer
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
