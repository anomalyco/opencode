name: stats

on:
  schedule:
    - cron: "0 12 * * *" # Run daily at 12:00 UTC
  workflow_dispatch: # Allow manual trigger

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  stats:
    if: github.repository == 'anomalyco/opencode'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run stats script
        run: bun script/stats.ts
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}

      # dev only accepts pull requests; the OpenCode app may push directly, as publish's release sync does. Its pushes
      # trigger workflows, which [skip ci] avoids for a stats-only commit.
      - name: Setup git committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.OPENCODE_APP_ID }}
          opencode-app-secret: ${{ secrets.OPENCODE_APP_SECRET }}

      - name: Commit stats
        run: |
          git add STATS.md
          git diff --staged --quiet || git commit -m "ignore: update download stats $(date -I) [skip ci]"
          git push
