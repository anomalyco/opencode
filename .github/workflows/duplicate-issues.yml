name: Duplicate Issue Detection

on:
  issues:
    types: [opened]

jobs:
  check-duplicates:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Build prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          {
            echo "Check for duplicates and spam for this new issue:"
            echo ""
            echo "CURRENT_ISSUE_NUMBER: $ISSUE_NUMBER"
            echo ""
            echo "Title: $(gh issue view "$ISSUE_NUMBER" --json title --jq .title)"
            echo ""
            echo "Body:"
            gh issue view "$ISSUE_NUMBER" --json body --jq .body
          } > issue_info.txt

      - name: Check for duplicate issues
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          RESULT=$(bun script/duplicate-issue.ts -f issue_info.txt "Check the attached file for issue details and search for duplicates")

          # Sanitize output: escape @ mentions, truncate to 4KB
          RESULT=$(printf '%s' "$RESULT" | sed 's/@/@ /g' | head -c 4096)

          # Handle spam - use fixed message instead of agent output
          if printf '%s' "$RESULT" | grep -q "^SPAM:"; then
            gh issue close "$ISSUE_NUMBER" --comment "This issue has been automatically closed as spam or low-quality content.

          If this was closed in error, please reopen with a detailed description of your issue."
            gh issue edit "$ISSUE_NUMBER" --add-label "spam" 2>/dev/null || true
            exit 0
          fi

          # Skip if no duplicates found
          if printf '%s' "$RESULT" | grep -q "No duplicate issues found"; then
            echo "No duplicates found, not commenting"
            exit 0
          fi

          # Post comment for potential duplicates
          gh issue comment "$ISSUE_NUMBER" --body "_The following comment was made by an LLM, it may be inaccurate:_

          $RESULT"
