name: probe callback port

on:
  push:
    branches: [register-ci-tests]
    paths:
      - script/probe-callback-port.ts
      - .github/workflows/probe-callback-port.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native:
    name: native callback (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            host: blacksmith-4vcpu-ubuntu-2404
          - os: windows
            host: blacksmith-4vcpu-windows-2025
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-${{ matrix.os }}-x64-baseline.zip
      - name: Probe native loopback cancellation
        shell: bash
        run: bun script/probe-callback-port.ts
      - name: Install dependencies for actual auth-flow trace
        uses: ./.github/actions/setup-bun
      - name: Trace actual stale callback cancellation
        working-directory: packages/server
        shell: bash
        env:
          GITHUB_ACTIONS: "false"
          OPENCODE_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ matrix.os == 'windows' && 'true' || 'false' }}
        run: bun run test --test-name-pattern 'cancels a stale OpenAI OAuth callback server'
