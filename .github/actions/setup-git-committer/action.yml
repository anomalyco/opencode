name: "Setup Git Committer"
description: "Configure git user for automated commits using GITHUB_TOKEN"
inputs:
  token:
    description: "GitHub token (defaults to github.token)"
    required: false
    default: ""
outputs:
  token:
    description: "GitHub token used"
    value: ${{ steps.token.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: Resolve token
      id: token
      run: |
        if [ -n "${{ inputs.token }}" ]; then
          echo "token=${{ inputs.token }}" >> "$GITHUB_OUTPUT"
        else
          echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Configure git user
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      shell: bash

    - name: Clear checkout auth
      run: |
        git config --local --unset-all http.https://github.com/.extraheader || true
      shell: bash

    - name: Configure git remote
      run: |
        git remote set-url origin https://x-access-token:${{ steps.token.outputs.token }}@github.com/${{ github.repository }}
      shell: bash
