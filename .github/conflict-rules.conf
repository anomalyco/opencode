# Upstream sync conflict resolution rules
#
# Format:
# pattern:strategy
#
# Supported strategies:
# ours     = keep our fork/custom version
# theirs   = take upstream version
# escalate = do not auto-resolve; require manual review
#
# Matching semantics:
# Last matching rule wins.
# Put broad rules first and ANR/custom protected rules later.
# This ensures paths like packages/anr-core/README.md resolve as ours
# instead of being caught by a broader README or *.md rule.
#
# NOTE: these rules only handle *textual* merge conflicts. Semantic breaks where
# git auto-merges cleanly but the result fails to compile — or compiles but fails
# at runtime — are NOT caught by these rules. They are caught by the validation
# gate in sync-upstream.sh, which runs a FULL-workspace `bun turbo typecheck`
# (semantic break) AND a FULL-workspace `bun turbo test` (runtime break) after
# resolution. A sync is only marked ready when BOTH gates pass; anything else is
# escalated for manual review. Example of a semantic break this gate catches: the
# 2026-06 sync where ANR-only cli/debug/agents.ts imported core/src/plugin/boot.ts
# after upstream deleted it. Do not rely on a single-package check.

# Files that are generally safe to take from upstream.
docs/*:theirs
doco/*:theirs
*.snap:theirs

# Mixed-ownership files should not be blindly overwritten.
README*:escalate
*.md:escalate
*.lock:escalate
*.json:escalate
*.jsonc:escalate

# Lockfile: keep ours — fork has extra packages upstream doesn't know about.
bun.lock:ours

# Our custom opencode config — always preserve fork version.
.opencode/opencode.jsonc:ours

# ANR/custom workflow and integration areas should be preserved.
.github/workflows/*:ours
.github/scripts/*:ours
.github/conflict-rules.conf:ours
packages/anr-core/*:ours
*auth*:ours
*telemetry*:ours
*provider*:ours
*bedrock*:ours
*aws*:ours
*oidc*:ours
*federation*:ours

# Worker entrypoint must be MANUALLY merged — never auto-resolved as ours OR theirs.
# Learned 2026-06: keeping ours BREAKS THE BUILD — upstream refactored the error
# handlers into named functions (onUnhandledRejection/onUncaughtException) that
# shutdown() deregisters via process.off, so the named form is required. Taking
# theirs DROPS ANR's OTEL + audit-logger init block. Correct resolution is a 3-way
# merge: upstream's named handlers (with ANR logging bodies) + the ANR
# `if (OPENCODE_FLAVOR === "anr")` telemetry/audit block. Escalate so a human does it.
packages/opencode/src/cli/tui/worker.ts:escalate
