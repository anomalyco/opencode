version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/packages/opencode"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
      mcp:
        patterns:
          - "@modelcontextprotocol/*"
          - "@agentclientprotocol/*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
