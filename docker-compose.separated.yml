services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veritly
      POSTGRES_USER: veritly
      POSTGRES_PASSWORD: veritly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritly"]
      interval: 5s
      timeout: 5s
      retries: 5

  opencode-api:
    image: opencode-veritly-api:lean
    ports:
      - "8001:3000"
    env_file:
      - .env.development
    environment:
      - OPENCODE_DISABLE_LOCAL_FILESYSTEM=false
      - DEPLOYMENT_ENVIRONMENT=local
      - DATABASE_URL=postgresql://veritly:veritly@postgres:5432/veritly
      - VERITLY_TENANT_USER_ID=default
      - VERITLY_WS_DEBUG=0
      - WORKOS_REDIRECT_URI=http://localhost:8001/auth/callback
      - PUBLIC_BASE_URL=http://localhost:8000
      - NODE_ENV=development
      - VERITLY_HEALTH_RELAY_URL=
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - opencode-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  opencode-frontend:
    image: opencode-veritly-frontend:lean
    ports:
      - "8000:80"
    env_file:
      - .env.development
    environment:
      - PORT=80
      - FRONTEND_BACKEND_HEALTH_URL=http://opencode-api:3000/healthz
      - FRONTEND_RELAY_HEALTH_URL=http://relay:8080/healthz
      - FRONTEND_RELAY_WS_HEALTH_URL=ws://relay:8080/health/ws
    depends_on:
      opencode-api:
        condition: service_started
      relay:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay:
    image: opencode-veritly-relay:latest
    ports:
      - "18766:8080"
    env_file:
      - .env.development
    environment:
      - PORT=8080
      - RELAY_BACKEND_HEALTH_URL=http://opencode-api:3000/healthz
    depends_on:
      opencode-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  executor:
    image: opencode-veritly-executor:lean
    ports:
      - "7777:7777"
    environment:
      - VERITLY_EXECUTOR_MODE=local

volumes:
  postgres_data:
  opencode-data:
