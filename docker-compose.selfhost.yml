services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --api.dashboard=${TRAEFIK_DASHBOARD:-false}
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --providers.file.directory=/etc/traefik/conf
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/traefik:/etc/traefik/conf:ro
    networks:
      - veritly-edge

  opencode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_UNIVER_BACKEND_URL: ${PUBLIC_BASE_URL:-http://localhost}
        VITE_UNIVER_SDK_WS: ${VITE_UNIVER_SDK_WS:-/relay/ws}
        VITE_UNIVER_LICENSE: ${VITE_UNIVER_LICENSE:-}
        VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY:-}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST:-}
    restart: unless-stopped
    ports:
      - "4096:3000"
    environment:
      PORT: "3000"
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      OPENCODE_HOSTED_MODE: ${OPENCODE_HOSTED_MODE:-1}
      OPENCODE_DISABLE_LOCAL_FILESYSTEM: ${OPENCODE_DISABLE_LOCAL_FILESYSTEM:-1}
      VERITLY_WS_DEBUG: ${VERITLY_WS_DEBUG:-0}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-selfhost}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    volumes:
      - opencode-data:/data
      - ./deploy/opencode/start.sh:/usr/local/bin/start-opencode-selfhost:ro
    depends_on:
      executor-api:
        condition: service_healthy
      relay:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - veritly-edge
      - univer-prod
    command: ["/usr/local/bin/start-opencode-selfhost"]

  opencode-dev:
    image: oven/bun:1.3.10
    profiles:
      - dev
    ports:
      - "4444:4444"
      - "4097:3000"
    environment:
      PORT: "3000"
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      OPENCODE_HOSTED_MODE: ${OPENCODE_HOSTED_MODE:-1}
      OPENCODE_DISABLE_LOCAL_FILESYSTEM: ${OPENCODE_DISABLE_LOCAL_FILESYSTEM:-1}
      VERITLY_WS_DEBUG: ${VERITLY_WS_DEBUG:-0}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-selfhost}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      VITE_UNIVER_BACKEND_URL: ${PUBLIC_BASE_URL:-http://localhost}
      VITE_UNIVER_SDK_WS: ${VITE_UNIVER_SDK_WS:-/relay/ws}
      VITE_UNIVER_LICENSE: ${VITE_UNIVER_LICENSE:-}
      VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY:-}
      VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST:-}
    volumes:
      - opencode-data:/data
      - .:/app
    working_dir: /app
    command: >
      sh -c "apt-get update && apt-get install -y git python3 python3-venv curl &&
             bun install &&
             (bun run --cwd packages/opencode serve --port 3000 --hostname 0.0.0.0 &) &&
             sleep 5 &&
             bun run --cwd packages/app dev --port 4444 --host 0.0.0.0"
    depends_on:
      executor-api:
        condition: service_healthy
      relay:
        condition: service_started
    networks:
      - veritly-edge
      - univer-prod

  relay:
    build:
      context: ./deploy/relay
    restart: unless-stopped
    ports:
      - "18766:8080"
    environment:
      PORT: "8080"
      VERITLY_WS_DEBUG: ${VERITLY_WS_DEBUG:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/relay/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - veritly-edge

  executor-api:
    build:
      context: ./deploy/executor-api
    restart: unless-stopped
    environment:
      PORT: "7777"
      EXECUTOR_DRIVER: ${EXECUTOR_DRIVER:-stub}
      EXECUTOR_PROXY_URL: ${EXECUTOR_PROXY_URL:-}
      VMEXEC_BIN: ${VMEXEC_BIN:-/opt/veritly/bin/veritly-vmexec}
      EXECUTOR_DEFAULT_TIMEOUT_MS: ${EXECUTOR_DEFAULT_TIMEOUT_MS:-120000}
    volumes:
      - ./deploy/executor-api/bin:/opt/veritly/bin:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7777/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - veritly-edge

networks:
  veritly-edge:
    name: veritly-selfhost
  univer-prod:
    external: true
    name: univer-prod

volumes:
  opencode-data: {}
