[workspace]
resolver = "2"
members = [
    "crates/pencode",
    "crates/pencode-core",
    "crates/pencode-protocol",
    "crates/pencode-server",
    "crates/pencode-client",
    "crates/pencode-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kiyosh11/pencode"

[workspace.dependencies]
pencode-protocol = { path = "crates/pencode-protocol" }
pencode-core = { path = "crates/pencode-core" }
pencode-server = { path = "crates/pencode-server" }
pencode-client = { path = "crates/pencode-client" }
pencode-tui = { path = "crates/pencode-tui" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
lto = true
strip = true
