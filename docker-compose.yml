services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4096:4096"
    environment:
      # GitHub OAuth (create at https://github.com/settings/developers)
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET}

      # GitHub org (PAT removed in ADR-0005 Option B — each user's OAuth
      # access token is used server-side for clone/push/PR/membership probes)
      - GITHUB_ORG_NAME=${GITHUB_ORG_NAME:-unleashlive}

      # Public base URL — use ngrok URL when testing remotely
      - OPENCODE_BASE_URL=${OPENCODE_BASE_URL:-http://localhost:4096}

      # Random 32-byte hex string: openssl rand -hex 32
      - SESSION_SECRET=${SESSION_SECRET}

      # Collab workspace root (inside container — maps to named volume)
      - COLLAB_WORKSPACE_ROOT=/var/opencode/workspaces

      # Serve our locally-built app instead of proxying app.opencode.ai
      - OPENCODE_LOCAL_UI_PATH=/app/packages/app/dist
      # Skip the embedded-UI dynamic import (opencode-web-ui.gen.ts).
      # Without this, every GET / hangs waiting for the import to fail, which
      # blocks the health check and all other requests for the entire session.
      - OPENCODE_DISABLE_EMBEDDED_WEB_UI=true

      # Local-dev escape hatch.  The image sets NODE_ENV=production, which now
      # refuses to start without OPENCODE_SERVER_PASSWORD (ADR-0001).  For
      # local docker-compose we want zero ceremony — explicitly opt out.
      # Production deployments MUST omit this and set OPENCODE_SERVER_PASSWORD.
      - OPENCODE_ALLOW_UNAUTHENTICATED=1

      # LLM — use Claude Code subscription credentials (bind-mounted below).
      # Set to "dummy" so opencode's provider loader sees a non-empty value and
      # lets the opencode-claude-auth plugin take over authentication.
      - ANTHROPIC_API_KEY=dummy
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

    volumes:
      # Persistent SQLite database — owned by uid 10001 (ADR-0003).
      - opencode-data:/home/opencode/.local/share/opencode
      # Persistent server-side repo workspaces
      - collab-workspaces:/var/opencode/workspaces
      # Claude Code credentials for opencode-claude-auth plugin (bind-mount from host)
      # To populate: security find-generic-password -s "Claude Code-credentials" -w > ~/.claude/.credentials.json
      - ${HOME}/.claude/.credentials.json:/home/opencode/.claude/.credentials.json:ro
    # Map local.unleashlive.com → 127.0.0.1 inside the container.  The frontend
    # live-preview launcher (collab/preview-launcher.ts) and the preview
    # proxy (collab/preview-router.ts) both rely on the dev server seeing
    # its expected hostname so the frontend's CORS / hostname assumptions
    # don't have to change.  Docker rewrites /etc/hosts on every container
    # start; this map persists across restarts.  On ECS the equivalent is
    # the task definition's `extraHosts` field — see DEPLOYMENT.md Step 5.
    extra_hosts:
      - "local.unleashlive.com:127.0.0.1"
    restart: unless-stopped
    healthcheck:
      # /healthz returns 503 when SQLite is unreachable — finer-grained than
      # GET / (which only fails on a fully-dead Bun process).  See ADR-0008.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4096/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  opencode-data:
  collab-workspaces:
