services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: veritly
      POSTGRES_USER: veritly
      POSTGRES_PASSWORD: veritly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritly"]
      interval: 5s
      timeout: 5s
      retries: 5

  relay:
    image: opencode-veritly-relay:latest
    build:
      context: ..
      dockerfile: packages/relay/Dockerfile
    ports:
      - "18766:8080"
    env_file:
      - ../.env.development
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  executor:
    image: opencode-veritly-executor:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.executor
    ports:
      - "7777:7777"
    environment:
      - PORT=7777
      - VM_INACTIVITY_TIMEOUT_MS=300000
      - KERNEL_PATH=/opt/veritly/vmlinux
      - ROOTFS_PATH=/opt/veritly/rootfs.ext4
      - UNIVER_SDK_WS=ws://relay:8080/ws
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /dev/kvm:/dev/kvm
      - executor_vms:/tmp/veritly-vms

  opencode-api:
    image: opencode-veritly-api:lean
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:3000"
    env_file:
      - ../.env.development
    environment:
      - OPENCODE_DISABLE_LOCAL_FILESYSTEM=false
      - OPENCODE_WORKOS_ENABLED=true
      - DEPLOYMENT_ENVIRONMENT=local
      - DATABASE_URL=postgresql://veritly:veritly@postgres:5432/veritly
      - VERITLY_TENANT_USER_ID=default
      - VERITLY_WS_DEBUG=0
      - WORKOS_REDIRECT_URI=http://localhost:8000/auth/callback
      - PUBLIC_BASE_URL=http://localhost:4444
      - NODE_ENV=development
      - VERITLY_HEALTH_RELAY_URL=
      - VERITLY_EXECUTOR_URL=http://executor:7777
    depends_on:
      postgres:
        condition: service_healthy
      executor:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - univer-prod

volumes:
  postgres_data:
  executor_vms:

networks:
  default:
    name: opencode-veritly-dev
  univer-prod:
    external: true
    name: univer-prod
