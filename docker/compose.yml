name: opencode-prod
services:
  opencode-prod:
    # 镜像由参数 TOOLS_IMAGE 传入（docker/.env 或命令行环境变量），默认追 latest；
    # compose 文件此后无需再改：要锁版本就在 .env 写 digest pin，要最新就写 :latest。
    # 例：TOOLS_IMAGE=swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools:latest
    #     TOOLS_IMAGE=swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools@sha256:aa5f271a82a3b5dc0d8939c3d18b26b3ba76b74105be6b61d3934e46b8416238
    # GHCR 备选（需先 docker login ghcr.io）：
    #     TOOLS_IMAGE=ghcr.io/xieyucheng123/opencode-tools:latest
    image: ${TOOLS_IMAGE:-swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools:latest}
    pull_policy: always
    container_name: opencode-prod
    network_mode: host
    env_file:
      - .env
    volumes:
      - prod-work:/workspace
      - prod-data:/root/.local/share/opencode
      - ./config/home/.aliyun:/root/.aliyun:ro
      - ./config/home/.oci:/root/.oci:ro
      # 宿主机业务目录映射（无此目录的机器会自动建空目录，老会话缺目录会降级显示）：
      - /root/workspace:/old-workspace
    # SSH 全走 .env 控制，compose 文件不用改：
    # 注意：entrypoint 里 shell 变量必须写 $$（单个 $ 会被 compose 当插值吃掉，导致 keyscan 这类逻辑静默跳过）：
    #   SSH_PRIVATE_KEY_B64 私钥注入；SSH_KNOWN_HOSTS 可写死指纹；
    #   SSH_TARGETS（空格分隔）启动时自动 ssh-keyscan 补 known_hosts（缺失重试 3 次）；
    #   SSH_CONFIG_EXTRA 追加到 ~/.ssh/config；
    # 1.21/1.41 是 192.168.1.21/192.168.1.41 短名（自动写 ~/.ssh/config 映射）。
    entrypoint:
      - /bin/sh
      - -c
      - ' yes | hcloud configure set --cli-access-key="$$HCLOUD_AK" --cli-secret-key="$$HCLOUD_SK" --cli-region=cn-north-4 >/dev/null 2>&1; sed -i "s/\"agreePrivacy\": \"false\"/\"agreePrivacy\": \"true\"/" /root/.hcloud/config.json 2>/dev/null; mkdir -p /root/.ssh && chmod 700 /root/.ssh; if [ -n "$$SSH_PRIVATE_KEY_B64" ]; then echo "$$SSH_PRIVATE_KEY_B64" | base64 -d > /root/.ssh/id_ed25519 && chmod 600 /root/.ssh/id_ed25519 && echo "ssh key installed"; fi; if [ -n "$$SSH_KNOWN_HOSTS" ]; then printf "%s\n" "$$SSH_KNOWN_HOSTS" > /root/.ssh/known_hosts && chmod 600 /root/.ssh/known_hosts; fi; grep -q "^Host 1\.21$$" /root/.ssh/config 2>/dev/null || printf "Host 1.21\n  HostName 192.168.1.21\n  HostKeyAlias 192.168.1.21\nHost 1.41\n  HostName 192.168.1.41\n  HostKeyAlias 192.168.1.41\n" >> /root/.ssh/config; if [ -n "$$SSH_CONFIG_EXTRA" ]; then printf "%b\n" "$$SSH_CONFIG_EXTRA" >> /root/.ssh/config; fi; chmod 600 /root/.ssh/config 2>/dev/null || true; if [ -n "$$SSH_TARGETS" ] && command -v ssh-keyscan >/dev/null 2>&1; then touch /root/.ssh/known_hosts && chmod 600 /root/.ssh/known_hosts; missing=1; attempt=0; while [ -n "$$missing" ] && [ "$$attempt" -lt 3 ]; do missing=""; attempt=$$((attempt+1)); for h in $$SSH_TARGETS; do hn="$$h"; case "$$h" in 1.21) hn="192.168.1.21";; 1.41) hn="192.168.1.41";; esac; ssh-keygen -F "$$h" -f /root/.ssh/known_hosts >/dev/null 2>&1 || ssh-keygen -F "$$hn" -f /root/.ssh/known_hosts >/dev/null 2>&1 || { echo "ssh-keyscan: $$hn (try $$attempt)"; ssh-keyscan -T 8 "$$hn" >> /root/.ssh/known_hosts 2>/dev/null || missing="$$missing $$hn"; }; done; [ -n "$$missing" ] && sleep 5; done; [ -n "$$missing" ] && echo "ssh-keyscan missed:$$missing"; fi; if [ ! -d /workspace/.git ]; then git init -b main /workspace >/dev/null 2>&1; git -C /workspace config user.name opencode-prod; git -C /workspace config user.email opencode-prod@local; git -C /workspace commit --allow-empty -m init >/dev/null 2>&1; fi; exec opencode "$$@" '
      - --
    command: serve --port 4097 --hostname 0.0.0.0
    restart: unless-stopped
volumes:
  prod-data:
  prod-work:
