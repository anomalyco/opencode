name: opencode-prod
services:
  opencode-prod:
    # 生产 pin digest（CI 推送的 manifest 双 registry 同 digest；跟版时改这一行）
    image: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools@sha256:94caa60c15393e726c9f16d5ec6a663ebf3c31fa189f7c9f554fbaf7094ca754
    # GHCR 同 digest 备选（需先 docker login ghcr.io）：
    # image: ghcr.io/xieyucheng123/opencode-tools@sha256:94caa60c15393e726c9f16d5ec6a663ebf3c31fa189f7c9f554fbaf7094ca754
    container_name: opencode-prod
    network_mode: host
    env_file:
      - .env
    volumes:
      - prod-work:/workspace
      - prod-data:/root/.local/share/opencode
      - ./config/home/.aliyun:/root/.aliyun:ro
      - ./config/home/.oci:/root/.oci:ro
      # 宿主机业务目录映射（无此目录的机器会自动建空目录，老会话缺目录会降级显示）：
      - /root/workspace:/old-workspace
    entrypoint:
      - /bin/sh
      - -c
      - ' yes | hcloud configure set --cli-access-key="$HCLOUD_AK" --cli-secret-key="$HCLOUD_SK" --cli-region=cn-north-4 >/dev/null 2>&1; sed -i "s/\"agreePrivacy\": \"false\"/\"agreePrivacy\": \"true\"/" /root/.hcloud/config.json 2>/dev/null; mkdir -p /root/.ssh && chmod 700 /root/.ssh; if [ -n "$SSH_PRIVATE_KEY_B64" ]; then echo "$SSH_PRIVATE_KEY_B64" | base64 -d > /root/.ssh/id_ed25519 && chmod 600 /root/.ssh/id_ed25519 && echo "ssh key installed"; fi; if [ -n "$SSH_KNOWN_HOSTS" ]; then printf "%s\n" "$SSH_KNOWN_HOSTS" > /root/.ssh/known_hosts && chmod 600 /root/.ssh/known_hosts; fi; if [ ! -d /workspace/.git ]; then git init -b main /workspace >/dev/null 2>&1; git -C /workspace config user.name opencode-prod; git -C /workspace config user.email opencode-prod@local; git -C /workspace commit --allow-empty -m init >/dev/null 2>&1; fi; exec opencode "$@" '
      - --
    command: serve --port 4097 --hostname 0.0.0.0
    restart: unless-stopped
volumes:
  prod-data:
  prod-work:
