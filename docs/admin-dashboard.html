<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gentle-opencode — Admin Dashboard</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  padding: 24px;
}
.container { max-width: 960px; margin: 0 auto; }
h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
h2 { font-size: 1.1rem; font-weight: 600; margin: 24px 0 12px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
}
.row { display: flex; gap: 16px; flex-wrap: wrap; }
.stat {
  flex: 1;
  min-width: 150px;
  text-align: center;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.stat .value { font-size: 2rem; font-weight: 700; }
.stat .label { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
.stat .value.green { color: var(--green); }
.stat .value.red { color: var(--red); }
.stat .value.yellow { color: var(--yellow); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; font-weight: 500; }
tr:hover { background: rgba(255,255,255,0.03); }
input, button {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 0.9rem;
}
input:focus { border-color: var(--accent); outline: none; }
button {
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  font-weight: 500;
}
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.credit-form { display: flex; gap: 8px; align-items: center; }
.credit-form input { width: 80px; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge.admin { background: var(--yellow); color: #000; }
.badge.user { background: var(--border); color: var(--muted); }
.error { color: var(--red); padding: 12px; background: rgba(248,81,73,0.1); border-radius: var(--radius); }
.loading { color: var(--muted); text-align: center; padding: 40px; }
.login-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.login-form label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <h1>🛡️ gentle-opencode</h1>
  <p style="color:var(--muted);margin-bottom:16px">Admin Dashboard — Control de presupuesto y usuarios</p>

  <div id="login-section" class="card">
    <h2>Conectar al sidecar</h2>
    <div class="login-form">
      <label>URL base<input type="text" id="base-url" value="http://localhost:4096" placeholder="http://localhost:4096"></label>
      <label>Password<input type="password" id="password" placeholder="opencode server password"></label>
      <button onclick="connect()">Conectar</button>
    </div>
    <div id="login-error" class="error" style="display:none;margin-top:12px"></div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="row" id="stats"></div>

    <div class="card">
      <h2>👤 Mi perfil</h2>
      <div id="me-section"></div>
    </div>

    <div class="card" id="admin-section" style="display:none">
      <h2>👥 Usuarios</h2>
      <table>
        <thead>
          <tr><th>Email</th><th>Nombre</th><th>Admin</th><th>Balance</th><th>Total usado</th><th>Último login</th><th>Crédito</th></tr>
        </thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </div>

  <div id="loading" class="loading" style="display:none">Cargando...</div>
</div>

<script>
let AUTH = '';
let BASE = '';

async function connect() {
  BASE = document.getElementById('base-url').value.replace(/\/$/, '');
  const pwd = document.getElementById('password').value;
  AUTH = 'Basic ' + btoa('opencode:' + pwd);
  
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('loading').style.display = 'block';
  
  try {
    const me = await fetch(BASE + '/identity/me', { headers: { Authorization: AUTH } });
    if (!me.ok) throw new Error(me.status === 401 ? 'Password incorrecta' : 'Error ' + me.status);
    
    document.getElementById('login-section').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadDashboard();
  } catch(e) {
    document.getElementById('login-error').textContent = '❌ ' + e.message;
    document.getElementById('login-error').style.display = 'block';
  }
  document.getElementById('loading').style.display = 'none';
}

async function loadDashboard() {
  try {
    const [meRes, usersRes] = await Promise.all([
      fetch(BASE + '/identity/me', { headers: { Authorization: AUTH } }),
      fetch(BASE + '/admin/users', { headers: { Authorization: AUTH } }).catch(() => null)
    ]);
    
    const me = await meRes.json();
    
    // Stats
    let totalBalance = 0, totalUsed = 0, userCount = 0;
    const users = usersRes?.ok ? (await usersRes.json()).users || [] : [];
    users.forEach(u => { userCount++; totalBalance += u.balance || 0; totalUsed += u.lifetimeUsed || 0; });
    
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="value">${userCount}</div><div class="label">Usuarios</div></div>
      <div class="stat"><div class="value green">${totalBalance.toLocaleString()}</div><div class="label">Balance total</div></div>
      <div class="stat"><div class="value yellow">${totalUsed.toLocaleString()}</div><div class="label">Tokens usados</div></div>
      <div class="stat"><div class="value">${me.isAdmin ? '🔑' : '👤'}</div><div class="label">${me.isAdmin ? 'Admin' : 'Usuario'}</div></div>
    `;
    
    // Mi perfil
    document.getElementById('me-section').innerHTML = `
      <table>
        <tr><td style="color:var(--muted)">Email</td><td>${me.email || '-'}</td></tr>
        <tr><td style="color:var(--muted)">Nombre</td><td>${me.displayName || '-'}</td></tr>
        <tr><td style="color:var(--muted)">Balance</td><td><strong>${(me.balance || 0).toLocaleString()}</strong> tokens</td></tr>
        <tr><td style="color:var(--muted)">Rol</td><td><span class="badge ${me.isAdmin ? 'admin' : 'user'}">${me.isAdmin ? 'Admin' : 'Usuario'}</span></td></tr>
      </table>
    `;
    
    // Admin section
    if (me.isAdmin && users.length > 0) {
      document.getElementById('admin-section').style.display = 'block';
      document.getElementById('users-table').innerHTML = users.map(u => `
        <tr>
          <td>${u.email || '-'}</td>
          <td>${u.displayName || '-'}</td>
          <td><span class="badge ${u.isAdmin ? 'admin' : 'user'}">${u.isAdmin ? 'Admin' : 'Usuario'}</span></td>
          <td><strong>${(u.balance || 0).toLocaleString()}</strong></td>
          <td>${(u.lifetimeUsed || 0).toLocaleString()}</td>
          <td style="color:var(--muted);font-size:0.85rem">${u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleDateString() : '-'}</td>
          <td>
            <form class="credit-form" onsubmit="creditUser(event, '${u.id}')">
              <input type="number" id="amount-${u.id}" value="1000" min="1" required>
              <button type="submit">+ Crédito</button>
            </form>
          </td>
        </tr>
      `).join('');
    }
  } catch(e) {
    document.getElementById('stats').innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

async function creditUser(e, userId) {
  e.preventDefault();
  const amount = parseInt(document.getElementById('amount-' + userId).value);
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  btn.textContent = '...';
  
  try {
    const res = await fetch(BASE + '/admin/users/' + userId + '/credit', {
      method: 'POST',
      headers: { Authorization: AUTH, 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, description: 'Crédito manual vía dashboard' })
    });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.message || 'Error ' + res.status); }
    await loadDashboard();
  } catch(err) {
    alert('Error: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '+ Crédito';
}
</script>
</body>
</html>
