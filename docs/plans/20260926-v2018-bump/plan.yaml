  wave_1_task_count: 1
  total_dependencies: 19
  risk_score: medium
tldr: |
  Wave 1 (t0): .gitignore hygiene (geany/workbuddy/catcheer) before any commit.
  Waves 2-4 (t1->t2->t3): SEQUENTIAL retry-Schedule, server disable-auth, channel contract — pathspec-restricted git add, one worktree, no parallel staging.
  Waves 5-7 (t4a/t4b -> t4c -> t5a/t5b): split desktop attach (attach / bench rewrite / CI lane) then split debian (scripts incl. sole-owned electron-builder.config.ts / templates). t4c->t5 edge removes the file race.
  Wave 8 (t6): scoped docs with explicit pathspec allowlist + deny check.
  Wave 9 (t7): strategy-B series/v2.0.18 + 5 fork-patch cherry-picks + verification.
  Wave 10 (t8): forward-port t0-t6 SHAs onto series/v2.0.18 in order + re-verify — closes the orphan scope gap (single PR).
open_questions: []
gaps: []
pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Generated protocol/client types drift from schema after retry-Schedule change
      likelihood: medium
      impact: high
      mitigation: t1 runs bun run generate from packages/client when Protocol/Server HttpApi touched; never hand-edit generated files; gate on bun typecheck exit 0 before commit.
    - scenario: Channel triple-site contract (service+effect+promise) applied inconsistently, breaking desktop attach / debian templates
      likelihood: medium
      impact: high
      mitigation: t3 owns the contract; t4a/t4c/t5b consume read-only and re-run the channel test (exit 0) before committing.
    - scenario: Cherry-pick of 5 fork patches hits unexpected conflict despite zero-overlap prediction
      likelihood: low
      impact: high
      mitigation: Abort cherry-pick on first conflict, preserve series/v2.0.16 worktree untouched, escalate for replan; never force-push or rebase series history.
    - scenario: Forward-port (t8) of new commits conflicts against bumped upstream files on series/v2.0.18
      likelihood: medium
      impact: high
      mitigation: Port in strict t0-t6 order, one SHA at a time with git cherry-pick -x; abort on conflict and escalate with conflicting SHA named; never squash (SHAs must stay traceable).
    - scenario: Sequential staging violated — wrong files land in a commit (parallel-staging regression)
      likelihood: medium
      impact: medium
      mitigation: Every commit task uses explicit pathspec allowlist in git add + pre-commit git status --porcelain deny check; t1->t2->t3 chain is sequential by dependency.
  assumptions:
    - Single shared worktree stays on series/v2.0.16 for t0-t6; t7/t8 use a fresh worktree/branch from v2.0.18 cd9a14a6.
    - remote-auth disposition: 12-file worktree set claimed byte-identical to upstream a97622c801 is SKIPPED; t2 commits only the disable-auth subset and proves the skip with git diff --stat/exit-code (finding 2 fix).
    - Excluded from all commits: docs bulk (only allowlisted findings paths), .workbuddy-ai/, geany noise, build-catcheer-browser/, stray packages/opencode test file (provenance unverified — never staged).
    - Tags v2.0.16/v2.0.17/v2.0.18 present locally; no fetch needed.
    - Branch-name waiver: AGENTS.md prefers short hyphen names without slashes, but series/v2.0.16 and series/v2.0.18 are pre-existing release-lineage conventions — retained verbatim; no new slash branches introduced beyond series/v2.0.18.
    - CI lint lane and dpkg pin versions are verified, not upgraded, in this plan (no dependency bumps).
    - Research source research_findings_v2018-bump-plan.yaml (confidence high) informs t7/t8 ancestry and zero-overlap claims.
implementation_specification:
  code_structure: Series-branch workflow on v2 lineage; sequential ordered conventional commits on series/v2.0.16 worktree (t0-t6), then fresh series/v2.0.18 branch from tag v2.0.18 with 5 cherry-picked fork patches (t7), then ordered forward-port of t0-t6 SHAs onto series/v2.0.18 (t8).
  affected_areas:
    - packages/core
    - packages/cli
    - packages/server
    - packages/protocol
    - packages/schema
    - packages/client
    - packages/desktop
    - scripts
    - debian
  component_details:
    - component: hygiene-ignore
      responsibility: .gitignore coverage for geany/workbuddy/catcheer noise before any commit
      interfaces: [.gitignore patterns]
      dependencies: []
      integration_points: [git status --porcelain clean check in every later task]
    - component: retry-Schedule
      responsibility: Per-provider retry schedule across schema, retry, resolver, llm, compaction, generated types
      interfaces: [provider retry Schedule schema, resolver/llm/compaction consumption]
      dependencies:
        - component: generated client types
          relationship: regenerated via bun run generate, never hand-edited
      integration_points: [packages/client generate step, retry-config test]
    - component: server-auth
      responsibility: Optional server auth via disable-auth (cli env, server-process, service-registration)
      interfaces: [disable-auth env flag, service registration wiring]
      dependencies: []
      integration_points: [server process startup, 2 auth tests, git diff --stat vs a97622c801 proof]
    - component: service-channel
      responsibility: Channel-aware service file triple-site contract (service+effect+promise)
      interfaces: [channel-aware service file path and channel scheme]
      dependencies: []
      integration_points: [desktop attach, debian service templates, channel test]
    - component: desktop-attach-split
      responsibility: Attach to external server split as attach-wiring (t4a) + bench-startup rewrite (t4b) + CI channel lane (t4c); electron-builder.config.ts explicitly NOT touched here
      interfaces: [external-server attach protocol]
      dependencies:
        - component: service-channel
          relationship: consumes channel contract read-only
      integration_points: [CI channel lane, bench-startup isolated review]
    - component: debian-packaging-split
      responsibility: Packaging parity split as scripts incl. sole-owned electron-builder.config.ts (t5a) + service/launcher templates (t5b)
      interfaces: [deb package layout, launcher templates]
      dependencies:
        - component: service-channel
          relationship: consumes channel contract for service templates
      integration_points: [dpkg-deb -c verification]
    - component: v2018-bump-plus-forward-port
      responsibility: New series/v2.0.18 from cd9a14a6 plus cherry-pick of 5 fork patches (t7) then ordered forward-port of t0-t6 (t8) with re-verification
      interfaces: [git refs v2.0.18, series/v2.0.18 branch]
      dependencies:
        - component: wave1-4 commits
          relationship: committed first on series/v2.0.16 worktree; t8 carries them forward so no commit is orphaned
      integration_points: [typecheck, tests, dpkg-deb -c]
