objective: Commit pending series/v2.0.16 work as ordered conventional commits, then bump via strategy B (new series/v2.0.18 from v2.0.18 + cherry-pick 5 fork patches), then forward-port the new commits (t0-t6) onto series/v2.0.18 — single-PR outcome
