plan_id: 20260928-project-list-coverage
objective: If db has sessions with a project/path, make it show in project list with all sessions. All for API/GUI/Web UI + TUI if easy.
created_at: '2026-09-28T00:00:00Z'
created_by: gem-planner
status: pending
research_confidence: high
plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 10
  risk_score: medium
tldr: |
  No new endpoint. Enumerate coverage read-only (project.list + full session.list cursor walk + distinct dirs + E:/ both-spellings + archived/children matrix),
  add solid projectSessions query on existing SessionsQuery contract, build GUI/Web union selector (client order + DB sync + session dirs,
  alias-aware dedupe), wire TUI dialog-open to same query with fallback + story, then verify counts/alias/SEARCH/invalidation E2E.
open_questions:
  - question: Does SEARCH/global cap (5000 sessions index, 512 render, 64/dir) need raising once union adds DB-only projects?
    context: app-home sessions index caps; union increases visible projects without raising session row caps.
    type: nice_to_know
    affects: [gui-1, ver-1]
  - question: Should series-archived parents stay hidden from project list while their children still confer coverage?
    context: Coverage rule says parentID undefined returns roots+children; archived exclusion currently missing.
    type: nice_to_know
    affects: [cov-1, gui-1, ver-1]
pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: Cursor walk terminates early on data.length<limit boundary and misses distinct dirs, union under-covers.
      likelihood: medium
      impact: high
      mitigation: Enforce terminate-only-on-data.length<limit rule, always follow cursor.next, cover in cov-1 matrix + ver-1 count check vs DB.
    - scenario: E:/ alias mismatch hides Windows projects (server verbatim eq vs client aliasPathKey).
      likelihood: medium
      impact: high
      mitigation: Normalize before ?directory= and query both spellings; alias-aware dedupe via enrich; alias matrix in ver-1.
    - scenario: Union breaks open/selection semantics or recentlyClosed restores wrong project.
      likelihood: medium
      impact: medium
      mitigation: Preserve existing order + selection/open semantics in gui-1; keep recentlyClosed path; ver-1 regression on open/select/close.
    - scenario: projectSessions query N+1 per project (per-project loop + orphan sweep + per-dir queries) regresses Home load.
      likelihood: medium
      impact: medium
      mitigation: Key query by projectID with memo/suspense, short-page + sweep only, benchmark baseline before session/timeline edits per AGENTS.md.
  assumptions:
    - No protocol change needed; SessionsQuery project+subpath cursor union (All/Directory/Project) + base64url already sufficient.
    - Never delete Project rows (FK CASCADE); coverage is additive only.
    - NEVER restart app/server during implementation or verification; use bun run dev:live for TUI.
    - Default branch v2 for worktrees and PR targets.
implementation_specification:
  code_structure: Solid client query (packages/client/src/solid/data.ts) over existing generated promise client; Home union selector in packages/app/src/home/projects + sessions controllers; TUI dialog-open resource in packages/tui reusing same query; no Schema/Core/Protocol/Server HttpApi change.
  affected_areas:
    - packages/client/src/solid/data.ts
    - packages/app/src/home/projects
    - packages/app/src/home/sessions
    - packages/tui/src/component/dialog-open.tsx
    - packages/tui/src/component/dialog-session-list.tsx
  component_details:
    - component: projectSessions query
      responsibility: Per-project session coverage using existing SessionsQuery contract, keyed by projectID, with cursor walk + invalidation.
      interfaces: ['projectSessions(projectID) -> Session.Info[]', 'cursor.next loop until data.length<limit', 'sync.data.project invalidation']
      dependencies:
        - component: generated promise client
          relationship: reuses SessionsQuery {project, subpath, directory} union, no regen unless HttpApi touched
      integration_points: ['packages/client/src/solid/data.ts', 'sync.data.project']
    - component: Home union selector
      responsibility: Union client order + DB sync.data.project + distinct session dirs with alias-aware dedupe, preserving order/selection/open/recentlyClosed.
      interfaces: ['projectDirectories allowlist extension', 'enrich() alias-aware dedupe', 'home.project.list merge']
      dependencies:
        - component: projectSessions query
          relationship: consumes per-project coverage for counts and session rows
      integration_points: ['packages/app/src/home/projects/controller.tsx', 'packages/app/src/home/sessions/controller.tsx', 'packages/app/src/home/projects/region.tsx']
    - component: TUI dialog-open projectOptions
      responsibility: Project list via new query resource + local fallback on in-flight/mismatch/error; dialog-session-list scoping already ok.
      interfaces: ['projectOptions resource', 'data.project.sync().then + list() filter', 'session-list.allProjects scope pref']
      dependencies:
        - component: projectSessions query
          relationship: reuses same contract with backslash-norm subpath scoping
      integration_points: ['packages/tui/src/component/dialog-open.tsx', 'packages/tui/src/component/dialog-session-list.tsx']
