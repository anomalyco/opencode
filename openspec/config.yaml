schema: spec-driven

context: |
  项目基于 anomalyco/opencode 的 dev 分支开发，使用 TypeScript、Bun 和 monorepo。
  最终架构固定为：Web 对话窗口与飞书智能体作为用户层；Agent 层包含 Memory、规划、LLM 路由、执行、Skill、MCP Client 和业务查询工具；业务层使用 Nginx + Vue、Tomcat + Spring Boot；正式数据层使用 MySQL，具体部署位置尚未确定，不得擅自描述为云 MySQL。
  业务查询运行链路直接使用迁移后的 MySQL。交付采用并行策略：一期打通飞书 -> Agent -> Skill -> MySQL 业务查询工具，并同步沉淀全链路日志和 gold cases；业务系统并行开发；后续补充 Web 入口和 Agent -> MCP Client -> Spring Boot 链路。
  飞书负责用户准入与授权，智能体项目不建设或复核用户权限系统，也不默认脱敏。项目只消费飞书适配器传递的已验证接入上下文；上下文缺失、过期、伪造或不可验证时必须 fail closed，不得进入数据库工具。正常业务问题和查询结果可进入日志，但密码、Token、完整连接字符串和其他认证秘密绝不得写入日志。
  MySQL 数据库工具按新系统设计使用数据库侧最高权限并支持完整 CRUD；每个 change 仍须明确该能力实际暴露的读写范围、事务、影响行数、写后复核和回滚要求。智能体的业务语义、Agent、Skill、gold cases 和日志接口保持稳定，物理表字段和数据库适配器必须在目标 schema 上核对。
  每个用户问题必须使用追加式全链路事件日志：同时保存完整原始消息和按顺序拆分的用户逐句事件，记录智能体完整回答和逐句事件，并将业务意图、Agent、模型、Prompt、Skill、工具、SQL、参数、执行结果、回答解释、反馈和人工纠正关联到同一个 trace_id。已有事件不得覆盖，纠正通过新事件关联原事件。
  每个数据库 change 必须用 gold cases 量化业务意图、SQL、执行结果和回答解释四层准确率：写操作与高风险用例 100% 通过，读取类总体默认不低于 95%；门槛调整必须在 spec 中明确批准，未达门槛不得归档或发布。
  遵守根 AGENTS.md 的上游开发规则。测试不得从仓库根目录运行；在对应 package 目录运行测试和 bun typecheck。
  OpenSpec 是需求、行为规范、变更状态与归档历史的事实来源；Superpowers 用于 brainstorming、计划、TDD、系统化调试和完成前验证。

rules:
  proposal:
    - 明确业务价值、范围外事项、并行开发依赖和可独立验收的里程碑
    - 不改变已固定的最终架构，除非用户明确批准新的架构变更
    - 数据库变更明确 MySQL 数据范围、实际暴露的读写能力、飞书受信接入上下文边界和准确率发布门槛
    - 涉及对话、Agent、Skill、工具或数据库的变更必须说明逐句日志事件、trace 关联和人工纠正价值
  specs:
    - 每项需求必须包含可验证场景和明确预期结果
    - 数据库相关需求必须覆盖歧义输入、事务失败、影响行数、写后复核或回滚、schema 漂移
    - 数据库 gold cases 必须分别度量业务意图、SQL、执行结果和回答解释；写操作与高风险用例 100%，读取类总体默认不低于 95%
    - 飞书接入上下文缺失、过期、伪造或不可验证时必须 fail closed，且项目不得自行建设或复核用户权限
    - MySQL 场景必须验证 change 批准的读写范围、事务、影响行数、写后复核和回滚，未批准的数据库动作必须失败关闭
    - 每条用户和智能体消息必须同时保留完整原文与有序逐句事件；意图、Agent、模型、Prompt、Skill、工具、SQL、结果、回答、反馈和纠正必须通过 trace_id 可追溯
    - 日志必须追加而非覆盖，并验证认证秘密不入日志；无法可靠拆句时将完整消息作为一个句子，不得改变原意
  design:
    - 明确组件边界、数据流、错误处理、准确率机制和后续业务接入替换点
    - 优先使用 OpenCode 原生 Agent、Skill、MCP、Plugin、Server 和 SDK 扩展点，减少核心源码分叉
    - 数据访问设计必须隔离业务语义与 MySQL 物理表字段，并明确目标 schema、查询口径和适配器边界
    - 日志设计必须使用追加式事件模型，至少包含 conversation_id、turn_id、trace_id、message_id、sentence_id、sentence_index、parent_event_id、事件类型、版本、状态、耗时和关联事件
    - 正常业务数据不默认脱敏，但密码、Token、完整连接字符串和其他认证秘密必须在日志边界外
  tasks:
    - 每项任务必须包含精确文件路径、验证命令和预期结果
    - 实现任务遵循 Superpowers TDD 和 verification-before-completion
    - 数据库任务必须包含批准的读写范围、四层 gold cases、准确率统计、失败关闭证据和未达门槛时阻止归档或发布的检查
    - 日志任务必须验证原始消息、逐句顺序、完整 trace、工具与 SQL 证据、人工纠正、追加不可覆盖和认证秘密排除
    - MySQL 数据映射任务必须核对实际 schema，并输出业务意图、SQL、结果和回答四层差异清单
